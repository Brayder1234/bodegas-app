  function sendWhatsApp(bodega){
    if(!isAdmin()){ showToast('Solo los admin pueden enviar pedidos a bodegas',false); return; }
    var grupos=cartByBodega();
    var g=grupos.find(function(x){return x.bodega===bodega;});
    if(!g){ showToast('No hay productos de esa bodega',false); return; }
    var tel=state.bodegaTels[bodega]||'';
    if(!tel){
      var v=prompt('WhatsApp de la bodega "'+bodega+'" (10 dígitos si es Colombia, o completo con código de país):', '');
      if(v==null) return;
      v=v.trim(); if(!v) return;
      state.bodegaTels[bodega]=v; tel=v; scheduleSave();
      renderCart();
    }
    var num=normTel(tel);
    if(!num || num.length<10){ showToast('Número inválido — revísalo en Bodegas',false); return; }
    var lines=['Hola! Me gustaría hacer el siguiente pedido:',''];
    g.items.forEach(function(it){
      var sub=(it.costo||0)*it.cantidad;
      var linea='• '+it.cantidad+'x '+it.p.nombre;
      if(it.costo>0){
        linea += ' — '+fmt(it.costo)+ (it.cantidad>1 ? ' c/u ('+fmt(sub)+')' : '');
      }
      lines.push(linea);
    });
    lines.push('');
    lines.push('Total unidades: '+g.unidades);
    if(g.subCosto>0) lines.push('*Total: '+fmt(g.subCosto)+'*');
    lines.push('');
    lines.push('¿Me confirmas disponibilidad y forma de pago? Gracias!');
    var txt=lines.join('\n');
    var url='https://wa.me/'+num+'?text='+encodeURIComponent(txt);
    window.open(url,'_blank','noopener');
  }

    document.body.removeChild(ta);
  }

  // Perfil obligatorio: cédula, teléfono, correo, cuenta pago
  function perfilFaltante(u){
    if(!u) return [];
    var f=[];
    if(!(u.cedula||'').trim()) f.push('cédula');
    if(!(u.telefono||'').trim()) f.push('teléfono');
    if(!(u.correo||'').trim()) f.push('correo');
    if(!(u.cuentaPago||'').trim()) f.push('Nequi/Cuenta bancaria');
    return f;
  }
  function saveCart(){
    var t=cartTotals(); if(!t.lineas){ return; }
    // Antes de guardar, verificar perfil completo del usuario que está armando el pedido
    if(session){
      var yo=state.usuarios.find(function(x){return x.id===session.usuarioId;});
      var faltanPerfil=perfilFaltante(yo);
      if(faltanPerfil.length){
        alert('Antes de guardar un pedido debes completar tu perfil.\n\nFaltan estos datos: '+faltanPerfil.join(', ')+'.\n\nAhora te abro "Mi perfil" para que los completes.');
        openMiPerfil();
        return;
      }
    }
    var c=currentCart().cliente;
    var nom=(c.nombre||'').trim(), tel=(c.tel||'').trim(), dir=(c.direccion||'').trim(), ciu=(c.ciudad||'').trim(), notas=(c.notas||'').trim();
    // Validación de envío
    var faltan=[];
    if(!nom) faltan.push('nombre del cliente');
    if(!tel) faltan.push('teléfono');
    if(!dir) faltan.push('dirección');
    if(!ciu) faltan.push('ciudad');
    if(faltan.length){
      showToast('Faltan datos de envío: '+faltan.join(', '), false);
      var first={'nombre del cliente':'nombre','teléfono':'tel','dirección':'direccion','ciudad':'ciudad'}[faltan[0]];
      var el=document.querySelector('[data-cli="'+first+'"]'); if(el){ el.focus(); el.style.outline='2px solid var(--bad)'; setTimeout(function(){el.style.outline='';},1500); }
      return;
    }
    var items=currentCart().items.map(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}) || {};
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p) || {};
      var precioReal=itemVenta(it,p);
      var sug=ventaOf(p);
      return {
        productId:it.productId,
        nombre:p.nombre||'(producto borrado)',
        bodega:it.bodega||(b.bodega||''),
        costo:b.costo||0,
        mayorista:mayoristaOf(p),
        precio:precioReal,        // precio REAL vendido
        precioSugerido:sug,       // precio sugerido en el momento (para historial)
        cantidad:it.cantidad
      };
    });
    var now=new Date().toISOString();
    var byName = session ? session.usuarioNombre : '';
    var order={
      id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      fecha:now,
      cliente:{nombre:nom, tel:tel, direccion:dir, ciudad:ciu, notas:notas},
      items:items,
      costoTotal:t.costo, mayoristaTotal:t.mayorista, ventaTotal:t.venta,
      gananciaEmpresa:t.gananciaEmpresa, gananciaTrabajador:t.gananciaTrabajador, gananciaTotal:t.gananciaTotal,
      ganancia:t.gananciaTotal, // legacy
      unidades:t.unidades,
      usuarioId: session?session.usuarioId:'', usuarioNombre: byName,
      estado: { realizado:{at:now, by:byName}, envio:null, venta:null }
    };
    state.pedidos.unshift(order);
    resetCurrentCart();
    closeCart(); render(); scheduleSave();
    showToast(tPed('SG')+' guardad'+(isAdmin()?'a':'o')+' ✓',false);
    // Notificar por email (fire and forget — no bloquea al usuario)
    (function(){
      enviarEmailPedido(order).then(function(res){
        if(res && res.ok) showToast('📧 Notificación enviada',false);
        // Si falla silenciosamente: el pedido igual quedó guardado
      });
    })();
  }

  /* ---------- historial ---------- */
  var histFilter='__all__'; // '__all__' | usuarioId
  function openHistory(){
    var admin=isAdmin();
    // El trabajador solo ve los suyos
    var list = admin ? state.pedidos.slice() : state.pedidos.filter(function(o){return o.usuarioId===session.usuarioId;});
    if(admin && histFilter!=='__all__') list=list.filter(function(o){return o.usuarioId===histFilter;});
    var hoy=new Date().toISOString().slice(0,10);
    var mes=hoy.slice(0,7);
    var hoyList=list.filter(function(o){return (o.fecha||'').slice(0,10)===hoy;});
    var mesList=list.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
    function sumV(a){return a.reduce(function(x,o){return x+(o.ventaTotal||0);},0);}
    function sumG(a){return a.reduce(function(x,o){
      if(admin) return x + gananciaAdminDe(o);
      var mT=o.mayoristaTotal||0;
      var g=(o.gananciaTrabajador!=null)?o.gananciaTrabajador:((o.ventaTotal||0)-mT);
      return x+g;
    },0);}
    var head='<div class="modal-bd" style="gap:10px">';
    // Selector de usuario (solo admin) — solo si hay más de un usuario o filtro activo
    if(admin && state.usuarios.length>1){
      var opts='<option value="__all__">Todos los usuarios</option>'+
        state.usuarios.slice().sort(function(a,b){return (a.nombre||"").localeCompare(b.nombre||"","es");}).map(function(u){
          var n=state.pedidos.filter(function(o){return o.usuarioId===u.id;}).length;
          return '<option value="'+esc(u.id)+'"'+(histFilter===u.id?' selected':'')+'>'+esc(u.nombre)+' ('+n+')</option>';
        }).join('');
      head+='<div class="tabsrow" style="margin-bottom:0">'+
        '<span style="align-self:center; padding:0 8px; color:var(--muted); font-size:12.5px; font-weight:600">Filtrar por:</span>'+
        '<select id="hist-user" style="flex:1; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink)">'+opts+'</select>'+
      '</div>';
    }
    head+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+
      '<div class="stat"><div class="rail"></div><div class="k">'+(admin?'Ventas':'Pedidos')+'</div><div class="v num">'+list.length+'</div></div>'+
      '<div class="stat"><div class="rail"></div><div class="k">'+(admin?'Ventas mes':'Mis ventas mes')+'</div><div class="v num" style="font-size:19px">'+fmt(sumV(mesList))+'</div></div>'+
      '<div class="stat"><div class="rail"></div><div class="k">'+(admin?'Ganancia mes':'Mi ganancia mes')+'</div><div class="v num" style="font-size:19px">'+fmt(sumG(mesList))+'</div></div>'+
    '</div>';
    head+='<div class="hint">Hoy: '+hoyList.length+' pedido(s) · '+fmt(sumV(hoyList))+' en ventas · '+fmt(sumG(hoyList))+(admin?' de ganancia':' de tu ganancia')+'</div>';
    var body;
    if(!list.length){
      body='<div class="side-empty" style="padding:36px 8px"><div class="em">📋</div><div style="font-weight:700;color:var(--ink)">Aún no hay '+tPed('pl')+'</div><p style="font-size:13.5px">Cuando guardes tu primera '+tPed('sg')+' aparecerá aquí con toda su información.</p></div>';
    }else{
      body=list.map(function(o){
        ensureEstado(o);
        var mayoT=o.mayoristaTotal||0;
        var gTrab=(o.gananciaTrabajador!=null)?o.gananciaTrabajador:((o.ventaTotal||0)-mayoT);
        var gShown = admin ? gananciaAdminDe(o) : gTrab;
        var mg=o.ventaTotal?Math.round(gShown/o.ventaTotal*100):0;
        var fec=new Date(o.fecha||Date.now());
        var fs=fec.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'})+' '+fec.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
        var who = o.usuarioNombre ? ' · <span style="color:var(--accent);font-weight:700">👤 '+esc(o.usuarioNombre)+'</span>' : '';
        var ciudad = (o.cliente&&o.cliente.ciudad)?' · '+esc(o.cliente.ciudad):'';
        var gLabel = admin?'Ganancia':'Mi ganancia';
        // Chips de estado (3 etapas)
        var e1 = 'done', e2 = o.estado.envio ? 'done' : (admin?'action':'pending'), e3 = o.estado.venta ? 'done' : (admin && o.estado.envio ? 'action' : 'pending');
        var chips = '<div class="estado-row">'+
          '<span class="est-chip done"><span class="dot"></span>Realizado</span>'+
          '<span class="est-arrow">›</span>'+
          '<span class="est-chip '+e2+'"'+(admin?' data-act="est-envio"':'')+'><span class="dot"></span>Envío '+(o.estado.envio?'✓':(admin?'confirmar':'pendiente'))+'</span>'+
          '<span class="est-arrow">›</span>'+
          '<span class="est-chip '+e3+'"'+(admin?' data-act="est-venta"':'')+'><span class="dot"></span>'+(admin?'Venta':'Pedido')+' '+(o.estado.venta?'✓':(admin?'confirmar':'pendiente'))+'</span>'+
        '</div>';
        return '<div class="hist-item" data-oid="'+esc(o.id)+'">'+
          '<div class="hd"><span class="cli">👤 '+esc(o.usuarioNombre||'(sin vendedor)')+'</span><span class="fec">'+esc(fs)+'</span></div>'+
          '<div class="tt">'+fmt(o.ventaTotal)+'<div class="mini">'+o.unidades+' unidad'+(o.unidades===1?'':'es')+'</div></div>'+
          chips+
          '<div class="acts">'+
            '<button class="btn ghost" data-act="hist-view">Ver detalle</button>'+
            '<button class="btn ghost" data-act="hist-reopen">Reabrir</button>'+
            (admin||(session&&o.usuarioId===session.usuarioId)?'<button class="btn ghost" data-act="hist-del" style="color:var(--bad)">Eliminar</button>':'')+
          '</div>'+
        '</div>';
      }).join('');
    }
    head+='</div>';
    host.innerHTML='<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(620px,100%)">'+
      '<div class="modal-hd"><h2>📋 '+(admin?'Ventas guardadas':'Mis pedidos')+'</h2><button class="mini" data-role="close">×</button></div>'+
      head+
      '<div style="padding:0 20px 8px">'+body+'</div>'+
      '<div class="modal-ft"><button class="btn ghost" data-role="close" style="margin-left:auto">Cerrar</button></div>'+
    '</div></div>';
    var sel=document.getElementById('hist-user');
    if(sel){ sel.addEventListener('change', function(){ histFilter=sel.value; openHistory(); }); }
  }

  function historyDetail(oid){
    var o=state.pedidos.find(function(x){return x.id===oid;}); if(!o) return;
    var admin=isAdmin();
    var mayoT = o.mayoristaTotal || 0;
    var gTrab = (o.gananciaTrabajador!=null) ? o.gananciaTrabajador : ((o.ventaTotal||0) - mayoT);
    var lines=o.items.map(function(it){
      var mayo=(it.mayorista!=null)?it.mayorista:it.precio;
      if(admin){
        return '<tr><td>'+esc(it.nombre)+'</td><td class="r num">'+it.cantidad+'</td><td class="r num">'+fmt(it.costo)+'</td><td class="r num">'+fmt(mayo)+'</td><td class="r num">'+fmt(it.precio)+'</td><td class="r num">'+fmt((it.precio-it.costo)*it.cantidad)+'</td></tr>';
      }
      return '<tr><td>'+esc(it.nombre)+'</td><td class="r num">'+it.cantidad+'</td><td class="r num">'+fmt(mayo)+'</td><td class="r num">'+fmt(it.precio)+'</td><td class="r num">'+fmt((it.precio-mayo)*it.cantidad)+'</td></tr>';
    }).join('');
    var fec=new Date(o.fecha||Date.now());
    var cli=o.cliente||{};
    var envioBlock='<div class="hint" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);line-height:1.5">'+
      '<b>📦 Envío</b><br>'+
      (cli.direccion?esc(cli.direccion):'<span style="color:var(--faint)">Sin dirección</span>')+
      (cli.ciudad?' · '+esc(cli.ciudad):'')+
      (cli.tel?'<br>📱 '+esc(cli.tel):'')+
      (cli.notas?'<br>📝 '+esc(cli.notas):'')+
    '</div>';
    // Timeline de estado
    ensureEstado(o);
    function fmtWhen(iso){ if(!iso) return ''; var d=new Date(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
    var lbl2=admin?'Venta realizada':'Pedido realizado';
    var envioBtn = admin ? (o.estado.envio
      ? '<button class="undo" data-act="est-envio-off">Deshacer</button>'
      : '<button data-act="est-envio-on">Confirmar envío</button>') : '';
    var ventaBtn = admin ? (o.estado.venta
      ? '<button class="undo" data-act="est-venta-off">Deshacer</button>'
      : (o.estado.envio ? '<button data-act="est-venta-on">Confirmar '+(admin?'venta':'entrega')+'</button>' : '')) : '';
    var timeline=
      '<div class="est-timeline">'+
        '<div class="row done"><span class="icon">✓</span><span class="label">'+tPed('SG')+' realizada</span><span class="when">'+esc(fmtWhen(o.estado.realizado.at))+(o.estado.realizado.by?' · '+esc(o.estado.realizado.by):'')+'</span></div>'+
        '<div class="row '+(o.estado.envio?'done':'pending')+'"><span class="icon">'+(o.estado.envio?'✓':'2')+'</span><span class="label">Envío confirmado</span><span class="when">'+esc(o.estado.envio?fmtWhen(o.estado.envio.at)+(o.estado.envio.by?' · '+esc(o.estado.envio.by):''):'pendiente')+'</span>'+(envioBtn?'<span class="act">'+envioBtn+'</span>':'')+'</div>'+
        '<div class="row '+(o.estado.venta?'done':'pending')+'"><span class="icon">'+(o.estado.venta?'✓':'3')+'</span><span class="label">'+esc(lbl2)+'</span><span class="when">'+esc(o.estado.venta?fmtWhen(o.estado.venta.at)+(o.estado.venta.by?' · '+esc(o.estado.venta.by):''):'pendiente')+'</span>'+(ventaBtn?'<span class="act">'+ventaBtn+'</span>':'')+'</div>'+
      '</div>';
    var mgT=o.ventaTotal?Math.round((o.gananciaTotal||o.ganancia||0)/o.ventaTotal*100):0;
    var mgTr=o.ventaTotal?Math.round(gTrab/o.ventaTotal*100):0;
    var head=admin?'<th>Producto</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">Mayor.</th><th class="r">Cliente</th><th class="r">Ganancia</th>'
                 :'<th>Producto</th><th class="r">Cant.</th><th class="r">Mi costo</th><th class="r">Al cliente</th><th class="r">Mi ganancia</th>';
    host.innerHTML='<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" data-oid="'+esc(o.id)+'" style="width:min(700px,100%)">'+
      '<div class="modal-hd"><h2>'+tPed('SG')+'</h2><button class="mini" data-role="close">×</button></div>'+
      '<div class="modal-bd">'+
        '<div><b>'+esc(cli.nombre||'(sin cliente)')+'</b>'+
          (o.usuarioNombre?' <span class="hint">· realizado por 👤 '+esc(o.usuarioNombre)+'</span>':'')+
          '<div class="hint">'+fec.toLocaleString('es-CO')+'</div></div>'+
        envioBlock+
        timeline+
        '<div style="overflow-x:auto"><table class="btable" style="min-width:'+(admin?560:420)+'px"><thead><tr>'+head+'</tr></thead><tbody>'+lines+'</tbody></table></div>'+
        '<div class="side-tot" style="border-radius:10px">'+
          (admin
            ? (function(){
                var gAdm=gananciaAdminDe(o);
                var mgAdm=o.ventaTotal?Math.round(gAdm/o.ventaTotal*100):0;
                var hechoTrab = o.usuarioNombre && (function(){var u=state.usuarios.find(function(x){return x.id===o.usuarioId;}); return u && u.role==='trabajador';})();
                return '<div class="r"><span>Costo (bodegas)</span><b class="num">'+fmt(o.costoTotal)+'</b></div>'+
                  '<div class="r"><span>Mayorista</span><b class="num">'+fmt(mayoT)+'</b></div>'+
                  '<div class="r"><span>Al cliente</span><b class="num">'+fmt(o.ventaTotal)+'</b></div>'+
                  (hechoTrab?'<div class="r" style="color:var(--muted);font-size:12.5px"><span>↳ Ganancia trabajador</span><b class="num">'+fmt(gTrab)+'</b></div>':'')+
                  '<div class="r gain"><span>Mi ganancia</span><span class="val '+mgClass(mgAdm)+'">'+fmt(gAdm)+' ('+pct(mgAdm)+')</span></div>';
              })()
            : '<div class="r"><span>Mi costo (mayorista)</span><b class="num">'+fmt(mayoT)+'</b></div>'+
              '<div class="r"><span>Al cliente</span><b class="num">'+fmt(o.ventaTotal)+'</b></div>'+
              '<div class="r gain"><span>Mi ganancia</span><span class="val '+mgClass(mgTr)+'">'+fmt(gTrab)+' ('+pct(mgTr)+')</span></div>'
          )+
        '</div>'+
      '</div>'+
      '<div class="modal-ft"><button class="btn ghost" data-role="close">Cerrar</button></div>'+
    '</div></div>';
  }

  /* ---------- init ---------- */
  cfg=loadCfg();
  session=loadSession();
  var cached=loadCache(); if(cached) state=sanitize(cached);
  if(!cfg){ render(); }
  else{
    // Sólo mostrar el splash si NO hay datos locales confiables aún
    // (sin usuarios cargados y sin sesión previa). Si ya hay cache con usuarios,
    // dejamos que la app abra al instante y el pull sincroniza en background.
    var needsBootstrap = !state.usuarios.length && !session;
    if(needsBootstrap) bootstrapping=true;
    setConn('connecting'); render();
    (async function(){
      try{ await pullFromServer(false); setConn('ok'); }
      catch(e){ setConn('err'); showToast('Sin conexión — usando copia local',false); }
      bootstrapping=false;
      render(); startPolling();
      autoStartTutorial();
    })();
  }
})();
</script>
</body>
</html>

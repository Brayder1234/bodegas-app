    galEl.addEventListener('click', function(e){ var b=e.target.closest('[data-role="galrm"]'); if(!b) return; p.galeria.splice(+b.getAttribute('data-i'),1); galRender(); });

    function doClose(){ closeModal(); }
    host.querySelectorAll('[data-role="close"]').forEach(function(b){ b.addEventListener('click',doClose); });
    host.querySelector('[data-role="scrim"]').addEventListener('mousedown',function(e){ if(e.target===e.currentTarget) doClose(); });
    host.querySelector('[data-role="save"]').addEventListener('click',function(){
      var g=function(f){ var el=modal.querySelector('[data-f="'+f+'"]'); return el?el.value:''; };
      p.nombre=g('nombre').trim(); p.sku=g('sku').trim(); p.notas=g('notas').trim();
      var mv=g('marca').trim();
      if(mv==='__new__') mv='';
      p.marca = mv ? (findMarcaCanonica(mv) || mv) : '';
      if(p.marca) ensureMarca(p.marca);
      var pv=parseFloat(g('precioVenta')); p.precioVenta=isNaN(pv)?0:pv;
      var pm=parseFloat(g('precioMayorista')); p.precioMayorista=isNaN(pm)?0:pm;
      var stRaw=(g('stock')||'').trim();
      if(stRaw===''){ p.stock=null; }
      else { var st=parseInt(stRaw,10); p.stock=isNaN(st)?null:Math.max(0,st); }
      var tipoSel = modal.querySelector('input[name="tipo"]:checked');
      p.tipo = tipoSel ? tipoSel.value : 'normal';
      var costos=[];
      if(p.tipo==='normal'){
        rowsEl.querySelectorAll('.cost-row').forEach(function(r){ var bEl=r.querySelector('[data-role="bod"]'); var bod=bEl?(bEl.value==='__new__'?'':bEl.value.trim()):''; var costo=parseFloat(r.querySelector('[data-role="costo"]').value); if(bod){ costos.push({bodega:bod,costo:isNaN(costo)?0:costo}); ensureBodegaEnSeccion(bod); } });
      }
      p.costos=costos;
      var comps=[];
      if(p.tipo==='combo'){
        crowsEl.querySelectorAll('.comp-row').forEach(function(r){
          var pid=(r.querySelector('[data-role="cprod"]').value||'').trim();
          var q=parseFloat(r.querySelector('[data-role="ccant"]').value); if(isNaN(q)||q<1) q=1;
          if(pid) comps.push({productoId:pid, cantidad:Math.round(q)});
        });
      }
      p.componentes=comps;
      // Recoger variaciones con precio
      varRowsPrecio.querySelectorAll('.var-row').forEach(function(r, idx){
        var nameInp = r.querySelector('[data-role="vname"]');
        var pvInp = r.querySelector('[data-role="vpv"]');
        var pmInp = r.querySelector('[data-role="vpm"]');
        var coInp = r.querySelector('[data-role="vco"]');
        if(!p.variaciones[idx]) return;
        if(nameInp) p.variaciones[idx].nombre = nameInp.value.trim();
        if(pvInp){ var pvV = parseFloat(pvInp.value); p.variaciones[idx].precioVenta = (!isNaN(pvV)&&pvV>0) ? pvV : ''; }
        if(pmInp){ var pmV = parseFloat(pmInp.value); p.variaciones[idx].precioMayorista = (!isNaN(pmV)&&pmV>0) ? pmV : ''; }
        if(coInp){ var coV = parseFloat(coInp.value); p.variaciones[idx].costo = (!isNaN(coV)&&coV>=0) ? coV : ''; }
      });
      p.variaciones = p.variaciones.filter(function(v){ return v.nombre || v.precioVenta || v.precioMayorista; });
      if(!p.variaciones.length) p.tipoVariacion = '';
      syncStock(p);

      // Recoger variaciones visuales (color/talla)
      var teniaStockColor = colorStockOn(prod||{});
      varRowsColor.querySelectorAll('.var-row').forEach(function(r, idx){
        var nameInp = r.querySelector('[data-role="vname-color"]');
        var stInp = r.querySelector('[data-role="vstock-color"]');
        if(!p.variacionesColor[idx]) return;
        if(nameInp) p.variacionesColor[idx].nombre = nameInp.value.trim();
        if(stInp){ var sv=parseInt(stInp.value,10); if(stInp.value!=='' && !isNaN(sv) && sv>=0) p.variacionesColor[idx].stock=sv; else delete p.variacionesColor[idx].stock; }
        var gnInp = r.querySelector('[data-role="vgen-color"]');
        if(gnInp){ if(gnInp.value) p.variacionesColor[idx].genero=gnInp.value; else delete p.variacionesColor[idx].genero; }
      });
      p.variacionesColor = p.variacionesColor.filter(function(v){ return v.nombre || v.imagen; });
      if(!p.variacionesColor.length) p.tipoVariacionColor = '';
      if(colorStockOn(p) && !varStockOn(p)) syncStock(p);
      else if(teniaStockColor && !varStockOn(p)) p.stock = null;     // quitó el control por talla: vuelve a "sin límite"

      if(!p.variaciones.length) p.tipoVariacion = '';
      if(!p.nombre){ modal.querySelector('[data-f="nombre"]').focus(); return; }
      if(p.tipo==='combo' && !comps.length){ showToast('El combo necesita al menos un producto', false); return; }
      var wv=modal.querySelector('[data-role="webvis"]'); p.webVisible = wv ? wv.checked : true;
      var pr=modal.querySelector('[data-role="propia"]'); p.propia = pr ? pr.checked : true;
      p.genero=g('genero'); if(!p.genero) delete p.genero; p.webColor=g('webColor').trim(); p.webEtiqueta=g('webEtiqueta').trim(); p.webDesc=g('webDesc').trim();
      if(isNew) state.productos.push(p); else { var i=state.productos.findIndex(function(x){return x.id===p.id;}); if(i>=0) state.productos[i]=p; else state.productos.push(p); }
      closeModal(); render(); scheduleSave();
    });
    setTimeout(function(){ var n=modal.querySelector('[data-f="nombre"]'); if(n) n.focus(); },30);
  }

  /* ---------- modal bodegas ---------- */
  function openBodegas(){
    var sec = activeSection || 'maquillaje';
    var secNombre = ((state.secciones||[]).find(function(x){return x.id===sec;})||{}).nombre || sec;
    function currentBods(){ return bodegasDeSeccion(); }
    function rows(){
      var bods = currentBods();
      if(!bods.length) return '<p class="hint">No hay bodegas en esta sección. Se crean solas cuando las escribes en un producto, o agrégalas abajo.</p>';
      return bods.map(function(b,i){
        var uses=productosDeSeccion().filter(function(p){ return (p.costos||[]).some(function(c){return c.bodega===b;}); }).length;
        var tel=state.bodegaTels[b]||'';
        return '<div class="bod-row" data-i="'+i+'">'+
          '<div class="bod-row-line">'+
            '<input type="text" data-role="bname" value="'+esc(b)+'" placeholder="Nombre de la bodega">'+
            '<span class="hint">'+uses+' prod.</span>'+
            '<button class="mini del" data-role="bdel" title="Eliminar">🗑</button>'+
          '</div>'+
          '<div class="bod-row-line" style="margin-top:6px">'+
            '<span class="wa-ic" title="WhatsApp">📱</span>'+
            '<input type="tel" data-role="btel" inputmode="tel" value="'+esc(tel)+'" placeholder="WhatsApp — ej: 3001234567">'+
          '</div>'+
        '</div>';
      }).join('');
    }
    host.innerHTML='<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(480px,100%)">'+
      '<div class="modal-hd"><h2>Bodegas de '+esc(secNombre)+'</h2><button class="mini" data-role="close">×</button></div>'+
      '<div class="modal-bd">'+
        '<p class="hint">Estas bodegas son únicas para la sección <b>'+esc(secNombre)+'</b>. Guarda el WhatsApp de cada una para enviar el pedido con un toque (en Colombia basta con 10 dígitos).</p>'+
        '<div data-role="blist">'+rows()+'</div>'+
        '<div class="list-row" style="border:none;padding-top:10px"><input type="text" data-role="bnew" placeholder="Agregar bodega nueva a '+esc(secNombre)+'…"><button class="btn ghost" data-role="badd">Agregar</button></div>'+
      '</div>'+
      '<div class="modal-ft"><button class="btn ghost" data-role="close">Cancelar</button><button class="btn primary" data-role="bsave">Guardar</button></div></div></div>';
    var modal=host.querySelector('.modal'), listEl=host.querySelector('[data-role="blist"]');
    function reRows(){ listEl.innerHTML=rows(); }
    host.querySelector('[data-role="badd"]').addEventListener('click',function(){
      var inp=modal.querySelector('[data-role="bnew"]'); var v=inp.value.trim();
      var bods=currentBods();
      if(v&&bods.indexOf(v)<0){ bods.push(v); ensureBodegaEnSeccion(v); reRows(); }
      inp.value=''; inp.focus();
    });
    listEl.addEventListener('click',function(e){
      if(e.target.matches('[data-role="bdel"]')){
        var bods=currentBods();
        var i=+e.target.closest('.bod-row').getAttribute('data-i'); var name=bods[i];
        var uses=productosDeSeccion().filter(function(p){ return (p.costos||[]).some(function(c){return c.bodega===name;}); }).length;
        if(uses>0){ showToast('“'+name+'” está en uso por '+uses+' producto(s)',false); return; }
        bods.splice(i,1); delete state.bodegaTels[name]; reRows();
      }
    });
    function doClose(){ closeModal(); }
    host.querySelectorAll('[data-role="close"]').forEach(function(b){ b.addEventListener('click',doClose); });
    host.querySelector('[data-role="scrim"]').addEventListener('mousedown',function(e){ if(e.target===e.currentTarget) doClose(); });
    host.querySelector('[data-role="bsave"]').addEventListener('click',function(){
      var rowsN=listEl.querySelectorAll('.bod-row');
      var bods=currentBods();
      var newList=[]; var newTels=Object.assign({}, state.bodegaTels||{});
      rowsN.forEach(function(row){
        var oldName=bods[+row.getAttribute('data-i')];
        var nv=row.querySelector('[data-role="bname"]').value.trim();
        var tel=row.querySelector('[data-role="btel"]').value.trim();
        if(!nv){ newList.push(oldName); if(tel) newTels[oldName]=tel; return; }
        if(nv!==oldName){
          // Renombrar en productos de esta sección
          productosDeSeccion().forEach(function(p){ (p.costos||[]).forEach(function(c){ if(c.bodega===oldName) c.bodega=nv; }); });
          if(oldName && newTels[oldName]!=null){ delete newTels[oldName]; }
        }
        newList.push(nv);
        if(tel) newTels[nv]=tel; else delete newTels[nv];
      });
      // Guardar dedupeado en la sección activa
      var dedup = newList.filter(function(v,i){ return v && newList.indexOf(v)===i; });
      state.bodegasPorSeccion[sec] = dedup;
      // Espejo global (unión)
      var unionSet = {};
      Object.keys(state.bodegasPorSeccion).forEach(function(k){ (state.bodegasPorSeccion[k]||[]).forEach(function(b){ unionSet[b]=1; }); });
      state.bodegas = Object.keys(unionSet);
      state.bodegaTels = newTels;
      closeModal(); render(); scheduleSave();
    });
  }

    var admin=isAdmin();
    var mesKey=new Date().toISOString().slice(0,7);
    var mesNombre=new Date().toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    var secR=activeSection||'maquillaje';
    var res=state.premioResumen && state.premioResumen.secciones ? (state.premioResumen.secciones[secR]||{vendido:0,pagado:0,n:0,vendedores:{}}) : null;
    var vendedores={};
    trabajadoresSoloDe(secR).forEach(function(u){
      vendedores[u.id]={uid:u.id, nombre:u.nombre, ventas:0, total:0};

      '<p class="rk-meta-n">Para que haya premio, entre todos deben vender más de '+fmt(meta)+' en el mes. Solo cuentan las ventas de referencias propias.'+(admin?' Ya pagadas por los clientes: '+fmt(pag)+'.':'')+'</p></div>'):'';
    var tycTxt=(state.premioTyC||'').trim();

    var metaEditor=admin?'<div class="rank-premio"><label>🎯 Meta grupal para que haya premio (venta total del mes entre todos)</label>'+
      '<div style="display:flex;gap:8px;align-items:center"><input type="number" inputmode="numeric" id="rank-meta" value="'+(meta||'')+'" placeholder="15000000" style="flex:1"><span>'+state.moneda+'</span>'+

  /* ---------- exportar / respaldo ---------- */
  function download(filename, text, mime){
    var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }
  function exportCSV(){
    var rows=[['Producto','SKU','Precio venta','Bodega','Costo','Ganancia','Margen %','Mejor opción']];
    state.productos.forEach(function(p){ var b=best(p);
      (p.costos||[]).forEach(function(c){ var gan=(p.precioVenta&&c.costo)?p.precioVenta-c.costo:''; var m=marginPct(p.precioVenta,c.costo);
        rows.push([p.nombre,p.sku||'',p.precioVenta||'',c.bodega,c.costo||'',gan,m==null?'':Math.round(m),(b&&c.bodega===b.bodega&&c.costo===b.costo)?'Sí':'']); });
      if(!(p.costos||[]).length) rows.push([p.nombre,p.sku||'',p.precioVenta||'','','','','','']); });
    var csv=rows.map(function(r){ return r.map(function(cell){ var s=String(cell==null?'':cell); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(','); }).join('\r\n');
    download('bodegas-margenes.csv','﻿'+csv,'text/csv;charset=utf-8'); showToast('CSV exportado',false);
  }
  function backup(){ download('respaldo-bodegas-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(state,null,2),'application/json'); showToast('Respaldo descargado',false); }
  function doImport(){ document.getElementById('file-import').click(); }
  document.getElementById('file-import').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{ var d=JSON.parse(rd.result); d=sanitize(d);
      if(confirm('Esto reemplazará los datos actuales con los del respaldo ('+d.productos.length+' productos). ¿Continuar?')){ state=d; closeModal(); render(); if(cfg) scheduleSave(); else { cacheState(); } showToast('Respaldo restaurado',false); }
    }catch(err){ alert('El archivo no es un respaldo válido.'); } e.target.value=''; };
    rd.readAsText(f);
  });

  /* ---------- ripple effect en botones ---------- */
  document.addEventListener('pointerdown', function(e){
    var b = e.target.closest('.btn, .icon-btn, .pcard-add, .pcard-stock-btn');
    if(!b || b.disabled) return;
    var r = b.getBoundingClientRect();
    b.style.setProperty('--rx', (e.clientX - r.left) + 'px');
    b.style.setProperty('--ry', (e.clientY - r.top) + 'px');
    b.classList.remove('rippling');
    // force reflow
    void b.offsetWidth;
    b.classList.add('rippling');
    setTimeout(function(){ b.classList.remove('rippling'); }, 600);
  });

      if(marcaUpper(nv2)!==marcaUpper(oldM) && findMarcaCanonica(nv2)){ showToast('Ya existe una marca con ese nombre',false); return; }
      var secMarcas = marcasDeSeccion();
      var idx=secMarcas.findIndex(function(x){return marcaUpper(x)===marcaUpper(oldM);});

      // Renombrar solo productos de esta sección

      var oi=(state.marcasOcultas||[]).findIndex(function(x){return marcaUpper(x)===marcaUpper(oldM);});
      if(oi>=0) state.marcasOcultas[oi]=nv2;

      var idxG = (state.marcas||[]).findIndex(function(x){return marcaUpper(x)===marcaUpper(oldM);});

        state.marcasPorSeccion[secKey] = state.marcasPorSeccion[secKey].filter(function(x){return marcaUpper(x)!==upperM;});
      }
      productosDeSeccion().forEach(function(pp){ if(marcaUpper(pp.marca)===upperM) pp.marca=''; });

      Object.keys(state.marcasPorSeccion||{}).forEach(function(k){ (state.marcasPorSeccion[k]||[]).forEach(function(x){ unionM[marcaUpper(x)]=x; }); });
      state.marcas = Object.keys(unionM).map(function(k){return unionM[k];});

  function pedidoToEmailText(order){
    var lines=[];
    lines.push('🛍️ NUEVO PEDIDO');
    lines.push('');
    lines.push('👤 Cliente: '+(order.cliente&&order.cliente.nombre||'(sin nombre)'));
    if(order.cliente&&order.cliente.tel) lines.push('📱 Tel: '+order.cliente.tel);
    if(order.cliente&&order.cliente.direccion) lines.push('📍 Dirección: '+order.cliente.direccion+(order.cliente.ciudad?', '+order.cliente.ciudad:''));
    if(order.cliente&&order.cliente.notas) lines.push('📝 Notas: '+order.cliente.notas);
    if(order.usuarioNombre) lines.push('');
    if(order.usuarioNombre) lines.push('Realizado por: '+order.usuarioNombre);
    lines.push('');
    lines.push('PRODUCTOS:');
    (order.items||[]).forEach(function(it){
      var _extras=[]; if(it.variacionNombre) _extras.push(it.variacionNombre+(it.tipoVariacion||'')); if(it.variacionColorNombre) _extras.push((it.tipoVariacionColor?it.tipoVariacionColor+': ':'')+it.variacionColorNombre);
      lines.push('  • '+it.cantidad+'x '+it.nombre+(_extras.length?' ('+_extras.join(', ')+')':'')+' — '+fmt(it.precio)+' c/u = '+fmt(it.precio*it.cantidad));
    });
    lines.push('');
    lines.push('Unidades: '+order.unidades);
    if(order.mayoristaTotal) lines.push('Mayorista total: '+fmt(order.mayoristaTotal));
    lines.push('TOTAL AL CLIENTE: '+fmt(order.ventaTotal));
    if(order.costoTotal!=null) lines.push('Costo bodegas: '+fmt(order.costoTotal));
    if(order.gananciaTotal!=null) lines.push('Ganancia total: '+fmt(order.gananciaTotal));
    lines.push('');
    lines.push('Fecha: '+new Date(order.fecha||Date.now()).toLocaleString('es-CO'));
    return lines.join('\n');
  }

  async function enviarEmailPedido(order){
    var ne=state.notifEmail||{};
    if(!ne.enabled){ return {skipped:true}; }
    var fromName=(ne.fromName||'Billon').trim() || 'Billon';
    // Junto todas las keys: la principal + las adicionales del array keys[]
    var allKeys=[];
    if(ne.accessKey) allKeys.push({label:'principal', key:ne.accessKey});
    (ne.keys||[]).forEach(function(k){
      if(k && k.key && String(k.key).trim()) allKeys.push({label:(k.label||'admin').trim(), key:String(k.key).trim()});
    });
    if(!allKeys.length){ return {skipped:true, reason:'no-keys'}; }
    var subject='🛍️ '+fromName+' — Nuevo pedido — '+((order.cliente&&order.cliente.nombre)||'sin cliente')+' — '+fmt(order.ventaTotal);
    var results=[];
    for(var i=0;i<allKeys.length;i++){
      var body={access_key: allKeys[i].key, subject: subject, from_name: fromName, message: pedidoToEmailText(order)};
      try{
        var r=await fetch('https://api.web3forms.com/submit', {
          method:'POST',
          headers:{'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify(body)
        });
        var j=await r.json().catch(function(){return {};});
        results.push({label:allKeys[i].label, ok:r.ok && j.success!==false, response:j});
      }catch(e){ results.push({label:allKeys[i].label, ok:false, error:String(e)}); }
    }
    var allOk=results.every(function(x){return x.ok;});
    return {ok:allOk, results:results, count:allKeys.length};
  }

  function endTutorial(marcarVisto){
    // Ejecuta onExit del paso actual
    var cur=tutState.steps[tutState.index];
    if(cur && typeof cur.onExit==='function'){ try{ cur.onExit(); }catch(e){} }
    document.querySelectorAll('.tut-overlay, .tut-card, .tut-halo').forEach(function(el){ el.remove(); });
    // Limpieza universal
    tutCleanupDemoCart();
    tutCloseCartPanel();
    tutCloseMenu();
    if(marcarVisto && session){
      var u=state.usuarios.find(function(x){return x.id===session.usuarioId;});
      if(u && !u.tutorialVisto){ u.tutorialVisto=true; scheduleSave(); }
    }
  }
  function renderTutorial(){
    // Ejecuta onExit del paso anterior (si cambió el índice)
    if(tutState.prevIndex>=0 && tutState.prevIndex!==tutState.index){
      var prev=tutState.steps[tutState.prevIndex];
      if(prev && typeof prev.onExit==='function'){ try{ prev.onExit(); }catch(e){} }
    }
    document.querySelectorAll('.tut-overlay, .tut-card, .tut-halo').forEach(function(el){ el.remove(); });
    var step=tutState.steps[tutState.index]; if(!step) return endTutorial(true);
    // Ejecuta onEnter del paso actual
    if(typeof step.onEnter==='function'){ try{ step.onEnter(); }catch(e){} }
    tutState.prevIndex=tutState.index;
    // Overlay pleno SOLO si no hay elemento a resaltar (el halo crea el spotlight cuando hay uno)
    var el = step.sel ? document.querySelector(step.sel) : null;
    if(!el && !step.sel){
      // Solo fondo oscuro cuando no hay ningún elemento a resaltar (paso final)
      var overlay=document.createElement('div'); overlay.className='tut-overlay';
      document.body.appendChild(overlay);
    }
    var card=document.createElement('div'); card.className='tut-card';
    var n=tutState.index+1, tot=tutState.steps.length;
    var isLast=(n===tot);
    var dots=''; for(var i=0;i<tot;i++){ dots += '<span class="dot'+(i===tutState.index?' on':'')+'"></span>'; }
    card.innerHTML=
      '<div class="step">Paso '+n+' de '+tot+' <button class="skip" data-tut="skip">Cerrar tutorial</button></div>'+
      '<h3>'+esc(step.title)+'</h3><p>'+esc(step.body)+'</p>'+
      '<div class="nav">'+
        '<div class="dots">'+dots+'</div>'+
        '<div class="btns">'+
          (tutState.index>0 ? '<button data-tut="prev">Atrás</button>' : '')+
          (isLast ? '<button class="next" data-tut="done">¡Entendido!</button>' : '<button class="next" data-tut="next">Siguiente</button>')+
        '</div>'+
      '</div>';
    document.body.appendChild(card);
    tutState.currentCard=card;
    if(el){
      positionTutHalo(el, card);
    } else {
      // Sin elemento a la primera: intento hasta 3 veces con delay (por si openCart/openMenu tarda)
      if(step.sel){
        var attempts=0;
        var iv=setInterval(function(){
          attempts++;
          var el2=document.querySelector(step.sel);
          if(el2){ clearInterval(iv); positionTutHalo(el2, card); return; }
          if(attempts>=8){ clearInterval(iv); centerCard(card); }
        }, 120);
      } else {
        centerCard(card);
      }
    }
  }
  function centerCard(card){
    card.style.top='50%'; card.style.left='50%'; card.style.transform='translate(-50%,-50%)';
  }
  function positionTutHalo(el, card){
    // Quitar halo anterior si existe
    document.querySelectorAll('.tut-halo').forEach(function(h){ h.remove(); });
    el.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){
      var r=el.getBoundingClientRect();
      var halo=document.createElement('div'); halo.className='tut-halo';
      halo.style.top=(r.top-6)+'px'; halo.style.left=(r.left-6)+'px';
      halo.style.width=(r.width+12)+'px'; halo.style.height=(r.height+12)+'px';
      document.body.appendChild(halo);
      // Posicionar card debajo/arriba/al lado
      var cw=card.offsetWidth||320, ch=card.offsetHeight||160;
      var vw=window.innerWidth, vh=window.innerHeight;
      var top, left;
      if(r.bottom + ch + 20 <= vh){
        top = r.bottom + 16;
        left = Math.min(Math.max(12, r.left), vw - cw - 12);
      } else if(r.top - ch - 20 >= 0){
        top = r.top - ch - 16;
        left = Math.min(Math.max(12, r.left), vw - cw - 12);
      } else {
        top = Math.max(12, (vh - ch)/2);
        left = Math.max(12, (vw - cw)/2);
      }
      card.style.top=top+'px'; card.style.left=left+'px'; card.style.transform='none';
    }, 350);
  }
  function tutNav(dir){
    if(dir==='next'){ tutState.index++; if(tutState.index>=tutState.steps.length){ endTutorial(true); return; } renderTutorial(); }
    else if(dir==='prev'){ tutState.index=Math.max(0,tutState.index-1); renderTutorial(); }
    else if(dir==='done'){ endTutorial(true); showToast('¡A vender! 💪',false); }
    else if(dir==='skip'){ endTutorial(true); }
  }

  /* ---------- carrito / pedido ---------- */
  function addToCart(pid, variacion, variacionColor){
    var p=state.productos.find(function(x){return x.id===pid;}); if(!p) return;
    if(typeof p.stock==='number' && p.stock===0 && !isAdmin()){
      showToast('Producto agotado', false); return;
    }
    var hasVarPrecio = Array.isArray(p.variaciones) && p.variaciones.length;
    var hasVarColor = Array.isArray(p.variacionesColor) && p.variacionesColor.length;
    // Si tiene variaciones y no se pasaron todas las necesarias, abrir el selector
    if((hasVarPrecio && !variacion) || (hasVarColor && !variacionColor)){
      openVariacionPicker(p, variacion, variacionColor); return;
    }
    if(variacion && varStockOn(p) && !isAdmin()){
      var vSt = p.variaciones.find(function(x){ return x.id===variacion.id; });
      if(vSt && !(vSt.stock>0)){ showToast('Ese tamaño está agotado', false); return; }
    }
    var varId = variacion ? variacion.id : '';
    var varNm = variacion ? variacion.nombre : '';
    var vcId = variacionColor ? variacionColor.id : '';
    var vcNm = variacionColor ? nomVarColor(variacionColor) : '';
    var it=currentCart().items.find(function(x){
      return x.productId===pid && (x.variacionId||'')===varId && (x.variacionColorId||'')===vcId;
    });
    if(it){ it.cantidad++; }
    else {
      var b=best(p);
      var line = {productId:pid, bodega:b?b.bodega:'', cantidad:1};
      if(varId){ line.variacionId=varId; line.variacionNombre=varNm; }
      if(vcId){ line.variacionColorId=vcId; line.variacionColorNombre=vcNm; }
      currentCart().items.push(line);
    }
    var extra = [];
    if(varNm) extra.push((p.tipoVariacion||'')+varNm);
    if(vcNm) extra.push(vcNm);
    showToast('Añadido al pedido' + (extra.length?' · '+extra.join(' · '):''), false);
    render(); scheduleSave();
  }
  function findCartLine(pid, vid, vcid){
    return currentCart().items.find(function(x){
      return x.productId===pid && (x.variacionId||'')===(vid||'') && (x.variacionColorId||'')===(vcid||'');
    });
  }
  function changeQty(pid, delta, vid, vcid){
    var it=findCartLine(pid, vid||'', vcid||'');
    if(!it) return;
    it.cantidad+=delta;
    if(it.cantidad<=0) currentCart().items=currentCart().items.filter(function(x){
      return !(x.productId===pid && (x.variacionId||'')===(vid||'') && (x.variacionColorId||'')===(vcid||''));
    });
    renderCart(); refreshProds(); updateFab(); scheduleSave();
  }
  function setLineBodega(pid, bodega, vid, vcid){
    var it=findCartLine(pid, vid||'', vcid||'');
    if(!it) return;
    it.bodega=bodega; renderCart(); scheduleSave();
  }
  function removeLine(pid, vid, vcid){
    currentCart().items=currentCart().items.filter(function(x){
      return !(x.productId===pid && (x.variacionId||'')===(vid||'') && (x.variacionColorId||'')===(vcid||''));
    });
    renderCart(); refreshProds(); updateFab(); scheduleSave();
  }

  function openVariacionPicker(p, preVarP, preVarC){
    var varsP = Array.isArray(p.variaciones) ? p.variaciones : [];
    var varsC = Array.isArray(p.variacionesColor) ? p.variacionesColor : [];
    var hasP = varsP.length > 0;
    var hasC = varsC.length > 0;
    if(!hasP && !hasC){ return; }
    var state_pick = { varP: preVarP || null, varC: preVarC || null };

    function section(titulo, vars, kind, tipo){
      var picked = kind==='p' ? state_pick.varP : state_pick.varC;
      return '<div class="vp-section">'+
        '<div class="vp-section-hd">'+esc(titulo)+'</div>'+
        '<div class="var-picker-grid">'+
          vars.map(function(v){
            var thumb = v.imagen
              ? '<img src="'+esc(v.imagen)+'" alt="'+esc(v.nombre)+'">'
              : '<div class="vp-ph">'+(kind==='p'?'⚖️':'🎨')+'</div>';
            var priceInfo = '';
            if(kind==='p'){
              var pv = ventaOf(p, v);
              var pm = mayoristaOf(p, v);
              if(pv > 0){
                priceInfo = '<div class="vp-price">'+fmt(pv)+'</div>';
                if(isAdmin() && pm && pm !== pv) priceInfo += '<div class="vp-mayo">Mayor. '+fmt(pm)+'</div>';
              }
            }
            var isSel = picked && picked.id===v.id;
            var nombreDisplay = kind==='p' ? (v.nombre+(tipo?tipo:'')) : nomVarColor(v);
            var sinStock = (kind==='c' && colorStockOn(p) && !(v.stock>0));
            return '<button type="button" class="vp-card'+(isSel?' selected':'')+'"'+(sinStock?' disabled style="opacity:.45;cursor:not-allowed"':'')+' data-role="pick-'+kind+'" data-vid="'+esc(v.id)+'">'+
              '<div class="vp-img">'+thumb+'</div>'+
              '<div class="vp-nm">'+esc(nombreDisplay||'(sin nombre)')+'</div>'+
              priceInfo+
              ((kind==='p' && varStockOn(p) && !(v.stock>0)) ? '<div class="vp-mayo" style="color:var(--bad);font-weight:700">Agotado</div>' : '')+
              ((kind==='c' && colorStockOn(p)) ? (v.stock>0 ? '<div class="vp-mayo">'+v.stock+' disp.</div>' : '<div class="vp-mayo" style="color:var(--bad);font-weight:700">Agotado</div>') : '')+
            '</button>';
          }).join('')+
        '</div>'+
      '</div>';
    }

    function render(){
      var canConfirm = (!hasP || state_pick.varP) && (!hasC || state_pick.varC);
      host.innerHTML = '<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(520px,100%)">'+
        '<div class="modal-hd"><h2>Elige opciones</h2><button class="mini" data-role="close">×</button></div>'+
        '<div class="modal-bd">'+
          '<p class="hint">Selecciona las opciones para <b>'+esc(p.nombre)+'</b>:</p>'+
          (hasP ? section('💰 Cantidad ('+(p.tipoVariacion||'')+')', varsP, 'p', p.tipoVariacion||'') : '')+
          (hasC ? section('🎨 '+(p.tipoVariacionColor||'Opción'), varsC, 'c', '') : '')+
        '</div>'+
        '<div class="modal-ft">'+
          '<button class="btn ghost" data-role="close">Cancelar</button>'+
          '<button class="btn primary" data-role="confirm"'+(canConfirm?'':' disabled')+'>Agregar al pedido</button>'+
        '</div>'+
      '</div></div>';
      var modal = host.querySelector('.modal');
      modal.querySelectorAll('[data-role="pick-p"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var vid = btn.getAttribute('data-vid');
          state_pick.varP = varsP.find(function(x){return x.id===vid;}) || null;
          render();
        });
      });
      modal.querySelectorAll('[data-role="pick-c"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var vid = btn.getAttribute('data-vid');
          state_pick.varC = varsC.find(function(x){return x.id===vid;}) || null;
          render();
        });
      });
      var conf = modal.querySelector('[data-role="confirm"]');
      if(conf) conf.addEventListener('click', function(){
        if(hasP && !state_pick.varP){ showToast('Elige la cantidad', false); return; }
        if(hasC && !state_pick.varC){ showToast('Elige la opción', false); return; }
        closeModal();
        addToCart(p.id, state_pick.varP, state_pick.varC);
      });
      host.querySelectorAll('[data-role="close"]').forEach(function(b){ b.addEventListener('click', closeModal); });
      host.querySelector('[data-role="scrim"]').addEventListener('mousedown', function(e){ if(e.target===e.currentTarget) closeModal(); });
    }
    render();
  }

  // Agrupa los items del pedido por bodega y arma un botón "Enviar a X" por cada una
  function cartByBodega(){
    var map={};
    (currentCart().items||[]).forEach(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}); if(!p) return;
      var vari = variacionDe(p, it.variacionId);
      var vc = costoVariacion(vari);
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p);
      var bodega= b ? b.bodega : (it.bodega||'(sin bodega)');
      if(!map[bodega]) map[bodega]={bodega:bodega, items:[], subCosto:0, unidades:0};
      var costo = (vc!=null) ? vc : (b?b.costo:0);
      map[bodega].items.push({p:p, cantidad:it.cantidad, costo:costo, variacionNombre:it.variacionNombre||'', tipoVariacion: it.variacionId?(p.tipoVariacion||''):'', variacionColorNombre:it.variacionColorNombre||'', tipoVariacionColor: it.variacionColorId?(p.tipoVariacionColor||''):''});
      map[bodega].subCosto += costo*it.cantidad;
      map[bodega].unidades += it.cantidad;
    });
    return Object.keys(map).map(function(k){return map[k];});
  }

  function saveCart(){
    var t=cartTotals(); if(!t.lineas){ return; }
    // Antes de guardar, verificar perfil completo del usuario que está armando el pedido
    if(session){
      var yo=state.usuarios.find(function(x){return x.id===session.usuarioId;});
      var faltanPerfil=perfilFaltante(yo);
      if(faltanPerfil.length){
        alert('Antes de guardar un pedido debes completar tu perfil.\n\nFaltan estos datos: '+faltanPerfil.join(', ')+'.\n\nAhora te abro "Mi perfil" para que los completes.');
        openMiPerfil();
        return;
      }
    }
    if(!isAdmin()){
      var malPrecio=null;
      currentCart().items.forEach(function(it){
        var pp=state.productos.find(function(x){return x.id===it.productId;}); if(!pp||!it.precioVendido||malPrecio) return;
        var rg=rangoPrecio(it, pp);
        if(it.precioVendido<rg.min || it.precioVendido>rg.max) malPrecio={n:pp.nombre, r:rg};
      });
      if(malPrecio){ showToast('Revisa el precio de "'+malPrecio.n+'": debe estar entre '+fmt(malPrecio.r.min)+' y '+(malPrecio.r.max===Infinity?'sin tope':fmt(malPrecio.r.max)), false); return; }
    }
    var c=currentCart().cliente;
    var nom=(c.nombre||'').trim(), tel=(c.tel||'').trim(), dir=(c.direccion||'').trim(), ciu=(c.ciudad||'').trim(), notas=(c.notas||'').trim();
    // Validación de envío
    var faltan=[];
    if(!nom) faltan.push('nombre del cliente');
    if(!tel) faltan.push('teléfono');
    if(!dir) faltan.push('dirección');
    if(!ciu) faltan.push('ciudad');
    if(faltan.length){
      showToast('Faltan datos de envío: '+faltan.join(', '), false);
      var first={'nombre del cliente':'nombre','teléfono':'tel','dirección':'direccion','ciudad':'ciudad'}[faltan[0]];
      var el=document.querySelector('[data-cli="'+first+'"]'); if(el){ el.focus(); el.style.outline='2px solid var(--bad)'; setTimeout(function(){el.style.outline='';},1500); }
      return;
    }
    var items=currentCart().items.map(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}) || {};
      var vari = variacionDe(p, it.variacionId);
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p) || {};
      var vc = costoVariacion(vari);
      var precioReal=itemVenta(it,p);
      var sug=ventaOf(p, vari);
      return {
        productId:it.productId,
        nombre:p.nombre||'(producto borrado)',
        bodega:it.bodega||(b.bodega||''),
        costo: (vc!=null) ? vc : (b.costo||0),
        mayorista:itemMayorista(it,p),
        precio:precioReal,
        precioSugerido:sug,
        cantidad:it.cantidad,
        variacionId: it.variacionId||'',
        variacionNombre: it.variacionNombre||'',
        tipoVariacion: it.variacionId ? (p.tipoVariacion||'') : '',
        variacionColorId: it.variacionColorId||'',
        variacionColorNombre: it.variacionColorNombre||'',
        tipoVariacionColor: it.variacionColorId ? (p.tipoVariacionColor||'') : ''
      };
    });
    var now=new Date().toISOString();
    var byName = session ? session.usuarioNombre : '';
    var order={
      id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      fecha:now,
      seccion: activeSection || 'maquillaje',
      cliente:{nombre:nom, tel:tel, direccion:dir, ciudad:ciu, notas:notas},
      items:items,
      costoTotal:t.costo, mayoristaTotal:t.mayorista, ventaTotal:t.venta,
      gananciaEmpresa:t.gananciaEmpresa, gananciaTrabajador:t.gananciaTrabajador, gananciaTotal:t.gananciaTotal,
      ganancia:t.gananciaTotal, // legacy
      unidades:t.unidades,
      usuarioId: session?session.usuarioId:'', usuarioNombre: byName,
      estado: { realizado:{at:now, by:byName}, envio:null, venta:null }
    };
    state.pedidos.unshift(order);
    ajustarStockPorPedido(order, -1);
    resetCurrentCart();
    closeCart(); render(); scheduleSave();
    showToast(tPed('SG')+' guardad'+(isAdmin()?'a':'o')+' ✓',false);
    // Notificar por email (fire and forget — no bloquea al usuario)
    (function(){
      enviarEmailPedido(order).then(function(res){
        if(res && res.ok) showToast('📧 Notificación enviada',false);
        // Si falla silenciosamente: el pedido igual quedó guardado
      });
    })();

  var comTab='pend', comHasta='', comAbierto={};

  function comisionDe(o){ return (o.gananciaTrabajador!=null)?o.gananciaTrabajador:((o.ventaTotal||0)-(o.mayoristaTotal||0)); }
  // se le debe al vendedor cuando el admin confirmó que el cliente pagó y aún no se le ha pagado su comisión
  function esComisionable(o){ ensureEstado(o); return !!o.usuarioId && !!o.estado.venta && !o.estado.devuelto && !o.comisionPagada && comisionDe(o)>0; }
  function fechaConfirmacion(o){ return (o.estado && o.estado.venta && o.estado.venta.at) || o.fecha || ''; }
  function comisionesPorPagar(sec, hasta, soloUid){
    var map={};
    (state.pedidos||[]).forEach(function(o){
      if(sec && (o.seccion||'maquillaje')!==sec) return;
      if(!esComisionable(o)) return;
      if(soloUid && o.usuarioId!==soloUid) return;
      if(hasta && diaBogota(fechaConfirmacion(o))>hasta) return;
      var g=map[o.usuarioId]||(map[o.usuarioId]={uid:o.usuarioId, u:userById(o.usuarioId)||{id:o.usuarioId,nombre:o.usuarioNombre||'(sin nombre)'}, pedidos:[], monto:0});
      g.pedidos.push(o); g.monto+=comisionDe(o);
    });
    return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.monto-a.monto;});
  }
  function sumaComisiones(arr){ return arr.reduce(function(a,g){return a+g.monto;},0); }
  function fechaCorta(iso){ try{ return new Date(iso).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric',timeZone:'America/Bogota'}); }catch(e){ return ''; } }

  function textoProducto(p){
    var u=userById(session.usuarioId)||{}, sec=p.seccion||activeSection||'maquillaje', base=SITIOS[sec];
    var url=base+'/?v='+encodeURIComponent(u.codigo)+'&p='+encodeURIComponent(p.id);

    var tallas=(p.variacionesColor||[]).filter(function(v){return v.nombre;});

    var tTxt=nums.length&&nums.length===tallas.length?('Tallas '+Math.min.apply(null,nums)+' a '+Math.max.apply(null,nums)):(tallas.length?'Tallas: '+tallas.map(nomVarColor).join(', '):'');
    var l=['👟 *'+[p.marca,p.nombre].filter(Boolean).join(' ')+'*'+(p.webColor?' — '+p.webColor:'')];

  async function compartirProducto(pid){

  function openHistory(){
    var admin=isAdmin();
    var secPeds = pedidosDeSeccion();
    var base = admin ? secPeds.slice() : secPeds.filter(function(o){return o.usuarioId===session.usuarioId;});
    if(admin && histFilter!=='__all__') base=base.filter(function(o){return o.usuarioId===histFilter;});
    if(admin && histOrigen==='web') base=base.filter(function(o){return o.origen==='web' && !o.usuarioId;});
    if(admin && histOrigen==='vend') base=base.filter(function(o){return !!o.usuarioId;});
    // periodo (hora de Colombia)
    var hoyK=histFechaTxt(new Date().toISOString()).key;
    if(histPeriod!=='todo'){
      var lim = histPeriod==='hoy' ? hoyK : (histPeriod==='7' ? histFechaTxt(new Date(Date.now()-6*864e5).toISOString()).key : hoyK.slice(0,7)+'-01');
      base=base.filter(function(o){ return histFechaTxt(o.fecha).key>=lim; });
    }
    base.sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); });
    var counts={pend:0,camino:0,listo:0,dev:0}; base.forEach(function(o){ counts[histEtapa(o)]++; });
    var baseOk=base.filter(pedidoValido);
    var fletes=base.reduce(function(a,o){ return a+((o.estado&&o.estado.devuelto&&o.estado.devuelto.flete)||0); },0);
    if(!histTab) histTab = counts.pend ? 'pend' : 'todos';
    function sumV(a){return a.reduce(function(x,o){return x+(o.ventaTotal||0);},0);}
    function sumG(a){return a.reduce(function(x,o){
      if(vistaAdminDe(o)) return x + gananciaAdminDe(o);
      var mT=o.mayoristaTotal||0;
      return x+((o.gananciaTrabajador!=null)?o.gananciaTrabajador:((o.ventaTotal||0)-mT));
    },0);}
    var L = admin ? {pend:'Por despachar', camino:'Enviados · por cobrar', listo:'Completados'} : {pend:'Pendientes', camino:'Enviados', listo:'Pagados'};
    function seg(id,lbl,n){ return '<button class="ho-tab'+(histTab===id?' on':'')+'" data-htab="'+id+'">'+lbl+(n!=null?' <span>'+n+'</span>':'')+'</button>'; }
    function chip(attr,val,cur,lbl){ return '<button class="ho-chip'+(cur===val?' on':'')+'" '+attr+'="'+val+'">'+lbl+'</button>'; }
    var filtros='<div class="ho-filters">'+
      '<div class="ho-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>'+
        '<input type="search" id="hist-q" placeholder="Buscar cliente, teléfono, ciudad o número…" value="'+esc(histQ)+'"></div>'+
      '<div class="ho-chips">'+chip('data-hper','hoy',histPeriod,'Hoy')+chip('data-hper','7',histPeriod,'7 días')+chip('data-hper','mes',histPeriod,'Este mes')+chip('data-hper','todo',histPeriod,'Todo')+'</div>';
    if(admin){
      var vendedores=state.usuarios.filter(function(u){ return secPeds.some(function(o){return o.usuarioId===u.id;}); }).sort(function(a,b){return (a.nombre||'').localeCompare(b.nombre||'');});
      filtros+='<div class="ho-chips">'+chip('data-horig','all',histOrigen,'Todos')+chip('data-horig','vend',histOrigen,'👤 De vendedores')+chip('data-horig','web',histOrigen,'🌐 Tienda web directa')+
        (vendedores.length?'<select id="hist-user" class="ho-sel"><option value="__all__">Todos los vendedores</option>'+vendedores.map(function(u){
          var n=secPeds.filter(function(o){return o.usuarioId===u.id;}).length;
          return '<option value="'+esc(u.id)+'"'+(histFilter===u.id?' selected':'')+'>'+esc(u.nombre)+' ('+n+')</option>'; }).join('')+'</select>':'')+
      '</div>';
    }
    filtros+='</div>';
    var kpis='<div class="ho-kpis">'+
      '<div class="ho-kpi warn"><span>'+L.pend+'</span><b>'+counts.pend+'</b></div>'+
      '<div class="ho-kpi"><span>'+(admin?'Pedidos':'Mis pedidos')+'</span><b>'+baseOk.length+'</b></div>'+
      '<div class="ho-kpi"><span>'+(admin?'Ventas':'Mis ventas')+'</span><b>'+fmt(sumV(baseOk))+'</b></div>'+
      '<div class="ho-kpi good"><span>'+(admin?'Ganancia':'Mi ganancia')+'</span><b>'+fmt(sumG(baseOk))+'</b></div>'+
    '</div>';
    var tabs='<div class="ho-tabs">'+seg('pend',L.pend,counts.pend)+seg('camino',L.camino,counts.camino)+seg('listo',L.listo,counts.listo)+(counts.dev?seg('dev','Devueltos',counts.dev):'')+seg('todos','Todos',base.length)+'</div>'+
      (counts.dev?'<div class="ho-lossnote">↩ '+counts.dev+' pedido'+(counts.dev===1?'':'s')+' devuelto'+(counts.dev===1?'':'s')+' o cancelado'+(counts.dev===1?'':'s')+' (no cuentan como venta ni comisión)'+(admin&&fletes>0?' · fletes perdidos <b>'+fmt(fletes)+'</b>':'')+'</div>':'');
    host.innerHTML='<div class="scrim" data-role="scrim"><div class="modal ho-modal" role="dialog" aria-modal="true">'+
      '<div class="modal-hd"><h2>'+(admin?'Pedidos de la sección':'Mis pedidos')+'</h2><button class="mini" data-role="close">×</button></div>'+
      '<div class="modal-bd ho-bd">'+kpis+filtros+tabs+'<div id="hist-list" class="ho-list"></div></div>'+
      '<div class="modal-ft"><span class="ho-foot">'+(admin?'Flujo: <b>Realizado</b> → <b>Enviado</b> → <b>Pagado</b>. Toca el botón verde de cada pedido para avanzarlo.':'Tu ganancia se confirma cuando el pedido queda pagado.')+'</span><button class="btn ghost" data-role="close">Cerrar</button></div>'+
    '</div></div>';
    function drawList(){
      var q=histQ.trim().toLowerCase();
      var list=base.filter(function(o){ return histTab==='todos' || histEtapa(o)===histTab; });
      if(q) list=list.filter(function(o){ var c=o.cliente||{};
        return [c.nombre,c.tel,c.ciudad,c.direccion,o.usuarioNombre,o.numeroWeb,o.codigoVendedor,(o.items||[]).map(function(i){return i.nombre;}).join(' ')].join(' ').toLowerCase().indexOf(q)>=0; });
      var box=document.getElementById('hist-list'); if(!box) return;
      if(!list.length){
        box.innerHTML='<div class="ho-empty"><div class="em">📋</div><b>'+(base.length?'No hay pedidos aquí':'Aún no hay '+tPed('pl'))+'</b><p>'+(base.length?'Prueba con otra pestaña, otro periodo o borra la búsqueda.':'Cuando se guarde la primera '+tPed('sg')+' aparecerá aquí.')+'</p></div>';
        return;
      }
      var lastDay='', html='';
      list.forEach(function(o){
        var f=histFechaTxt(o.fecha), et=histEtapa(o), c=o.cliente||{};
        if(f.key!==lastDay){ lastDay=f.key; var dl=list.filter(function(x){return histFechaTxt(x.fecha).key===f.key;});
          var dlOk=dl.filter(pedidoValido); html+='<div class="ho-day"><span>'+esc(f.dia)+'</span><em>'+dlOk.length+' · '+fmt(sumV(dlOk))+'</em></div>'; }
        var num = o.numeroWeb ? '#'+esc(o.numeroWeb) : '#'+esc(String(o.id||'').slice(-5).toUpperCase());
        var stTxt = {pend:L.pend.replace(' · por cobrar',''), camino:admin?'Por cobrar':'Enviado', listo:admin?'Pagado':'Pagado', dev:'Devuelto'}[et];
        var dv=(o.estado&&o.estado.devuelto)||null;
        var seller = o.usuarioId ? '<span class="ho-tag seller">👤 '+esc(o.usuarioNombre||'Vendedor')+'</span>' : '';
        var web = o.origen==='web' ? '<span class="ho-tag web">🌐 Tienda web'+(o.usuarioId?'':' · directa')+'</span>' : '';
        var cod = o.codigoVendedor ? '<span class="ho-tag">Código '+esc(o.codigoVendedor)+'</span>' : '';
        if(o.comisionPagada) cod += '<span class="ho-tag seller">💸 Comisión pagada</span>';
        var envio = ''; var nt=String(c.notas||'');
        var mEnv = nt.match(/Envío:\s*([^|]+)/); if(mEnv) envio='<span class="ho-tag">🚚 '+esc(mEnv[1].trim())+'</span>';
        if(/contraentrega/i.test(nt)) envio+='<span class="ho-tag">💵 Contraentrega</span>';
        var items=(o.items||[]).map(function(it){ var ex=it.variacionColorNombre||it.variacionNombre||''; return '<span><b>'+it.cantidad+'×</b> '+esc(it.nombre||'')+(ex?' <i>· '+esc(ex)+'</i>':'')+'</span>'; }).join('');
        var wa=histWa(c.tel);
        var main='';
        if(admin){
          if(et==='pend') main='<button class="btn primary ho-go" data-act="est-envio">Marcar como enviado</button>';
          else if(et==='camino') main='<button class="btn primary ho-go" data-act="est-venta">Confirmar pago</button>'+(!pedidoLocal(o)?'<button class="btn ghost" data-guia="1">'+(guiaDe(o)?'Editar guía':'Añadir guía')+'</button>':'')+'<button class="btn ghost" data-dev="1">↩ Devuelto</button>';
          else if(et==='dev') main='<span class="ho-done dev">↩ '+esc(dv.motivo||'Devuelto')+(dv.flete>0?' · flete '+fmt(dv.flete):'')+'</span><button class="btn ghost" data-react="1">Reactivar</button>';
          else main='<span class="ho-done">✓ Pedido completado</span>';
        } else {
          main='<span class="ho-done '+et+'">'+(et==='dev'?'↩ Devuelto':(et==='listo'?'✓ Pagado':(et==='camino'?'🚚 En camino':'⏳ Esperando despacho')))+'</span>';
        }
        html+='<div class="hist-item ho" data-oid="'+esc(o.id)+'">'+
          '<div class="ho-top"><span class="ho-num">'+num+'</span><span class="ho-time">'+esc(f.hora)+'</span><span class="ho-st '+et+'">'+stTxt+'</span></div>'+
          '<div class="ho-main"><div class="ho-cli"><b>'+esc(c.nombre||'(sin cliente)')+'</b><span>'+[c.ciudad,c.tel].filter(Boolean).map(esc).join(' · ')+'</span>'+(c.direccion?'<span class="ho-dir">'+esc(c.direccion)+'</span>':'')+'</div>'+
            '<div class="ho-tot">'+fmt(o.ventaTotal||0)+'<small>'+(o.unidades||0)+' unidad'+(o.unidades===1?'':'es')+'</small></div></div>'+
          '<div class="ho-items">'+items+'</div>'+
          '<div class="ho-tags">'+seller+web+cod+envio+(guiaDe(o)?'<span class="ho-tag guia">📦 '+esc(guiaDe(o).transportadora)+' · '+esc(guiaDe(o).numero)+'</span>':'')+'</div>'+
          '<div class="ho-acts">'+main+
            '<button class="btn ghost" data-act="hist-view">Ver detalle</button>'+
            (wa?'<a class="btn ghost ho-wa" href="'+(et==='camino'?waAviso(o):wa)+'" target="_blank" rel="noopener">'+(et==='camino'?'Avisar al cliente':'WhatsApp')+'</a>':'')+
            '<span class="ho-sp"></span>'+
            (admin&&et==='pend'?'<button class="ho-link" data-dev="1">Cancelar pedido</button>':'')+
            '<button class="ho-link" data-act="hist-reopen">Reabrir</button>'+
            (admin||(session&&o.usuarioId===session.usuarioId)?'<button class="ho-link bad" data-act="hist-del">Eliminar</button>':'')+
          '</div>'+
        '</div>';
      });
      box.innerHTML=html;
      box.querySelectorAll('[data-dev]').forEach(function(b){ b.addEventListener('click',function(){ openDevolucion(b.closest('.hist-item').getAttribute('data-oid')); }); });
      box.querySelectorAll('[data-guia]').forEach(function(b){ b.addEventListener('click',function(){ openGuia(b.closest('.hist-item').getAttribute('data-oid'),'hist'); }); });
      box.querySelectorAll('[data-react]').forEach(function(b){ b.addEventListener('click',function(){ reactivarPedido(b.closest('.hist-item').getAttribute('data-oid')); }); });
    }
    drawList();
    host.querySelectorAll('[data-htab]').forEach(function(b){ b.addEventListener('click',function(){ histTab=b.getAttribute('data-htab'); openHistory(); }); });
    host.querySelectorAll('[data-hper]').forEach(function(b){ b.addEventListener('click',function(){ histPeriod=b.getAttribute('data-hper'); histTab=null; openHistory(); }); });
    host.querySelectorAll('[data-horig]').forEach(function(b){ b.addEventListener('click',function(){ histOrigen=b.getAttribute('data-horig'); histTab=null; openHistory(); }); });
    var sel=document.getElementById('hist-user');
    if(sel){ sel.addEventListener('change', function(){ histFilter=sel.value; histTab=null; openHistory(); }); }
    var qi=document.getElementById('hist-q');
    if(qi){ qi.addEventListener('input', function(){ histQ=qi.value; drawList(); }); }
  }

  function historyDetail(oid){
    var o=state.pedidos.find(function(x){return x.id===oid;}); if(!o) return;
    var admin=isAdmin();
    var vAdm=vistaAdminDe(o);   // vista de empresa (mayorista − costo) o de vendedor (venta − mayorista)
    var mayoT = o.mayoristaTotal || 0;
    var gTrab = (o.gananciaTrabajador!=null) ? o.gananciaTrabajador : ((o.ventaTotal||0) - mayoT);
    var lines=o.items.map(function(it){
      var mayo=(it.mayorista!=null)?it.mayorista:it.precio;
      var extras=[]; if(it.variacionNombre) extras.push(it.variacionNombre+(it.tipoVariacion||'')); if(it.variacionColorNombre) extras.push((it.tipoVariacionColor?it.tipoVariacionColor+': ':'')+it.variacionColorNombre);
      var vext = extras.length ? ' <small style="color:var(--muted);font-weight:400">('+esc(extras.join(', '))+')</small>' : '';
      if(vAdm){
        return '<tr><td>'+esc(it.nombre)+vext+'</td><td class="r num">'+it.cantidad+'</td><td class="r num">'+fmt(it.costo)+'</td><td class="r num">'+fmt(mayo)+'</td><td class="r num">'+fmt(it.precio)+'</td><td class="r num">'+fmt((mayo-it.costo)*it.cantidad)+'</td></tr>';
      }
      return '<tr><td>'+esc(it.nombre)+vext+'</td><td class="r num">'+it.cantidad+'</td><td class="r num">'+fmt(mayo)+'</td><td class="r num">'+fmt(it.precio)+'</td><td class="r num">'+fmt((it.precio-mayo)*it.cantidad)+'</td></tr>';
    }).join('');
    var fec=new Date(o.fecha||Date.now());
    var cli=o.cliente||{};
    var envioBlock='<div class="hint" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);line-height:1.5">'+
      '<b>📦 Envío</b><br>'+
      (cli.direccion?esc(cli.direccion):'<span style="color:var(--faint)">Sin dirección</span>')+
      (cli.ciudad?' · '+esc(cli.ciudad):'')+
      (cli.tel?'<br>📱 '+esc(cli.tel):'')+
      (cli.notas?'<br>📝 '+esc(cli.notas):'')+
      (guiaDe(o)?'<br>📦 Guía <b>'+esc(guiaDe(o).transportadora)+' '+esc(guiaDe(o).numero)+'</b>':'')+
    '</div>';
    // Timeline de estado
    ensureEstado(o);
    function fmtWhen(iso){ if(!iso) return ''; var d=new Date(iso); return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
    var lbl2=admin?'Venta realizada':'Pedido realizado';
    var envioBtn = admin ? (o.estado.envio
      ? '<button class="undo" data-act="est-envio-off">Deshacer</button>'
      : '<button data-act="est-envio-on">Confirmar envío</button>') : '';
    var ventaBtn = admin ? (o.estado.venta
      ? '<button class="undo" data-act="est-venta-off">Deshacer</button>'
      : (o.estado.envio ? '<button data-act="est-venta-on">Confirmar '+(admin?'venta':'entrega')+'</button>' : '')) : '';
    var timeline=
      '<div class="est-timeline">'+
        '<div class="row done"><span class="icon">✓</span><span class="label">'+tPed('SG')+' realizada</span><span class="when">'+esc(fmtWhen(o.estado.realizado.at))+(o.estado.realizado.by?' · '+esc(o.estado.realizado.by):'')+'</span></div>'+
        '<div class="row '+(o.estado.envio?'done':'pending')+'"><span class="icon">'+(o.estado.envio?'✓':'2')+'</span><span class="label">Envío confirmado</span><span class="when">'+esc(o.estado.envio?fmtWhen(o.estado.envio.at)+(o.estado.envio.by?' · '+esc(o.estado.envio.by):''):'pendiente')+'</span>'+(envioBtn?'<span class="act">'+envioBtn+'</span>':'')+'</div>'+
        '<div class="row '+(o.estado.venta?'done':'pending')+'"><span class="icon">'+(o.estado.venta?'✓':'3')+'</span><span class="label">'+esc(lbl2)+'</span><span class="when">'+esc(o.estado.venta?fmtWhen(o.estado.venta.at)+(o.estado.venta.by?' · '+esc(o.estado.venta.by):''):'pendiente')+'</span>'+(ventaBtn?'<span class="act">'+ventaBtn+'</span>':'')+'</div>'+
      '</div>';
    var mgT=o.ventaTotal?Math.round((o.gananciaTotal||o.ganancia||0)/o.ventaTotal*100):0;
    var mgTr=o.ventaTotal?Math.round(gTrab/o.ventaTotal*100):0;
    var head=vAdm?'<th>Producto</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">Mayor.</th><th class="r">Cliente</th><th class="r">Mi ganancia</th>'
                 :'<th>Producto</th><th class="r">Cant.</th><th class="r">Mi costo</th><th class="r">Al cliente</th><th class="r">Mi ganancia</th>';
    host.innerHTML='<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" data-oid="'+esc(o.id)+'" style="width:min(700px,100%)">'+
      '<div class="modal-hd"><h2>'+tPed('SG')+'</h2><button class="mini" data-role="close">×</button></div>'+
      '<div class="modal-bd">'+
        '<div><b>'+esc(cli.nombre||'(sin cliente)')+'</b>'+
          (o.usuarioNombre?' <span class="hint">· realizado por 👤 '+esc(o.usuarioNombre)+'</span>':'')+(o.origen==='web'?' <span class="hint">· 🌐 Tienda web'+(o.numeroWeb?' #'+esc(o.numeroWeb):'')+(o.codigoVendedor?' · código '+esc(o.codigoVendedor):'')+'</span>':'')+
          '<div class="hint">'+fec.toLocaleString('es-CO')+'</div></div>'+
        envioBlock+
        timeline+
        '<div style="overflow-x:auto"><table class="btable" style="min-width:'+(vAdm?560:420)+'px"><thead><tr>'+head+'</tr></thead><tbody>'+lines+'</tbody></table></div>'+
        '<div class="side-tot" style="border-radius:10px">'+
          (vAdm
            ? (function(){
                var gAdm=gananciaAdminDe(o);
                var mgAdm=o.ventaTotal?Math.round(gAdm/o.ventaTotal*100):0;
                var hechoTrab = hayGananciaVendedor(o);
                var sinVend = (o.origen==='web' && !o.usuarioId);
                return '<div class="r"><span>Costo (bodegas)</span><b class="num">'+fmt(o.costoTotal)+'</b></div>'+
                  '<div class="r"><span>Mayorista</span><b class="num">'+fmt(mayoT)+'</b></div>'+
                  '<div class="r"><span>Al cliente</span><b class="num">'+fmt(o.ventaTotal)+'</b></div>'+
                  (hechoTrab?'<div class="r" style="color:var(--muted);font-size:12.5px"><span>↳ Ganancia de '+esc(o.usuarioNombre||'vendedor')+' (venta − mayorista)</span><b class="num">'+fmt(gTrab)+'</b></div>':'')+
                  (sinVend?'<div class="r" style="color:var(--muted);font-size:12.5px"><span>🌐 Venta sin vendedor: toda la ganancia es '+(isSuper()?'tuya':'de la empresa')+' (cliente − costo)</span><b class="num"></b></div>':'')+
                  '<div class="r gain"><span>Mi ganancia</span><span class="val '+mgClass(mgAdm)+'">'+fmt(gAdm)+' ('+pct(mgAdm)+')</span></div>';
              })()
            : '<div class="r"><span>Mi costo (mayorista)</span><b class="num">'+fmt(mayoT)+'</b></div>'+
              '<div class="r"><span>Al cliente</span><b class="num">'+fmt(o.ventaTotal)+'</b></div>'+
              '<div class="r gain"><span>Mi ganancia</span><span class="val '+mgClass(mgTr)+'">'+fmt(gTrab)+' ('+pct(mgTr)+')</span></div>'
          )+
        '</div>'+
      '</div>'+
      '<div class="modal-ft"><button class="btn ghost" data-role="close">Cerrar</button></div>'+
    '</div></div>';
  }

  /* ---------- init ---------- */
  cfg=loadCfg();
  session=loadSession();
  if(session && !getToken()){ clearSession(); }       // sesiones anteriores sin token: hay que iniciar de nuevo
  var cached=session ? loadCache() : null; if(cached) state=sanitize(cached);
  if(!cfg){ cfg=DEFAULT_CFG; }
  if(!session){
    // sin sesión: solo se averigua si ya hay usuarios (para mostrar acceso o creación del primer administrador)
    bootstrapping=true; render();
    (async function(){ await consultarEstadoServidor(); bootstrapping=false; render(); })();
  }
  else{
    // Sólo mostrar el splash si NO hay datos locales confiables aún
    // (sin usuarios cargados y sin sesión previa). Si ya hay cache con usuarios,
    // dejamos que la app abra al instante y el pull sincroniza en background.
    var needsBootstrap = !state.usuarios.length && !session;
    if(needsBootstrap) bootstrapping=true;
    setConn('connecting'); render();
    (async function(){
      try{ await pullFromServer(false); setConn('ok'); }
      catch(e){ setConn('err'); showToast('Sin conexión — usando copia local',false); }
      bootstrapping=false;
      render(); startPolling();
      autoStartTutorial();
    })();
  }
})();
</script>
</body>
</html>

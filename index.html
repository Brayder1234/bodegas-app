<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELORA Cosmetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f4f6f4; --surface:#ffffff; --surface-2:#f8faf8;
  --ink:#15201b; --muted:#5b6b63; --faint:#8a998f;
  --border:#e3e8e4; --border-strong:#d2dad4;
  --accent:#0d7a6e; --accent-soft:#d5efe9; --accent-ink:#075049;
  --good:#12794a; --good-soft:#d9f0e2;
  --warn:#a45a06; --warn-soft:#f7e7cf;
  --bad:#b3261e; --bad-soft:#f6dcd9;
  --shadow:0 1px 2px rgba(20,40,32,.05), 0 8px 24px rgba(20,40,32,.06);
  --shadow-lg:0 12px 40px rgba(20,40,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0d1310; --surface:#151d18; --surface-2:#101711;
    --ink:#e9f1eb; --muted:#93a69b; --faint:#68786e;
    --border:#243029; --border-strong:#324237;
    --accent:#2fbfa9; --accent-soft:#123029; --accent-ink:#8fe6d6;
    --good:#3fc07d; --good-soft:#123020;
    --warn:#e0a24c; --warn-soft:#33260f;
    --bad:#f0776c; --bad-soft:#341814;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1310; --surface:#151d18; --surface-2:#101711;
  --ink:#e9f1eb; --muted:#93a69b; --faint:#68786e;
  --border:#243029; --border-strong:#324237;
  --accent:#2fbfa9; --accent-soft:#123029; --accent-ink:#8fe6d6;
  --good:#3fc07d; --good-soft:#123020;
  --warn:#e0a24c; --warn-soft:#33260f;
  --bad:#f0776c; --bad-soft:#341814;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Poppins", system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}

.wrap{max-width:1120px; margin:0 auto; padding:22px 20px 80px}

.top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand h1{font-family:"Poppins", sans-serif; font-weight:700; font-size:clamp(22px,3.4vw,30px); margin:0; letter-spacing:-.02em; text-wrap:balance}
.brand p{margin:0; color:var(--muted); font-size:13.5px}
.top-tools{display:flex; gap:8px; align-items:center}
.icon-btn{background:var(--surface); border:1px solid var(--border); color:var(--muted); min-width:38px; height:38px; padding:0 10px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:15px; transition:.15s}
.icon-btn:hover{color:var(--ink); border-color:var(--border-strong)}

.status{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--muted)}
.status .led{width:8px; height:8px; border-radius:50%; background:var(--faint); flex-shrink:0}
.status.ok .led{background:var(--good)} .status.ok{color:var(--good); border-color:var(--good-soft)}
.status.saving .led{background:var(--warn); animation:pulse 1s ease-in-out infinite}
.status.err .led{background:var(--bad)} .status.err{color:var(--bad); border-color:var(--bad-soft); cursor:pointer}
.status.off{cursor:pointer}
@keyframes pulse{50%{opacity:.35}}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.stat .k{font-size:12px; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; font-weight:600}
.stat .v{font-family:"Poppins",sans-serif; font-weight:700; font-size:26px; letter-spacing:-.02em; margin-top:4px}
.stat.alert .v{color:var(--bad)} .stat.alert.zero .v{color:var(--good)}
.stat .rail{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent)}
.stat.alert .rail{background:var(--bad)} .stat.alert.zero .rail{background:var(--good)}

.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.search{position:relative; flex:1 1 240px; min-width:180px}
.search input{width:100%; padding:10px 12px 10px 36px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px}
.search input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint)}
select.sort{padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px}
.btn{border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:10px 14px; border-radius:10px; font-size:14px; font-weight:600; transition:.15s; display:inline-flex; align-items:center; gap:7px}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column}
.card-hd{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:16px 16px 10px}
.p-name{font-weight:700; font-size:16.5px; letter-spacing:-.01em; line-height:1.25}
.p-name .sku{display:block; font-weight:500; font-size:12px; color:var(--faint); margin-top:2px; letter-spacing:.02em}
.p-acts{display:flex; gap:4px; flex-shrink:0}
.mini{border:none; background:transparent; color:var(--faint); width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-size:14px; transition:.15s}
.mini:hover{background:var(--surface-2); color:var(--ink)}
.mini.del:hover{background:var(--bad-soft); color:var(--bad)}
.p-price{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:0 16px 12px}
.p-price .lbl{font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600}
.p-price .val{font-family:"Poppins",sans-serif; font-weight:700; font-size:22px; letter-spacing:-.02em}
.btable{width:100%; border-collapse:collapse; font-size:13.5px}
.btable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 16px; background:var(--surface-2); border-top:1px solid var(--border); border-bottom:1px solid var(--border)}
.btable th.r, .btable td.r{text-align:right}
.btable td{padding:9px 16px; border-bottom:1px solid var(--border)}
.btable tr:last-child td{border-bottom:none}
.btable tr.best td{background:var(--accent-soft)}
.bod-name{display:flex; align-items:center; gap:7px}
.tag-best{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; background:var(--accent); color:#fff; padding:2px 6px; border-radius:5px}
.mg{font-weight:600}
.mg.good{color:var(--good)} .mg.warn{color:var(--warn)} .mg.bad{color:var(--bad)}
.card-ft{padding:11px 16px; font-size:13px; color:var(--muted); border-top:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.card-ft b{color:var(--ink)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex-shrink:0}
.no-bod{color:var(--faint); font-style:italic}

.empty{text-align:center; padding:64px 20px; border:1.5px dashed var(--border-strong); border-radius:18px; background:var(--surface); color:var(--muted)}
.empty .em-ic{font-size:40px; margin-bottom:8px}
.empty h3{margin:0 0 6px; color:var(--ink); font-family:"Poppins",sans-serif; font-size:20px}
.empty p{margin:0 auto 18px; max-width:400px}

.scrim{position:fixed; inset:0; background:rgba(15,25,20,.45); backdrop-filter:blur(2px); display:grid; place-items:center; padding:18px; z-index:50}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); width:min(560px,100%); max-height:90vh; overflow:auto}
.modal-hd{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:18px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1}
.modal-hd h2{margin:0; font-family:"Poppins",sans-serif; font-size:19px; font-weight:700}
.modal-bd{padding:18px 20px; display:flex; flex-direction:column; gap:14px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.field input, .field textarea{padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:15px; width:100%}
.field input:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.field textarea{resize:vertical; min-height:52px}
.field .help{font-size:12px; color:var(--faint); font-weight:400; text-transform:none; letter-spacing:0}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.sub{font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px}
.cost-rows{display:flex; flex-direction:column; gap:8px}
.cost-row{display:grid; grid-template-columns:1fr 120px 32px; gap:8px; align-items:center}
.cost-row input, .cost-row .bod-select{padding:9px 10px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:14px; width:100%}
.cost-row .x{border:none; background:transparent; color:var(--faint); height:34px; border-radius:8px; font-size:16px}
.cost-row .x:hover{background:var(--bad-soft); color:var(--bad)}
.add-cost{align-self:flex-start; font-size:13px; color:var(--accent); background:none; border:none; font-weight:600; padding:4px 2px}
.modal-ft{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface); flex-wrap:wrap}
.modal-ft .left{margin-right:auto; display:flex; gap:8px}
.bod-row{padding:10px 0; border-bottom:1px solid var(--border)}
.bod-row:last-child{border-bottom:none}
.bod-row-line{display:flex; align-items:center; gap:8px}
.bod-row-line input{flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:14px; min-width:0}
.wa-ic{color:var(--good); font-size:15px; flex-shrink:0}

/* Botones de envío por bodega en el pedido */
.wa-sends{padding:10px 18px 0; display:flex; flex-direction:column; gap:6px}
.wa-btn{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 14px; border-radius:10px; border:1px solid #25D366;
  background:transparent; color:var(--ink); font-size:13.5px; font-weight:600;
  cursor:pointer; text-align:left; transition:.15s;
}
.wa-btn:hover{background:rgba(37,211,102,.08)}
.wa-btn .wa-lbl{display:flex; align-items:center; gap:8px; min-width:0}
.wa-btn .wa-lbl .icn{background:#25D366; color:#fff; width:24px; height:24px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0}
.wa-btn .wa-lbl .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa-btn .wa-info{font-size:12px; color:var(--muted); font-weight:500; flex-shrink:0}
.wa-btn.notel .icn{background:var(--warn)}
.wa-btn.notel{border-color:var(--warn); color:var(--warn)}

.list-row{display:flex; align-items:center; gap:8px; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-row input{flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink)}
.hint{font-size:12.5px; color:var(--faint)}
.callout{background:var(--accent-soft); color:var(--accent-ink); border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.45}
.callout.warn{background:var(--warn-soft); color:var(--warn)}

.toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); opacity:0; transition:.25s; z-index:60; display:flex; align-items:center; gap:8px; pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.spin{width:13px; height:13px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin,.status.saving .led{animation:none} .toast{transition:none} }

/* Widget de meta mensual */
.meta-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px 16px; box-shadow:var(--shadow); margin-bottom:16px;
  display:flex; flex-direction:column; gap:8px;
}
.meta-hd{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.meta-hd .ttl{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:6px}
.meta-hd .pct{font-family:"Poppins",sans-serif; font-weight:700; font-size:22px; letter-spacing:-.02em}
.meta-hd .pct.done{color:var(--good)}
.meta-hd .pct.warn{color:var(--warn)}
.meta-bar{height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden; position:relative}
.meta-bar .fill{
  height:100%; border-radius:999px; transition:width .35s ease;
  background:linear-gradient(90deg, var(--accent), var(--good));
}
.meta-bar .fill.done{background:var(--good)}
.meta-bar .fill.warn{background:linear-gradient(90deg, var(--warn), var(--bad))}
.meta-ft{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.meta-ft b{color:var(--ink); font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-weight:700}
.meta-ft .edit{color:var(--accent); font-weight:600; cursor:pointer; background:none; border:none; font-size:12.5px}
.meta-ft .edit:hover{text-decoration:underline}

/* Tutorial / Onboarding */
.tut-overlay{
  position:fixed; inset:0; z-index:90; pointer-events:auto;
  background:rgba(10,15,12,.72);
  animation:fadeIn .2s ease both;
}
/* El halo crea el "spotlight" — su box-shadow gigante oscurece TODO menos el hueco */
.tut-halo{
  position:fixed; border-radius:14px; pointer-events:none;
  z-index:92;
  box-shadow:
    0 0 0 3px var(--accent),
    0 0 32px 4px rgba(13,122,110,.55),
    0 0 0 9999px rgba(10,15,12,.72);
  transition:top .35s cubic-bezier(.4,0,.2,1), left .35s cubic-bezier(.4,0,.2,1),
             width .35s cubic-bezier(.4,0,.2,1), height .35s cubic-bezier(.4,0,.2,1);
  animation:haloPulse 1.8s ease-in-out infinite;
}
@keyframes haloPulse{
  0%,100%{box-shadow:0 0 0 3px var(--accent), 0 0 32px 4px rgba(13,122,110,.55), 0 0 0 9999px rgba(10,15,12,.72)}
  50%{box-shadow:0 0 0 3px var(--accent), 0 0 48px 8px rgba(13,122,110,.75), 0 0 0 9999px rgba(10,15,12,.72)}
}
.tut-card{
  position:fixed; z-index:100; pointer-events:auto;
  background:var(--surface); border:1px solid var(--accent); border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(13,122,110,.4);
  padding:16px 18px; max-width:340px; width:calc(100vw - 32px);
  animation:fadeUp .28s ease both;
}
.tut-card .step{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center}
.tut-card .step .skip{background:none; border:none; color:var(--faint); font-size:12px; cursor:pointer; padding:2px 6px; text-transform:none; letter-spacing:0}
.tut-card .step .skip:hover{color:var(--ink)}
.tut-card h3{margin:0 0 6px; font-size:16px; font-weight:700; color:var(--ink); line-height:1.3}
.tut-card p{margin:0 0 14px; font-size:13.5px; color:var(--muted); line-height:1.5}
.tut-card .nav{display:flex; gap:8px; justify-content:space-between; align-items:center}
.tut-card .nav .dots{display:flex; gap:4px}
.tut-card .nav .dot{width:6px; height:6px; border-radius:50%; background:var(--border-strong); transition:.2s}
.tut-card .nav .dot.on{background:var(--accent); width:16px; border-radius:3px}
.tut-card .nav .btns{display:flex; gap:6px}
.tut-card .nav .btns button{padding:7px 13px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit}
.tut-card .nav .btns button:hover{border-color:var(--border-strong)}
.tut-card .nav .btns .next{background:var(--accent); border-color:var(--accent); color:#fff}
.tut-card .nav .btns .next:hover{filter:brightness(1.06)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Banner de perfil incompleto */
.perfil-alert{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);
  border-radius:12px; padding:12px 16px; margin-bottom:14px; cursor:pointer;
  font-size:13.5px; line-height:1.35; transition:.15s;
}
.perfil-alert:hover{filter:brightness(1.02)}

/* Vista trabajador — oculta datos de negocio */
body.role-trabajador .pg-hdr .avg,
body.role-trabajador .pexp{display:none !important}
.prow-t{grid-template-columns: 1fr 100px 100px 44px !important; gap:10px}
.pv-t{
  text-align:right; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;
  font-weight:700; font-size:13.5px; line-height:1.1;
}
.pv-t .lb{
  display:block; font-size:10px; color:var(--faint); font-weight:600; text-transform:uppercase;
  letter-spacing:.03em; margin-bottom:2px; font-family:"Poppins",sans-serif;
}
.pv-t.vv{color:var(--accent)}
@media (max-width:640px){
  .prow-t{grid-template-columns:1fr 78px 78px 40px !important; gap:6px; padding:9px 10px}
  .pv-t{font-size:12.5px}
}

/* Login y panel de usuarios */
.login-wrap{max-width:400px; margin:8vh auto 0; padding:0 18px}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); padding:28px 26px}
.login-card h1{font-family:"Poppins",sans-serif; font-size:24px; margin:0 0 4px; letter-spacing:-.02em}
.login-card .lead{color:var(--muted); margin:0 0 20px; font-size:14px}
.who-chip{display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:600}
.who-chip .avat{width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800}
.who-chip.admin .avat{background:var(--warn)}
.who-chip .role{color:var(--faint); font-weight:500}
.user-row{display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface-2)}
.user-row .nm{font-weight:700}
.user-row .rl{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
.user-row .rl.a{color:var(--warn)}
.user-row .acts{display:flex; gap:4px}
.user-row .acts button{background:transparent; border:none; color:var(--muted); padding:6px 8px; border-radius:6px; font-size:12.5px; cursor:pointer}
.user-row .acts button:hover{background:var(--border); color:var(--ink)}
.user-row .acts button.del:hover{background:var(--bad-soft); color:var(--bad)}
.tabsrow{display:flex; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-bottom:12px}
.tabsrow button{flex:1; padding:8px 12px; background:transparent; border:none; color:var(--muted); font-weight:600; border-radius:8px; font-size:13px; cursor:pointer}
.tabsrow button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* Pantalla de conexión inicial */
.setup{max-width:560px; margin:6vh auto 0; padding:0 18px}
.setup .card2{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); padding:28px}
.setup h1{font-family:"Poppins",sans-serif; font-size:26px; margin:0 0 4px; letter-spacing:-.02em}
.setup .lead{color:var(--muted); margin:0 0 20px}
.setup .steps{font-size:13.5px; color:var(--muted); margin:16px 0 0; padding-left:18px; line-height:1.6}

/* Lista compacta agrupada por marca */
.plist{display:flex; flex-direction:column; gap:14px}
.pgroup{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.pg-hdr{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  cursor:pointer; user-select:none; background:var(--surface-2);
  border-bottom:1px solid var(--border); transition:.15s;
}
.pg-hdr:hover{background:var(--border)}
.pg-hdr .chev{color:var(--muted); font-size:11px; transition:transform .2s; flex-shrink:0; width:14px; text-align:center}
.pgroup.collapsed .pg-hdr{border-bottom-color:transparent}
.pgroup.collapsed .pg-hdr .chev{transform:rotate(-90deg)}
.pgroup.collapsed .pg-body{display:none}
.pg-hdr .name{font-family:"Poppins",sans-serif; font-weight:700; font-size:15px; letter-spacing:-.01em; flex:1; min-width:0; text-transform:uppercase}
.pg-hdr .count{color:var(--muted); font-size:12px; font-weight:600; background:var(--surface); border:1px solid var(--border); padding:2px 8px; border-radius:999px; flex-shrink:0}
.pg-hdr .avg{color:var(--muted); font-size:12px; font-weight:600; flex-shrink:0}

.prow{
  display:grid; grid-template-columns: 1fr 90px 90px 44px 44px 40px;
  align-items:center; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--border); font-size:14px;
  cursor:pointer; transition:background .12s;
}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--surface-2)}
.prow .pn{font-weight:600; line-height:1.25; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .pn small{display:block; font-weight:500; font-size:11.5px; color:var(--faint); margin-top:1px; letter-spacing:.02em}
.prow .pv{text-align:right; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-weight:700}
.prow .pc{text-align:right; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600}
.prow .pc .bod{display:block; font-size:11px; color:var(--faint); font-weight:500; text-transform:uppercase; letter-spacing:.03em; margin-top:1px}
.prow .pc.none{color:var(--faint); font-style:italic; font-family:inherit; font-weight:500}
.prow .pm{text-align:right; font-weight:700; font-family:"JetBrains Mono",monospace; font-size:13.5px}
.prow .pm.good{color:var(--good)} .prow .pm.warn{color:var(--warn)} .prow .pm.bad{color:var(--bad)}
.prow .padd{
  border:1px solid var(--accent); background:transparent; color:var(--accent);
  height:30px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; transition:.12s;
}
.prow .padd:hover{background:var(--accent); color:#fff}
.prow .padd.in{background:var(--accent); color:#fff}
.prow .pact{position:relative}
.prow .pact .mm{border:none; background:transparent; color:var(--faint); width:30px; height:30px; border-radius:8px; font-size:14px; cursor:pointer}
.prow .pact .mm:hover{background:var(--border); color:var(--ink)}
.prow .pact .menu{position:absolute; right:0; top:36px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); z-index:10; min-width:130px; padding:4px; display:none}
.prow .pact.open .menu{display:block}
.prow .pact .menu button{display:block; width:100%; text-align:left; padding:8px 10px; background:transparent; border:none; color:var(--ink); font-size:13px; border-radius:6px; cursor:pointer}
.prow .pact .menu button:hover{background:var(--surface-2)}
.prow .pact .menu button.del{color:var(--bad)}
.prow .pact .menu button.del:hover{background:var(--bad-soft)}

.pexp{padding:0 14px 12px; background:var(--surface-2); border-bottom:1px solid var(--border); display:none}
.prow.expanded + .pexp{display:block; animation:expandIn .18s ease}
@keyframes expandIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.pexp table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px}
.pexp th{text-align:left; text-transform:uppercase; letter-spacing:.03em; color:var(--faint); font-size:10.5px; font-weight:600; padding:4px 8px; border-bottom:1px solid var(--border)}
.pexp th.r, .pexp td.r{text-align:right}
.pexp td{padding:5px 8px; border-bottom:1px solid var(--border)}
.pexp td.best{color:var(--accent); font-weight:700}
.pexp .note{color:var(--muted); font-size:12px; margin-top:8px; padding:6px 8px; border-radius:6px; background:var(--surface); border:1px solid var(--border)}

@media (max-width:640px){
  .prow{grid-template-columns: 1fr 76px 44px 40px; gap:6px; padding:9px 10px; font-size:13.5px}
  .prow .pc, .prow .pact{display:none}
  .pg-hdr{padding:11px 12px}
  .pg-hdr .avg{display:none}
  .pexp{padding:0 10px 10px}
}

/* Carrito flotante */
.fab-cart{
  position:fixed; right:22px; bottom:22px; z-index:40;
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  padding:14px 18px 14px 16px; font-size:15px; font-weight:700;
  box-shadow:var(--shadow-lg); display:inline-flex; align-items:center; gap:10px;
  cursor:pointer; transition:transform .15s;
}
.fab-cart:hover{transform:translateY(-2px)}
.fab-cart .badge{
  background:#fff; color:var(--accent); border-radius:999px; min-width:22px; height:22px;
  padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:800;
}
.fab-cart .totmini{opacity:.9; font-weight:600; font-size:13px; padding-left:6px; border-left:1px solid rgba(255,255,255,.35); margin-left:2px}

/* Panel de pedido (deslizante) */
.side-scrim{
  position:fixed; inset:0; background:rgba(15,25,20,.45); backdrop-filter:blur(2px);
  z-index:55; opacity:0; animation:fadeIn .18s forwards;
}
@keyframes fadeIn{to{opacity:1}}
.side-panel{
  position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); z-index:56;
  background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; transform:translateX(100%); animation:slideIn .22s forwards;
}
@keyframes slideIn{to{transform:translateX(0)}}
.side-hd{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:16px 18px; border-bottom:1px solid var(--border);
}
.side-hd h2{margin:0; font-family:"Poppins",sans-serif; font-size:19px; font-weight:700}
.side-hd .n{color:var(--muted); font-size:13px; font-weight:600}
.side-cli{padding:14px 18px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.side-cli input{padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:14px; width:100%}
.side-bd{flex:1; overflow:auto; padding:14px 18px 8px}
.line{
  display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:11px 0;
  border-bottom:1px solid var(--border);
}
.line:last-child{border-bottom:none}
.line .nm{font-weight:600; font-size:14px; line-height:1.3}
.line .bd-row{display:flex; align-items:center; gap:8px; grid-column:1/-1; margin-top:4px; flex-wrap:wrap}
.line .bd-row select{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:12.5px}
.line .bd-row .info{font-size:12.5px; color:var(--muted)}
.line .qty{display:inline-flex; align-items:center; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px}
.line .qty button{border:none; background:transparent; color:var(--ink); width:26px; height:26px; border-radius:6px; font-size:15px; font-weight:700}
.line .qty button:hover{background:var(--border)}
.line .qty span{min-width:26px; text-align:center; font-weight:700; font-family:"JetBrains Mono",monospace}
.line .sub{font-weight:700; font-family:"JetBrains Mono",monospace; font-size:14px; text-align:right}
.line .rmv{border:none; background:transparent; color:var(--faint); padding:2px 6px; border-radius:6px; font-size:13px}
.line .rmv:hover{color:var(--bad); background:var(--bad-soft)}
.side-empty{padding:44px 20px; text-align:center; color:var(--muted)}
.side-empty .em{font-size:36px; margin-bottom:8px}
.side-tot{padding:14px 18px; border-top:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; gap:6px}
.side-tot .r{display:flex; justify-content:space-between; font-size:13.5px}
.side-tot .r b{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
.side-tot .gain{font-size:16px; font-weight:700; padding-top:6px; border-top:1px dashed var(--border-strong)}
.side-tot .gain .val{font-family:"Poppins",sans-serif}
.side-ft{padding:14px 18px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
.side-ft .btn{flex:1; justify-content:center; min-width:120px}
.mini-add{
  border:1px solid var(--accent); background:transparent; color:var(--accent);
  padding:6px 10px; border-radius:8px; font-size:12px; font-weight:700;
  display:inline-flex; align-items:center; gap:4px; transition:.15s;
}
.mini-add:hover{background:var(--accent); color:#fff}
.mini-add.in{background:var(--accent); color:#fff}
.mini-add.in::before{content:"✓ "}

/* Chips de estado (etapas del pedido/venta) */
.estado-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px}
.est-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:4px 9px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--muted); cursor:default; transition:.15s;
  text-transform:uppercase; letter-spacing:.02em;
}
.est-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex-shrink:0}
.est-chip.done{background:var(--good-soft); color:var(--good); border-color:var(--good)}
.est-chip.done .dot{background:var(--good)}
.est-chip.pending{background:var(--surface); color:var(--faint)}
.est-chip.action{background:var(--warn-soft); color:var(--warn); border-color:var(--warn); cursor:pointer}
.est-chip.action:hover{filter:brightness(1.05)}
.est-chip.action .dot{background:var(--warn); animation:pulse 1.4s ease-in-out infinite}
.est-arrow{color:var(--faint); font-size:12px; padding:0 1px}

/* Estado en detalle: timeline compacto con fechas */
.est-timeline{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px}
.est-timeline .row{display:flex; align-items:center; gap:10px; padding:5px 0}
.est-timeline .row.done .icon{background:var(--good); color:#fff}
.est-timeline .row.pending .icon{background:var(--surface); color:var(--faint); border:1px dashed var(--border-strong)}
.est-timeline .icon{width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0}
.est-timeline .label{flex:1; color:var(--muted)}
.est-timeline .row.done .label{color:var(--ink); font-weight:600}
.est-timeline .when{color:var(--faint); font-size:12px}
.est-timeline .act{margin-left:auto}
.est-timeline .act button{background:var(--warn); color:#fff; border:none; padding:5px 10px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer}
.est-timeline .act button:hover{filter:brightness(1.08)}
.est-timeline .undo{background:transparent!important; color:var(--faint)!important; border:1px solid var(--border)!important; font-weight:600!important}

/* Historial */
.hist-item{
  display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:12px 14px;
  border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface-2);
}
.hist-item .hd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.hist-item .cli{font-weight:700}
.hist-item .fec{color:var(--muted); font-size:12.5px}
.hist-item .sm{font-size:12.5px; color:var(--muted); grid-column:1/-1}
.hist-item .tt{text-align:right; font-family:"JetBrains Mono",monospace; font-weight:700}
.hist-item .tt .mini{font-size:11.5px; color:var(--muted); font-weight:600}
.hist-item .acts{grid-column:1/-1; display:flex; gap:6px; margin-top:2px}
.hist-item .acts button{font-size:12px; padding:5px 9px}

/* Stats con pedido */
.stats.with-cart{grid-template-columns:repeat(5,1fr)}
.stat.cart .rail{background:var(--warn)}
.stat.cart .v{color:var(--warn)}

@media (max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .stats.with-cart{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .f2{grid-template-columns:1fr}
  .fab-cart{right:14px; bottom:14px; padding:12px 16px}
  .side-panel{width:100%}
  .side-cli{grid-template-columns:1fr}
}
</style>

<body>
<div id="app"></div>
<div id="modal-host"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-import" accept="application/json,.json" style="display:none">

<script>
(function(){
  "use strict";

  var CFG_KEY='bm-supabase', THEME_KEY='bm-theme', CACHE_KEY='bm-cache', ROW_ID='main', SESSION_KEY='bm-session';
  // Configuración fija de VELORA — así los trabajadores no tienen que pegar nada al entrar
  var DEFAULT_CFG={
    url:'https://ubiingxrbjpiqlgqrewe.supabase.co',
    key:'sb_publishable_GO5vsVIFg2OEko1YuoUVSg__OKzxm4h'
  };
  var state={moneda:'COP', bodegas:[], bodegaTels:{}, productos:[], pedido:{items:[],cliente:{nombre:'',tel:''}}, pedidos:[], usuarios:[], carritos:{}, notifEmail:{enabled:true, accessKey:'', destinatario:'', extras:[]}, metaMensual:600000};
  var session=null; // {usuarioId, usuarioNombre, role}
  var cfg=null;              // {url,key}
  var GROUPS_KEY='bm-collapsed';
  var ui={q:'', sort:'marca', expanded:{}, collapsed:{}};
  try{ var _c=JSON.parse(localStorage.getItem(GROUPS_KEY)); if(_c && typeof _c==='object') ui.collapsed=_c; }catch(e){}
  var conn='off';            // off | connecting | ok | saving | err
  var lastServerStamp=null;  // updated_at conocido del servidor
  var dirty=false, saveTimer=null, pollTimer=null;
  var bootstrapping=false;   // esperando el primer pull del servidor

  /* tema */
  try{ var t=localStorage.getItem(THEME_KEY); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}

  /* ---------- utils ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function fmt(n){ if(n==null||isNaN(n)) return '—';
    if(state.moneda==='USD') return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
    return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
  function pct(n){ return (n>=0?'':'−')+Math.abs(Math.round(n))+'%'; }
  function validCostos(p){ return (p.costos||[]).filter(function(c){ return c.bodega && typeof c.costo==='number' && c.costo>0; }); }
  function best(p){ var v=validCostos(p); if(!v.length) return null; return v.reduce(function(a,b){ return b.costo<a.costo?b:a; }); }
  function marginPct(precio,costo){ if(!precio||precio<=0) return null; return (precio-costo)/precio*100; }
  function mgClass(m){ if(m==null) return ''; if(m>=40) return 'good'; if(m>=20) return 'warn'; return 'bad'; }
  function normUrl(u){ u=(u||'').trim().replace(/\/+$/,''); return u; }
  function autoUrl(){ try{ var o=location.origin; return /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(o)?o:''; }catch(e){ return ''; } }

  /* ---------- config ---------- */
  function loadCfg(){
    try{ var c=JSON.parse(localStorage.getItem(CFG_KEY)); if(c&&c.url&&c.key) return c; }catch(e){}
    // Sin config guardada → usar la default y guardarla automáticamente
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(DEFAULT_CFG)); }catch(e){}
    return DEFAULT_CFG;
  }
  function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }
  function cacheState(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }
  function loadCache(){ try{ var s=JSON.parse(localStorage.getItem(CACHE_KEY)); if(s&&s.productos) return s; }catch(e){} return null; }

  /* ---------- Supabase REST ---------- */
  function authFor(key){ var h={apikey:key}; if(/^eyJ/.test(key)) h.Authorization='Bearer '+key; return h; }
  function headers(){ return Object.assign({'Content-Type':'application/json'}, authFor(cfg.key)); }
  async function sbGet(){
    var r=await fetch(cfg.url+'/rest/v1/bodegas_data?id=eq.'+ROW_ID+'&select=data,updated_at',{headers:headers()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var rows=await r.json();
    return rows&&rows[0]?rows[0]:null;
  }
  async function sbSave(){
    var body={data:state, updated_at:new Date().toISOString()};
    var r=await fetch(cfg.url+'/rest/v1/bodegas_data?id=eq.'+ROW_ID,{method:'PATCH',headers:Object.assign({Prefer:'return=representation'},headers()),body:JSON.stringify(body)});
    if(r.status===404 || r.status===406){ throw new Error('no-row'); }
    if(!r.ok) throw new Error('HTTP '+r.status);
    var rows=await r.json();
    var row=rows&&rows[0];
    if(row) lastServerStamp=row.updated_at;
    if(!row){ // fila no existía: crearla
      var r2=await fetch(cfg.url+'/rest/v1/bodegas_data',{method:'POST',headers:Object.assign({Prefer:'resolution=merge-duplicates,return=representation'},headers()),body:JSON.stringify([{id:ROW_ID,data:state,updated_at:body.updated_at}])});
      if(!r2.ok) throw new Error('HTTP '+r2.status);
      var rr=await r2.json(); if(rr&&rr[0]) lastServerStamp=rr[0].updated_at;
    }
  }

  async function pullFromServer(applyIfNewer){
    try{
      var row=await sbGet();
      if(!row){ await sbSave(); return true; } // fila vacía -> siembra
      if(applyIfNewer && row.updated_at===lastServerStamp && !dirty) return false; // sin cambios
      if(!dirty){
        state=sanitize(row.data);
        lastServerStamp=row.updated_at;
        cacheState();
        return true;
      }
      return false;
    }catch(e){ throw e; }
  }
  function sanitize(d){
    d=d||{};
    var pedido=(d.pedido&&typeof d.pedido==='object')?d.pedido:{items:[],cliente:{nombre:'',tel:'',direccion:'',ciudad:'',notas:''}};
    if(!Array.isArray(pedido.items)) pedido.items=[];
    if(!pedido.cliente||typeof pedido.cliente!=='object') pedido.cliente={nombre:'',tel:'',direccion:'',ciudad:'',notas:''};
    if(pedido.cliente.direccion==null) pedido.cliente.direccion='';
    if(pedido.cliente.ciudad==null) pedido.cliente.ciudad='';
    if(pedido.cliente.notas==null) pedido.cliente.notas='';
    var ne=d.notifEmail && typeof d.notifEmail==='object' ? d.notifEmail : {};
    return {
      moneda:d.moneda||'COP',
      bodegas:Array.isArray(d.bodegas)?d.bodegas:[],
      bodegaTels:(d.bodegaTels&&typeof d.bodegaTels==='object')?d.bodegaTels:{},
      productos:Array.isArray(d.productos)?d.productos:[],
      pedido:pedido, // legado (compatibilidad)
      pedidos:Array.isArray(d.pedidos)?d.pedidos:[],
      usuarios:(Array.isArray(d.usuarios)?d.usuarios:[]).map(function(u){
        u.cedula = u.cedula || '';
        u.telefono = u.telefono || '';
        u.correo = u.correo || '';
        u.cuentaPago = u.cuentaPago || '';
        u.tutorialVisto = u.tutorialVisto || false;
        return u;
      }),
      carritos:(d.carritos&&typeof d.carritos==='object')?d.carritos:{},
      metaMensual: (typeof d.metaMensual==='number' && d.metaMensual>0) ? d.metaMensual : 600000,
      notifEmail:{
        enabled: ne.enabled!==false,
        accessKey: ne.accessKey || '',
        destinatario: ne.destinatario || '',
        fromName: ne.fromName || 'VELORA',
        extras: Array.isArray(ne.extras) ? ne.extras : [],
        keys: Array.isArray(ne.keys) ? ne.keys : []  // lista de {label, key} para múltiples destinatarios
      }
    };
  }
  /* ---------- usuarios / auth ---------- */
  function b64(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s){ var raw=atob(s), b=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) b[i]=raw.charCodeAt(i); return b.buffer; }
  function randSalt(){ var a=new Uint8Array(16); (window.crypto||window.msCrypto).getRandomValues(a); return b64(a.buffer); }
  async function hashPwd(password, saltB64){
    var enc=new TextEncoder();
    var key=await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:unb64(saltB64), iterations:100000, hash:'SHA-256'}, key, 256);
    return b64(bits);
  }
  async function verifyPwd(password, saltB64, hashB64){
    var h=await hashPwd(password, saltB64);
    return h===hashB64;
  }
  function uidUser(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function normNombre(n){ return String(n||'').trim().toLowerCase(); }
  function findUser(nombre){ var k=normNombre(nombre); return state.usuarios.find(function(u){return normNombre(u.nombre)===k;}); }
  function loadSession(){ try{ var s=JSON.parse(localStorage.getItem(SESSION_KEY)); if(s && s.usuarioId) return s; }catch(e){} return null; }
  function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} session=null; }
  function isAdmin(){ return session && session.role==='admin'; }
  function currentCart(){
    if(!session) return state.pedido; // fallback
    if(!state.carritos[session.usuarioId]) state.carritos[session.usuarioId]={items:[],cliente:{nombre:'',tel:''}};
    if(!Array.isArray(state.carritos[session.usuarioId].items)) state.carritos[session.usuarioId].items=[];
    if(!state.carritos[session.usuarioId].cliente) state.carritos[session.usuarioId].cliente={nombre:'',tel:''};
    return state.carritos[session.usuarioId];
  }
  function resetCurrentCart(){
    if(session) state.carritos[session.usuarioId]={items:[],cliente:{nombre:'',tel:'',direccion:'',ciudad:'',notas:''}};
    else state.pedido={items:[],cliente:{nombre:'',tel:'',direccion:'',ciudad:'',notas:''}};
  }
  // Helpers de precios de producto (con fallback si el mayorista aún no está fijado)
  function mayoristaOf(p){ var m=parseFloat(p&&p.precioMayorista); return (!isNaN(m)&&m>0)?m:(p&&p.precioVenta ? +p.precioVenta : 0); }
  function ventaOf(p){ return p && p.precioVenta ? +p.precioVenta : 0; }
  // Precio real de venta en una línea del carrito: usa el editado por el trabajador, si no el sugerido
  function itemVenta(it, p){
    var v=parseFloat(it && it.precioVendido);
    if(!isNaN(v) && v>0) return v;
    return ventaOf(p);
  }
  function setCurrentCart(c){
    if(session) state.carritos[session.usuarioId]=c;
    else state.pedido=c;
  }

  // Normaliza un teléfono a formato "wa.me" (solo dígitos, con código de país por defecto Colombia 57)
  function normTel(raw){
    if(!raw) return '';
    var d=String(raw).replace(/\D/g,'');
    if(!d) return '';
    // Si empieza con 57 o tiene 12-15 dígitos, dejarlo. Si tiene 10 dígitos (celular Colombia), prefijar 57.
    if(d.length===10) d='57'+d;
    return d;
  }

  function setConn(s){ conn=s; var el=document.getElementById('conn'); if(el) el.outerHTML=connHTML(); }
  function connHTML(){
    var map={off:['off','Sin conexión','Conectar'],connecting:['saving','Conectando…',''],ok:['ok','Sincronizado',''],saving:['saving','Guardando…',''],err:['err','Error de conexión','']};
    var m=map[conn]||map.off;
    var label = conn==='off' ? 'Conectar Supabase' : m[1];
    return '<button class="status '+m[0]+'" id="conn" data-act="config"><span class="led"></span>'+esc(label)+'</button>';
  }

  /* guardado con debounce */
  function scheduleSave(){
    dirty=true; cacheState(); setConn('saving');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(commit, 800);
  }
  async function commit(){
    if(!cfg){ setConn('off'); return; }
    setConn('saving');
    try{
      await sbSave();
      dirty=false; setConn('ok');
      showToast('Guardado y sincronizado', false);
    }catch(e){
      setConn('err');
      showToast('No se pudo guardar (se guardó local). Reintentando…', false);
      clearTimeout(saveTimer); saveTimer=setTimeout(commit, 4000);
    }
  }

  /* ---------- estados del pedido/venta ---------- */
  function ensureEstado(o){
    if(!o.estado || typeof o.estado!=='object'){
      o.estado={ realizado:{at:o.fecha||new Date().toISOString(), by:o.usuarioNombre||''}, envio:null, venta:null };
    }
    if(!o.estado.realizado) o.estado.realizado={at:o.fecha||new Date().toISOString(), by:o.usuarioNombre||''};
    if(o.estado.envio===undefined) o.estado.envio=null;
    if(o.estado.venta===undefined) o.estado.venta=null;
    return o.estado;
  }
  function estadoStage(o){
    // Devuelve 0..2: 0=solo realizado, 1=envio, 2=venta (todo hecho)
    ensureEstado(o);
    if(o.estado.venta) return 2;
    if(o.estado.envio) return 1;
    return 0;
  }
  function toggleEtapa(o, etapa){
    ensureEstado(o);
    var now=new Date().toISOString();
    var by=session ? session.usuarioNombre : '';
    if(etapa==='envio'){
      if(o.estado.envio){
        // Solo se puede desmarcar si venta no está confirmada
        if(o.estado.venta){ showToast('Primero desmarca "Venta realizada"',false); return; }
        o.estado.envio=null;
      } else {
        o.estado.envio={at:now, by:by};
      }
    } else if(etapa==='venta'){
      if(o.estado.venta){
        o.estado.venta=null;
      } else {
        // Confirmar venta requiere envío confirmado
        if(!o.estado.envio) o.estado.envio={at:now, by:by};
        o.estado.venta={at:now, by:by};
      }
    }
    scheduleSave();
  }

  /* ---------- meta mensual ---------- */
  // Solo Brayder01 (nombre exacto) puede editar la meta
  function puedeEditarMeta(){
    return session && session.role==='admin' && normNombre(session.usuarioNombre)==='brayder01';
  }
  function metaWidgetHTML(){
    if(!session) return '';
    // Brayder01 no ve el widget (lo edita desde el menú "⋯ Más")
    if(puedeEditarMeta()) return '';
    var meta = (typeof state.metaMensual==='number' && state.metaMensual>0) ? state.metaMensual : 600000;
    var mesKey = new Date().toISOString().slice(0,7);
    // Ventas totales del mes: si es trabajador, solo las suyas; si es admin, todas
    var admin = session.role==='admin';
    var mesPed = state.pedidos.filter(function(o){
      if((o.fecha||'').slice(0,7)!==mesKey) return false;
      if(admin) return true;
      return o.usuarioId===session.usuarioId;
    });
    var ventasMes = mesPed.reduce(function(a,o){return a+(o.ventaTotal||0);},0);
    var cobradas = mesPed.filter(function(o){ ensureEstado(o); return !!o.estado.venta; })
                          .reduce(function(a,o){return a+(o.ventaTotal||0);},0);
    var pct = meta>0 ? Math.min(200, Math.round(ventasMes/meta*100)) : 0;
    var barW = Math.min(100, pct);
    var barCls = pct>=100 ? 'done' : (pct>=60 ? '' : 'warn');
    var mesNombre = new Date().toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    var editBtn = puedeEditarMeta() ? '<button class="edit" data-act="edit-meta">Editar meta</button>' : '';
    var falta = Math.max(0, meta-ventasMes);
    return '<div class="meta-card">'+
      '<div class="meta-hd">'+
        '<span class="ttl">🎯 '+(admin?'Meta del equipo':'Mi meta')+' · '+esc(mesNombre)+'</span>'+
        '<span class="pct '+barCls+'">'+pct+'%</span>'+
      '</div>'+
      '<div class="meta-bar"><div class="fill '+barCls+'" style="width:'+barW+'%"></div></div>'+
      '<div class="meta-ft">'+
        '<span>Vendido: <b>'+fmt(ventasMes)+'</b> de <b>'+fmt(meta)+'</b>'+(cobradas!==ventasMes?' · <span style="color:var(--good)">Cobrado: '+fmt(cobradas)+'</span>':'')+'</span>'+
        '<span>'+ (pct>=100 ? '<span style="color:var(--good);font-weight:700">✓ Meta alcanzada</span>' : 'Falta <b>'+fmt(falta)+'</b>') +' '+editBtn+'</span>'+
      '</div>'+
    '</div>';
  }

  /* ---------- terminología según rol ---------- */
  // Admin ve "Ventas", trabajador ve "Pedidos". Uso consistente en la UI.
  function tPed(kind){
    var admin=isAdmin();
    switch(kind){
      case 'SG': return admin ? 'Venta' : 'Pedido';
      case 'PL': return admin ? 'Ventas' : 'Pedidos';
      case 'sg': return admin ? 'venta' : 'pedido';
      case 'pl': return admin ? 'ventas' : 'pedidos';
    }
    return 'Pedido';
  }

  /* ---------- ganancia real del admin ---------- */
  // Cuánto gana el DUEÑO (admin) por un pedido:
  // SIEMPRE = mayorista - costo bodega (la ganancia real de la empresa),
  // sin importar quién hizo la venta (admin o trabajador).
  function gananciaAdminDe(o){
    if(o.gananciaEmpresa!=null) return o.gananciaEmpresa;
    return (o.mayoristaTotal||0) - (o.costoTotal||0);
  }
  function gananciaAdminAll(list){ return list.reduce(function(a,o){return a+gananciaAdminDe(o);},0); }
  // Solo cuentan las ventas con pago confirmado
  function gananciaAdminConfirmada(list){
    return list.reduce(function(a,o){ ensureEstado(o); return a + (o.estado.venta ? gananciaAdminDe(o) : 0); },0);
  }
  function gananciaAdminPendiente(list){
    return list.reduce(function(a,o){ ensureEstado(o); return a + (o.estado.venta ? 0 : gananciaAdminDe(o)); },0);
  }

  /* ---------- resumen ---------- */
  function summary(){
    var margins=[], low=0;
    state.productos.forEach(function(p){ var b=best(p); if(b){ var m=marginPct(p.precioVenta,b.costo); if(m!=null){ margins.push(m); if(m<20) low++; } } });
    var avg=margins.length?margins.reduce(function(a,b){return a+b;},0)/margins.length:null;
    return {nprod:state.productos.length, nbod:state.bodegas.length, avg:avg, low:low};
  }

  function cartTotals(){
    var items=(currentCart().items||[]); var totC=0,totM=0,totV=0,units=0;
    items.forEach(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}); if(!p) return;
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p);
      var cst=b?b.costo:0;
      totC+= (cst||0)*it.cantidad;
      totM+= mayoristaOf(p)*it.cantidad;
      totV+= itemVenta(it,p)*it.cantidad;
      units+=it.cantidad;
    });
    return {
      costo:totC, mayorista:totM, venta:totV,
      // ganancia depende del rol: trabajador gana venta-mayorista; admin visualiza empresa (mayorista-costo bodega) + total (venta-costo)
      gananciaTrabajador: totV-totM,
      gananciaEmpresa: totM-totC,
      gananciaTotal: totV-totC,
      ganancia: isAdmin()? (totV-totC) : (totV-totM),
      unidades:units, lineas:items.length
    };
  }
  function fabCartHTML(){
    var t=cartTotals();
    if(!t.lineas) return '';
    return '<button class="fab-cart" data-act="open-cart" title="Ver pedido">'+

    if(admin){
      var mes=new Date().toISOString().slice(0,7);
      var pedMes=state.pedidos.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
      var gTot=gananciaAdminConfirmada(state.pedidos);

      function bigStat(k,v,cls){

      }
      statsHTML='<div class="stats">'+
        stat('Productos',s.nprod)+

        stat('Trabajadores', nTrab)+
        bigStat('Mi ganancia total', fmt(gTot))+
      '</div>'+
      '<div class="hint" style="margin:-8px 2px 16px; display:flex; gap:14px; flex-wrap:wrap">'+
        '<span>🏬 '+s.nbod+' bodegas</span>'+
        (s.avg!=null?'<span>margen prom. '+pct(s.avg)+'</span>':'')+
        (s.low>0?'<span style="color:var(--bad)">⚠ '+s.low+' con margen bajo</span>':'<span style="color:var(--good)">✓ sin productos con margen bajo</span>')+
        (gPend>0?'<span style="color:var(--warn)">⏳ Pendiente de pago: <b>'+fmt(gPend)+'</b></span>':'')+

      // trabajador: productos, pedidos este mes, ganancia este mes

      var mineMes=mine.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
      function gTrabDe(o){ if(o.gananciaTrabajador!=null) return o.gananciaTrabajador; return (o.ventaTotal||0)-(o.mayoristaTotal||0); }
      // Solo suma la ganancia cuando el admin confirma el pago (estado.venta)
      var pagadosMes=mineMes.filter(function(o){ ensureEstado(o); return !!o.estado.venta; });
      var pendMes=mineMes.filter(function(o){ ensureEstado(o); return !o.estado.venta; });
      var ganMes=pagadosMes.reduce(function(a,o){return a+gTrabDe(o);},0);
      var ganPend=pendMes.reduce(function(a,o){return a+gTrabDe(o);},0);
      statsHTML='<div class="stats">'+stat('Productos',s.nprod)+stat('Pedidos (este mes)',mineMes.length)+stat('Ganancia (este mes)',fmt(ganMes))+'</div>';

        statsHTML += '<div class="hint" style="margin:-8px 2px 16px; display:flex; gap:14px; flex-wrap:wrap">'+

      '<div class="top-tools">'+whoLine+connHTML()+
        (admin?'<button class="icon-btn" data-act="toggle-moneda" title="Cambiar moneda">'+(state.moneda==='USD'?'US$':'COP')+'</button>':'')+
        '<button class="icon-btn" data-act="toggle-theme" title="Tema claro/oscuro" aria-label="Cambiar tema">◐</button>'+
      '</div></div>'+ statsHTML;
  }
  function stat(k,v){ return '<div class="stat"><div class="rail"></div><div class="k">'+esc(k)+'</div><div class="v num">'+esc(v)+'</div></div>'; }
  function opt(v,label){ return '<option value="'+v+'"'+(ui.sort===v?' selected':'')+'>'+esc(label)+'</option>'; }

  function filtered(){
    var q=ui.q.trim().toLowerCase();
    var list=state.productos.filter(function(p){ if(!q) return true;
      var hay=(p.nombre||'')+' '+(p.sku||'')+' '+(p.marca||'')+' '+(p.costos||[]).map(function(c){return c.bodega;}).join(' ');
      return hay.toLowerCase().indexOf(q)>=0; });
    if(ui.sort==='marca'){
      // conserva el orden natural del array (por marca en el que se agregaron)
      return list;
    }
    list.sort(function(a,b){
      if(ui.sort==='nombre') return (a.nombre||'').localeCompare(b.nombre||'','es');
      if(ui.sort==='precio') return (b.precioVenta||0)-(a.precioVenta||0);
      if(ui.sort==='costo'){ var ca=best(a),cb=best(b); return (ca?ca.costo:Infinity)-(cb?cb.costo:Infinity); }
      if(ui.sort==='margen'){ var ma=best(a)?marginPct(a.precioVenta,best(a).costo):-Infinity; var mb=best(b)?marginPct(b.precioVenta,best(b).costo):-Infinity; return (mb==null?-Infinity:mb)-(ma==null?-Infinity:ma); }
      return 0; });
    return list;
  }
  function productsHTML(){
    var list=filtered();
    if(!state.productos.length) return '<div class="empty"><div class="em-ic">📦</div><h3>Todavía no hay productos</h3><p>Agrega tu primer producto: su precio de venta y a cómo te lo da cada bodega. La plataforma marca la bodega más barata y calcula tu ganancia.</p><button class="btn primary" data-act="new">＋ Agregar producto</button></div>';
    if(!list.length) return '<div class="empty"><div class="em-ic">🔍</div><h3>Sin resultados</h3><p>Ningún producto coincide con "'+esc(ui.q)+'".</p></div>';
    // Agrupar por marca respetando el orden en que aparecen
    var groups=[]; var byName={};
    list.forEach(function(p){
      var m=(p.marca||'').trim() || 'SIN MARCA';
      if(!byName[m]){ byName[m]={marca:m, items:[]}; groups.push(byName[m]); }
      byName[m].items.push(p);
    });
    // Auto-expandir cuando se busca; si no, respetar preferencia guardada
    var searching=!!ui.q.trim();
    return '<div class="plist">'+groups.map(function(g){
      var collapsed = !searching && ui.collapsed[g.marca];
      var margenes=g.items.map(function(p){var b=best(p); return b?marginPct(p.precioVenta,b.costo):null;}).filter(function(x){return x!=null;});
      var avg=margenes.length?Math.round(margenes.reduce(function(a,b){return a+b;},0)/margenes.length):null;
      return '<div class="pgroup'+(collapsed?' collapsed':'')+'" data-marca="'+esc(g.marca)+'">'+
        '<div class="pg-hdr" data-act="tg-group">'+
          '<span class="chev">▼</span>'+
          '<span class="name">'+esc(g.marca)+'</span>'+
          '<span class="count">'+g.items.length+'</span>'+
          (avg!=null?'<span class="avg">margen prom. '+pct(avg)+'</span>':'')+
        '</div>'+
        '<div class="pg-body">'+g.items.map(rowHTML).join('')+'</div>'+
      '</div>';
    }).join('')+'</div>';
  }

  function rowHTML(p){
    var admin=isAdmin();
    var b=best(p);
    var mayo=mayoristaOf(p);
    var venta=ventaOf(p);
    var mg=b?marginPct(venta,b.costo):null;
    var inCart=(currentCart().items||[]).some(function(it){return it.productId===p.id;});
    var expanded=!!ui.expanded[p.id];
    var row;
    if(admin){
      var costCell = b
        ? '<div class="pc">'+fmt(b.costo)+'<span class="bod">'+esc(b.bodega)+'</span></div>'
        : '<div class="pc none">— sin costo —</div>';
      var mgCell = mg!=null ? '<div class="pm '+mgClass(mg)+'">'+pct(mg)+'</div>' : '<div class="pm" style="color:var(--faint)">—</div>';
      row='<div class="prow'+(expanded?' expanded':'')+'" data-id="'+esc(p.id)+'" data-act="tg-row">'+

  function expandedHTML(p){
    var b=best(p);
    var costos=(p.costos||[]).slice().sort(function(x,y){return (x.costo||Infinity)-(y.costo||Infinity);});
    var body='';
    if(!costos.length){
      body='<div class="note">Sin bodegas cargadas. Toca <b>✎ Editar</b> para agregar la bodega y su costo.</div>';
    }else{
      body='<table><thead><tr><th>Bodega</th><th class="r">Costo</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>'+
        costos.map(function(c){
          var isBest=b&&c.bodega===b.bodega&&c.costo===b.costo;
          var m=(typeof c.costo==='number'&&c.costo>0)?marginPct(p.precioVenta,c.costo):null;
          var gan=(typeof c.costo==='number'&&c.costo>0&&p.precioVenta)?(p.precioVenta-c.costo):null;
          return '<tr><td'+(isBest?' class="best"':'')+'>'+esc(c.bodega)+(isBest?' ★':'')+'</td>'+
            '<td class="r num">'+fmt(c.costo)+'</td>'+
            '<td class="r num">'+(gan==null?'—':fmt(gan))+'</td>'+
            '<td class="r num mg '+mgClass(m)+'">'+(m==null?'—':pct(m))+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    if(p.notas) body+='<div class="note">📝 '+esc(p.notas)+'</div>';
    return body;
  }

  async function tryConnect(){
    var url=normUrl(document.getElementById('s-url').value);
    var key=(document.getElementById('s-key').value||'').trim();
    var msg=document.getElementById('s-msg');
    if(!/^https:\/\/.+\.supabase\.co$/.test(url)){ msg.innerHTML='<div class="callout warn">La URL debe verse como <b>https://xxxxx.supabase.co</b> (sin barra al final).</div>'; return; }
    if(!key||key.length<20){ msg.innerHTML='<div class="callout warn">La clave anon parece incompleta. Cópiala completa.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Probando conexión…</div>';
    var testCfg={url:url,key:key};
    try{
      var r=await fetch(url+'/rest/v1/bodegas_data?id=eq.'+ROW_ID+'&select=data,updated_at',{headers:authFor(key)});
      if(r.status===401||r.status===403){ msg.innerHTML='<div class="callout warn">La clave no tiene acceso. Revisa que copiaste la clave <b>anon/public</b> y que corriste el SQL.</div>'; return; }
      if(r.status===404){ msg.innerHTML='<div class="callout warn">No encuentro la tabla <b>bodegas_data</b>. ¿Corriste el texto SQL del Paso 2?</div>'; return; }
      if(!r.ok){ msg.innerHTML='<div class="callout warn">Error '+r.status+'. Revisa la URL y la clave.</div>'; return; }
      var rows=await r.json();
      cfg=testCfg; saveCfg(cfg);
      if(rows&&rows[0]){ state=sanitize(rows[0].data); lastServerStamp=rows[0].updated_at; }
      else { state=sanitize({}); await sbSave(); }
      // ¿hay respaldo local con datos y el servidor está vacío? ofrecer subirlo
      var cache=loadCache();
      if(cache && cache.productos && cache.productos.length && (!state.productos || !state.productos.length)){
        if(confirm('Encontré '+cache.productos.length+' producto(s) guardados en este dispositivo y la base en la nube está vacía. ¿Subirlos a la nube?')){
          state=sanitize(cache); dirty=true; await commit();
        }
      }
      cacheState(); setConn('ok'); render(); startPolling();
      showToast('¡Conectado! Sincronización activa', false);
    }catch(e){ msg.innerHTML='<div class="callout warn">No pude conectar. Revisa tu internet y que la URL sea correcta.</div>'; }
  }

  async function tryLogin(){
    var name=(document.getElementById('lg-name').value||'').trim();
    var pwd=(document.getElementById('lg-pwd').value||'');
    var msg=document.getElementById('lg-msg');
    if(!name||!pwd){ msg.innerHTML='<div class="callout warn">Escribe usuario y contraseña.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Verificando…</div>';
    // sincroniza el estado antes de validar (para respetar cambios recientes del admin)
    try{ await pullFromServer(false); }catch(e){}
    var u=findUser(name);
    if(!u){ msg.innerHTML='<div class="callout warn">Usuario o contraseña incorrectos.</div>'; return; }
    var ok=await verifyPwd(pwd, u.salt, u.hash);
    if(!ok){ msg.innerHTML='<div class="callout warn">Usuario o contraseña incorrectos.</div>'; return; }
    session={usuarioId:u.id, usuarioNombre:u.nombre, role:u.role};
    saveSession(session);
    render(); startPolling();
    showToast('Bienvenido, '+u.nombre, false);
    autoStartTutorial();

  async function tryCreateFirstAdmin(){
    var name=(document.getElementById('lg-name').value||'').trim();
    var pwd=(document.getElementById('lg-pwd').value||'');
    var pwd2=(document.getElementById('lg-pwd2').value||'');
    var msg=document.getElementById('lg-msg');
    if(!name||name.length<2){ msg.innerHTML='<div class="callout warn">Escribe un nombre de usuario (mínimo 2 letras).</div>'; return; }
    if(pwd.length<4){ msg.innerHTML='<div class="callout warn">La contraseña debe tener al menos 4 caracteres.</div>'; return; }
    if(pwd!==pwd2){ msg.innerHTML='<div class="callout warn">Las contraseñas no coinciden.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Verificando…</div>';
    // Anti-race: pull antes de crear para no pisar usuarios existentes
    try{ await pullFromServer(false); }catch(e){}
    if(state.usuarios.length){
      // Ya hay usuarios registrados — pasar a modo login
      renderLogin();
      var m2=document.getElementById('lg-msg');
      if(m2) m2.innerHTML='<div class="callout warn">Ya existe una cuenta creada. Inicia sesión con tu usuario y contraseña.</div>';
      var n=document.getElementById('lg-name'); if(n){ n.value=name; var p=document.getElementById('lg-pwd'); if(p){ p.value=pwd; p.focus(); } }
      return;
    }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Creando…</div>';
    var salt=randSalt(); var hash=await hashPwd(pwd, salt);
    var u={id:uidUser(), nombre:name, salt:salt, hash:hash, role:'admin', createdAt:new Date().toISOString()};
    state.usuarios.push(u);
    session={usuarioId:u.id, usuarioNombre:u.nombre, role:u.role};
    saveSession(session);
    await commit();
    render(); startPolling();
    showToast('¡Cuenta creada! Bienvenido, '+u.nombre, false);
  }

        var av=state.pedidos.filter(function(o){return o.usuarioId===a.id;}).reduce(function(x,o){return x+(o.ventaTotal||0);},0);
        var bv=state.pedidos.filter(function(o){return o.usuarioId===b.id;}).reduce(function(x,o){return x+(o.ventaTotal||0);},0);

            (!isMe?'<button class="del" data-act="us-del">🗑</button>':'')+

  async function createUser(){

    if(name.length<2){ showToast('Nombre muy corto',false); return; }

    var correo=(document.getElementById('nu-correo').value||'').trim();
    var cuentaPago=(document.getElementById('nu-pago').value||'').trim();

    });

  function saveUserData(uid){
    var u=state.usuarios.find(function(x){return x.id===uid;}); if(!u) return;
    var nv=(document.getElementById('ue-name').value||'').trim();
    if(nv.length<2){ showToast('Nombre muy corto',false); return; }
    if(nv!==u.nombre){
      var otro=state.usuarios.find(function(x){return x.id!==u.id && normNombre(x.nombre)===normNombre(nv);});
      if(otro){ showToast('Ese nombre ya existe',false); return; }
      u.nombre=nv;
      if(session && session.usuarioId===u.id){ session.usuarioNombre=nv; saveSession(session); }
    }
    u.cedula=(document.getElementById('ue-cedula').value||'').trim();
    u.telefono=(document.getElementById('ue-tel').value||'').trim();
    u.correo=(document.getElementById('ue-correo').value||'').trim();
    u.cuentaPago=(document.getElementById('ue-pago').value||'').trim();
    scheduleSave();
    showToast('Datos guardados',false);
    if(isAdmin()) viewUser(u.id); else closeModal();
    if(!isAdmin()) render();
  }

  /* ---------- polling / sync al volver ---------- */
  function startPolling(){
    stopPolling();
    pollTimer=setInterval(function(){ if(document.visibilityState==='visible') syncPull(); }, 25000);
    document.addEventListener('visibilitychange', onVis);

    host.querySelector('[data-role="badd"]').addEventListener('click',function(){ var inp=modal.querySelector('[data-role="bnew"]'); var v=inp.value.trim(); if(v&&state.bodegas.indexOf(v)<0){ state.bodegas.push(v); reRows(); } inp.value=''; inp.focus(); });
    listEl.addEventListener('click',function(e){
      if(e.target.matches('[data-role="bdel"]')){
        var i=+e.target.closest('.bod-row').getAttribute('data-i'); var name=state.bodegas[i];
        var uses=state.productos.filter(function(p){ return (p.costos||[]).some(function(c){return c.bodega===name;}); }).length;
        if(uses>0){ showToast('“'+name+'” está en uso por '+uses+' producto(s)',false); return; }
        state.bodegas.splice(i,1); delete state.bodegaTels[name]; reRows();
      }

    host.querySelectorAll('[data-role="close"]').forEach(function(b){ b.addEventListener('click',doClose); });
    host.querySelector('[data-role="scrim"]').addEventListener('mousedown',function(e){ if(e.target===e.currentTarget) doClose(); });
    host.querySelector('[data-role="bsave"]').addEventListener('click',function(){
      var rowsN=listEl.querySelectorAll('.bod-row');
      var newList=[]; var newTels={};
      rowsN.forEach(function(row){
        var oldName=state.bodegas[+row.getAttribute('data-i')];
        var nv=row.querySelector('[data-role="bname"]').value.trim();
        var tel=row.querySelector('[data-role="btel"]').value.trim();
        if(!nv){ newList.push(oldName); if(tel) newTels[oldName]=tel; return; }
        if(nv!==oldName){
          state.productos.forEach(function(p){ (p.costos||[]).forEach(function(c){ if(c.bodega===oldName) c.bodega=nv; }); });
        }
        newList.push(nv);
        if(tel) newTels[nv]=tel;
      });
      // dedupe
      state.bodegas=newList.filter(function(v,i){ return newList.indexOf(v)===i; });
      state.bodegaTels=newTels;
      closeModal(); render(); scheduleSave();
    });
  }

  /* ---------- exportar / respaldo ---------- */
  function download(filename, text, mime){
    var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }
  function exportCSV(){
    var rows=[['Producto','SKU','Precio venta','Bodega','Costo','Ganancia','Margen %','Mejor opción']];
    state.productos.forEach(function(p){ var b=best(p);
      (p.costos||[]).forEach(function(c){ var gan=(p.precioVenta&&c.costo)?p.precioVenta-c.costo:''; var m=marginPct(p.precioVenta,c.costo);
        rows.push([p.nombre,p.sku||'',p.precioVenta||'',c.bodega,c.costo||'',gan,m==null?'':Math.round(m),(b&&c.bodega===b.bodega&&c.costo===b.costo)?'Sí':'']); });
      if(!(p.costos||[]).length) rows.push([p.nombre,p.sku||'',p.precioVenta||'','','','','','']); });
    var csv=rows.map(function(r){ return r.map(function(cell){ var s=String(cell==null?'':cell); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(','); }).join('\r\n');
    download('bodegas-margenes.csv','﻿'+csv,'text/csv;charset=utf-8'); showToast('CSV exportado',false);
  }
  function backup(){ download('respaldo-bodegas-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(state,null,2),'application/json'); showToast('Respaldo descargado',false); }
  function doImport(){ document.getElementById('file-import').click(); }
  document.getElementById('file-import').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{ var d=JSON.parse(rd.result); d=sanitize(d);
      if(confirm('Esto reemplazará los datos actuales con los del respaldo ('+d.productos.length+' productos). ¿Continuar?')){ state=d; closeModal(); render(); if(cfg) scheduleSave(); else { cacheState(); } showToast('Respaldo restaurado',false); }
    }catch(err){ alert('El archivo no es un respaldo válido.'); } e.target.value=''; };
    rd.readAsText(f);
  });

  function pedidoToEmailText(order){
    var lines=[];
    lines.push('🛍️ NUEVO PEDIDO');
    lines.push('');
    lines.push('👤 Cliente: '+(order.cliente&&order.cliente.nombre||'(sin nombre)'));
    if(order.cliente&&order.cliente.tel) lines.push('📱 Tel: '+order.cliente.tel);
    if(order.cliente&&order.cliente.direccion) lines.push('📍 Dirección: '+order.cliente.direccion+(order.cliente.ciudad?', '+order.cliente.ciudad:''));
    if(order.cliente&&order.cliente.notas) lines.push('📝 Notas: '+order.cliente.notas);
    if(order.usuarioNombre) lines.push('');
    if(order.usuarioNombre) lines.push('Realizado por: '+order.usuarioNombre);
    lines.push('');
    lines.push('PRODUCTOS:');
    (order.items||[]).forEach(function(it){
      lines.push('  • '+it.cantidad+'x '+it.nombre+' — '+fmt(it.precio)+' c/u = '+fmt(it.precio*it.cantidad));
    });
    lines.push('');
    lines.push('Unidades: '+order.unidades);
    if(order.mayoristaTotal) lines.push('Mayorista total: '+fmt(order.mayoristaTotal));
    lines.push('TOTAL AL CLIENTE: '+fmt(order.ventaTotal));
    if(order.costoTotal!=null) lines.push('Costo bodegas: '+fmt(order.costoTotal));
    if(order.gananciaTotal!=null) lines.push('Ganancia total: '+fmt(order.gananciaTotal));
    lines.push('');
    lines.push('Fecha: '+new Date(order.fecha||Date.now()).toLocaleString('es-CO'));
    return lines.join('\n');
  }

  async function enviarEmailPedido(order){
    var ne=state.notifEmail||{};
    if(!ne.enabled){ return {skipped:true}; }
    var fromName=(ne.fromName||'VELORA').trim() || 'VELORA';
    // Junto todas las keys: la principal + las adicionales del array keys[]
    var allKeys=[];
    if(ne.accessKey) allKeys.push({label:'principal', key:ne.accessKey});
    (ne.keys||[]).forEach(function(k){
      if(k && k.key && String(k.key).trim()) allKeys.push({label:(k.label||'admin').trim(), key:String(k.key).trim()});
    });
    if(!allKeys.length){ return {skipped:true, reason:'no-keys'}; }
    var subject='🛍️ '+fromName+' — Nuevo pedido — '+((order.cliente&&order.cliente.nombre)||'sin cliente')+' — '+fmt(order.ventaTotal);
    var results=[];
    for(var i=0;i<allKeys.length;i++){
      var body={access_key: allKeys[i].key, subject: subject, from_name: fromName, message: pedidoToEmailText(order)};
      try{
        var r=await fetch('https://api.web3forms.com/submit', {
          method:'POST',
          headers:{'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify(body)
        });
        var j=await r.json().catch(function(){return {};});
        results.push({label:allKeys[i].label, ok:r.ok && j.success!==false, response:j});
      }catch(e){ results.push({label:allKeys[i].label, ok:false, error:String(e)}); }
    }
    var allOk=results.every(function(x){return x.ok;});
    return {ok:allOk, results:results, count:allKeys.length};
  }

  function endTutorial(marcarVisto){
    // Ejecuta onExit del paso actual

    if(cur && typeof cur.onExit==='function'){ try{ cur.onExit(); }catch(e){} }
    document.querySelectorAll('.tut-overlay, .tut-card, .tut-halo').forEach(function(el){ el.remove(); });
    // Limpieza universal
    tutCleanupDemoCart();
    tutCloseCartPanel();
    tutCloseMenu();
    if(marcarVisto && session){
      var u=state.usuarios.find(function(x){return x.id===session.usuarioId;});
      if(u && !u.tutorialVisto){ u.tutorialVisto=true; scheduleSave(); }
    }
  }
  function renderTutorial(){
    // Ejecuta onExit del paso anterior (si cambió el índice)
    if(tutState.prevIndex>=0 && tutState.prevIndex!==tutState.index){
      var prev=tutState.steps[tutState.prevIndex];
      if(prev && typeof prev.onExit==='function'){ try{ prev.onExit(); }catch(e){} }
    }
    document.querySelectorAll('.tut-overlay, .tut-card, .tut-halo').forEach(function(el){ el.remove(); });
    var step=tutState.steps[tutState.index]; if(!step) return endTutorial(true);
    // Ejecuta onEnter del paso actual
    if(typeof step.onEnter==='function'){ try{ step.onEnter(); }catch(e){} }
    tutState.prevIndex=tutState.index;
    // Overlay pleno SOLO si no hay elemento a resaltar (el halo crea el spotlight cuando hay uno)
    var el = step.sel ? document.querySelector(step.sel) : null;
    if(!el && !step.sel){
      // Solo fondo oscuro cuando no hay ningún elemento a resaltar (paso final)
      var overlay=document.createElement('div'); overlay.className='tut-overlay';
      document.body.appendChild(overlay);
    }
    var card=document.createElement('div'); card.className='tut-card';
    var n=tutState.index+1, tot=tutState.steps.length;
    var isLast=(n===tot);
    var dots=''; for(var i=0;i<tot;i++){ dots += '<span class="dot'+(i===tutState.index?' on':'')+'"></span>'; }
    card.innerHTML=
      '<div class="step">Paso '+n+' de '+tot+' <button class="skip" data-tut="skip">Cerrar tutorial</button></div>'+
      '<h3>'+esc(step.title)+'</h3><p>'+esc(step.body)+'</p>'+
      '<div class="nav">'+
        '<div class="dots">'+dots+'</div>'+
        '<div class="btns">'+
          (tutState.index>0 ? '<button data-tut="prev">Atrás</button>' : '')+
          (isLast ? '<button class="next" data-tut="done">¡Entendido!</button>' : '<button class="next" data-tut="next">Siguiente</button>')+
        '</div>'+
      '</div>';
    document.body.appendChild(card);
    tutState.currentCard=card;
    if(el){
      positionTutHalo(el, card);
    } else {
      // Sin elemento a la primera: intento hasta 3 veces con delay (por si openCart/openMenu tarda)
      if(step.sel){
        var attempts=0;
        var iv=setInterval(function(){
          attempts++;
          var el2=document.querySelector(step.sel);
          if(el2){ clearInterval(iv); positionTutHalo(el2, card); return; }
          if(attempts>=8){ clearInterval(iv); centerCard(card); }
        }, 120);
      } else {
        centerCard(card);
      }
    }
  }
  function centerCard(card){
    card.style.top='50%'; card.style.left='50%'; card.style.transform='translate(-50%,-50%)';
  }
  function positionTutHalo(el, card){
    // Quitar halo anterior si existe
    document.querySelectorAll('.tut-halo').forEach(function(h){ h.remove(); });
    el.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){
      var r=el.getBoundingClientRect();
      var halo=document.createElement('div'); halo.className='tut-halo';
      halo.style.top=(r.top-6)+'px'; halo.style.left=(r.left-6)+'px';
      halo.style.width=(r.width+12)+'px'; halo.style.height=(r.height+12)+'px';
      document.body.appendChild(halo);
      // Posicionar card debajo/arriba/al lado
      var cw=card.offsetWidth||320, ch=card.offsetHeight||160;
      var vw=window.innerWidth, vh=window.innerHeight;
      var top, left;
      if(r.bottom + ch + 20 <= vh){
        top = r.bottom + 16;
        left = Math.min(Math.max(12, r.left), vw - cw - 12);
      } else if(r.top - ch - 20 >= 0){
        top = r.top - ch - 16;
        left = Math.min(Math.max(12, r.left), vw - cw - 12);
      } else {
        top = Math.max(12, (vh - ch)/2);
        left = Math.max(12, (vw - cw)/2);
      }
      card.style.top=top+'px'; card.style.left=left+'px'; card.style.transform='none';
    }, 350);
  }

  function addToCart(pid){
    var p=state.productos.find(function(x){return x.id===pid;}); if(!p) return;
    var it=currentCart().items.find(function(x){return x.productId===pid;});
    if(it){ it.cantidad++; }
    else {
      var b=best(p);
      currentCart().items.push({productId:pid, bodega:b?b.bodega:'', cantidad:1});
    }
    showToast('Añadido al pedido',false);
    render(); scheduleSave();
  }
  function changeQty(pid, delta){
    var it=currentCart().items.find(function(x){return x.productId===pid;});
    if(!it) return;
    it.cantidad+=delta;
    if(it.cantidad<=0) currentCart().items=currentCart().items.filter(function(x){return x.productId!==pid;});
    renderCart(); refreshProds(); updateFab(); scheduleSave();
  }

  // Agrupa los items del pedido por bodega y arma un botón "Enviar a X" por cada una
  function cartByBodega(){
    var map={};
    (currentCart().items||[]).forEach(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}); if(!p) return;
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p);
      var bodega= b ? b.bodega : (it.bodega||'(sin bodega)');
      if(!map[bodega]) map[bodega]={bodega:bodega, items:[], subCosto:0, unidades:0};
      var costo=b?b.costo:0;
      map[bodega].items.push({p:p, cantidad:it.cantidad, costo:costo});
      map[bodega].subCosto += costo*it.cantidad;
      map[bodega].unidades += it.cantidad;
    });
    return Object.keys(map).map(function(k){return map[k];});
  }

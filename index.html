<style>
/* ========== Sistema de diseño estilo Apple (colores del sistema iOS / macOS) ========== */
:root{
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: "Sora", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;

  --ground:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --surface-3:#e5e5ea;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(120,120,128,.20);
  --ink:#000000; --muted:#6e6e73; --faint:#8e8e93;
  --border:#e5e5ea; --border-strong:#d1d1d6; --hairline:rgba(60,60,67,.18);
  --accent:#0f9d5c; --accent-soft:rgba(18,183,106,.13); --accent-ink:#0b7d48; --accent-contrast:#ffffff; --brand:#12b76a; --brand-ink:#0c0f0d;
  --good:#248a3d; --good-soft:rgba(52,199,89,.14); --good-contrast:#ffffff; --good-fill:#34c759;
  --warn:#c93400; --warn-soft:rgba(255,149,0,.14); --warn-fill:#ff9500;
  --bad:#ff3b30; --bad-soft:rgba(255,59,48,.12);
  --purple:#af52de; --indigo:#5856d6; --pink:#ff2d55; --teal:#30b0c7; --yellow:#ffcc00; --gray-tile:#8e8e93;

  --glass:rgba(255,255,255,.72); --glass-thick:rgba(249,249,251,.86);
  --glass-edge:rgba(255,255,255,.65); --glass-stroke:rgba(0,0,0,.06);
  --scrim:rgba(0,0,0,.28);

  --shadow:0 0 0 .5px rgba(0,0,0,.03), 0 1px 3px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.04);
  --shadow-lg:0 0 0 .5px rgba(0,0,0,.05), 0 24px 64px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.08);
  --shadow-float:0 0 0 .5px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);

  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px;

  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-apple: cubic-bezier(.32,.72,0,1);
  --ease-spring: cubic-bezier(.34,1.36,.64,1);
  --ease-soft: cubic-bezier(.25,.1,.25,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(120,120,128,.36);
    --ink:#ffffff; --muted:#98989d; --faint:#6c6c70;
    --border:#38383a; --border-strong:#48484a; --hairline:rgba(84,84,88,.6);
    --accent:#1fb36c; --accent-soft:rgba(46,229,157,.18); --accent-ink:#3ddc8f; --accent-contrast:#ffffff; --brand:#2ee59d; --brand-ink:#ffffff;
    --good:#30d158; --good-soft:rgba(48,209,88,.18); --good-contrast:#ffffff; --good-fill:#30d158;
    --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --warn-fill:#ff9f0a;
    --bad:#ff453a; --bad-soft:rgba(255,69,58,.18);
    --purple:#bf5af2; --indigo:#5e5ce6; --pink:#ff375f; --teal:#40c8e0; --yellow:#ffd60a; --gray-tile:#636366;
    --glass:rgba(30,30,32,.72); --glass-thick:rgba(28,28,30,.86);
    --glass-edge:rgba(255,255,255,.1); --glass-stroke:rgba(255,255,255,.08);
    --scrim:rgba(0,0,0,.5);
    --shadow:0 0 0 .5px rgba(255,255,255,.04);
    --shadow-lg:0 0 0 .5px rgba(255,255,255,.08), 0 24px 64px rgba(0,0,0,.6);
    --shadow-float:0 0 0 .5px rgba(255,255,255,.1), 0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(120,120,128,.36);
  --ink:#ffffff; --muted:#98989d; --faint:#6c6c70;
  --border:#38383a; --border-strong:#48484a; --hairline:rgba(84,84,88,.6);
  --accent:#1fb36c; --accent-soft:rgba(46,229,157,.18); --accent-ink:#3ddc8f; --accent-contrast:#ffffff; --brand:#2ee59d; --brand-ink:#ffffff;
  --good:#30d158; --good-soft:rgba(48,209,88,.18); --good-contrast:#ffffff; --good-fill:#30d158;
  --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --warn-fill:#ff9f0a;
  --bad:#ff453a; --bad-soft:rgba(255,69,58,.18);
  --purple:#bf5af2; --indigo:#5e5ce6; --pink:#ff375f; --teal:#40c8e0; --yellow:#ffd60a; --gray-tile:#636366;
  --glass:rgba(30,30,32,.72); --glass-thick:rgba(28,28,30,.86);
  --glass-edge:rgba(255,255,255,.1); --glass-stroke:rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.5);
  --shadow:0 0 0 .5px rgba(255,255,255,.04);
  --shadow-lg:0 0 0 .5px rgba(255,255,255,.08), 0 24px 64px rgba(0,0,0,.6);
  --shadow-float:0 0 0 .5px rgba(255,255,255,.1), 0 10px 30px rgba(0,0,0,.5);
}

/* ========== Animaciones globales ========== */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes fadeInUp { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }
@keyframes fadeInDown { from{opacity:0; transform:translateY(-12px)} to{opacity:1; transform:translateY(0)} }
@keyframes scaleIn { from{opacity:0; transform:scale(.94)} to{opacity:1; transform:scale(1)} }
@keyframes slideInRight { from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:translateX(0)} }
@keyframes slideInLeft { from{opacity:0; transform:translateX(-24px)} to{opacity:1; transform:translateX(0)} }
@keyframes shimmer { 0%{background-position:-800px 0} 100%{background-position:800px 0} }
@keyframes ripple { from{transform:scale(0); opacity:.35} to{transform:scale(4); opacity:0} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes shine { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
@keyframes spin360 { to{transform:rotate(360deg)} }
@keyframes bounceIn { 0%{opacity:0; transform:scale(.6)} 60%{opacity:1; transform:scale(1.05)} 100%{transform:scale(1)} }
@keyframes softPulse { 0%,100%{opacity:1} 50%{opacity:.55} }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* Hover en stats (sin animar entrada — se re-renderiza a menudo) */
.stat{ transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out), border-color .2s ease }
.stat:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--border-strong) }

/* Ripple para botones */
.btn, .icon-btn, .pcard-add, .pcard-stock-btn { position:relative; overflow:hidden }
.btn::after, .icon-btn::after, .pcard-add::after, .pcard-stock-btn::after{
  content:""; position:absolute; inset:auto; left:var(--rx,50%); top:var(--ry,50%);
  width:8px; height:8px; border-radius:50%; background:currentColor; opacity:0;
  transform:translate(-50%,-50%) scale(0); pointer-events:none;
}
.btn.rippling::after, .icon-btn.rippling::after, .pcard-add.rippling::after, .pcard-stock-btn.rippling::after{
  animation: ripple .6s ease-out;
}
*{box-sizing:border-box}
html,body{margin:0; overflow-x:hidden; width:100%; max-width:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--font);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-x:none;
}
.num{font-family:var(--font); font-variant-numeric:tabular-nums}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}

.wrap{max-width:1120px; margin:0 auto; padding:22px 20px 80px}
@media (max-width:640px){ .wrap{padding:16px 12px 80px} }

.top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand h1{font-family:var(--font-display); font-weight:700; font-size:clamp(22px,3.4vw,30px); margin:0; letter-spacing:-.02em; text-wrap:balance}
.brand p{margin:0; color:var(--muted); font-size:13.5px}
.top-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
@media (max-width:640px){
  .top{gap:10px; margin-bottom:14px}
  .brand h1{font-size:22px}
  .brand p{font-size:12.5px}
  .top-tools{width:100%; justify-content:flex-start; flex-wrap:wrap; gap:6px}
  .top-tools .who-chip{font-size:11.5px; padding:4px 10px}
  .top-tools .icon-btn{padding:4px 8px; font-size:12px; min-width:34px; min-height:32px}
  .top-tools .conn-chip{font-size:11.5px; padding:4px 10px}
}
.icon-btn{background:var(--surface); border:1px solid var(--border); color:var(--muted); min-width:38px; height:38px; padding:0 10px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:15px; transition:.15s}
.icon-btn:hover{color:var(--ink); border-color:var(--border-strong)}

.status{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--muted)}
.status .led{width:8px; height:8px; border-radius:50%; background:var(--faint); flex-shrink:0}
.status.ok .led{background:var(--good)} .status.ok{color:var(--good); border-color:var(--good-soft)}
.status.saving .led{background:var(--warn); animation:pulse 1s ease-in-out infinite}
.status.err .led{background:var(--bad)} .status.err{color:var(--bad); border-color:var(--bad-soft); cursor:pointer}
.status.off{cursor:pointer}
@keyframes pulse{50%{opacity:.35}}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.stat .k{font-size:12px; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; font-weight:600}
.stat .v{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:-.02em; margin-top:4px}
.stat.alert .v{color:var(--bad)} .stat.alert.zero .v{color:var(--good)}
.stat .rail{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent)}
.stat.alert .rail{background:var(--bad)} .stat.alert.zero .rail{background:var(--good)}

.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.search{position:relative; flex:1 1 240px; min-width:180px}
.search input{width:100%; padding:10px 12px 10px 36px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px}
.search input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint)}
select.sort{padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px}
.btn{border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:10px 14px; border-radius:10px; font-size:14px; font-weight:600; transition:transform .18s var(--ease-out), border-color .2s ease, background .2s ease, box-shadow .25s ease, color .2s ease; display:inline-flex; align-items:center; gap:7px; cursor:pointer}
.btn:hover{border-color:var(--border-strong); transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.08)}
.btn:active{transform:translateY(0); transition-duration:.05s}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast)}
.btn.primary:hover{filter:brightness(1.08); box-shadow:0 6px 20px rgba(0,0,0,.18)}
.btn.ghost{background:transparent}
.icon-btn{transition:transform .18s var(--ease-out), border-color .2s ease, color .2s ease, background .2s ease; cursor:pointer}
.icon-btn:hover{transform:translateY(-1px); background:var(--surface-2)}
.icon-btn:active{transform:translateY(0); transition-duration:.05s}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column}
.card-hd{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:16px 16px 10px}
.p-name{font-weight:700; font-size:16.5px; letter-spacing:-.01em; line-height:1.25}
.p-name .sku{display:block; font-weight:500; font-size:12px; color:var(--faint); margin-top:2px; letter-spacing:.02em}
.p-acts{display:flex; gap:4px; flex-shrink:0}
.mini{border:none; background:transparent; color:var(--faint); width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-size:14px; transition:.15s}
.mini:hover{background:var(--surface-2); color:var(--ink)}
.mini.del:hover{background:var(--bad-soft); color:var(--bad)}
.p-price{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:0 16px 12px}
.p-price .lbl{font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600}
.p-price .val{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-.02em}
.btable{width:100%; border-collapse:collapse; font-size:13.5px}
.btable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 16px; background:var(--surface-2); border-top:1px solid var(--border); border-bottom:1px solid var(--border)}
.btable th.r, .btable td.r{text-align:right}
.btable td{padding:9px 16px; border-bottom:1px solid var(--border)}
.btable tr:last-child td{border-bottom:none}
.btable tr.best td{background:var(--accent-soft)}
.bod-name{display:flex; align-items:center; gap:7px}
.tag-best{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; background:var(--accent); color:var(--accent-contrast); padding:2px 6px; border-radius:5px}
.mg{font-weight:600}
.mg.good{color:var(--good)} .mg.warn{color:var(--warn)} .mg.bad{color:var(--bad)}
.card-ft{padding:11px 16px; font-size:13px; color:var(--muted); border-top:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.card-ft b{color:var(--ink)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex-shrink:0}
.no-bod{color:var(--faint); font-style:italic}

.empty{text-align:center; padding:64px 20px; border:1.5px dashed var(--border-strong); border-radius:18px; background:var(--surface); color:var(--muted)}
.empty .em-ic{font-size:40px; margin-bottom:8px}
.empty h3{margin:0 0 6px; color:var(--ink); font-family:var(--font-display); font-size:20px}
.empty p{margin:0 auto 18px; max-width:400px}

.scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:grid; place-items:center; padding:18px; z-index:50; animation:fadeIn .28s var(--ease-out)}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); width:min(560px,100%); max-height:90vh; overflow:auto; animation:scaleIn .35s var(--ease-out)}
.modal-hd{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:18px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1}
.modal-hd h2{margin:0; font-family:var(--font-display); font-size:19px; font-weight:700}
.modal-bd{padding:18px 20px; display:flex; flex-direction:column; gap:14px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.field input, .field textarea{padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:15px; width:100%}
.field input, .field textarea{transition:border-color .2s ease, box-shadow .25s ease, background .2s ease}
.field input:hover, .field textarea:hover{border-color:var(--border-strong)}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), 0 4px 12px rgba(0,0,0,.06); background:var(--surface)}
.field textarea{resize:vertical; min-height:52px}
.field .help{font-size:12px; color:var(--faint); font-weight:400; text-transform:none; letter-spacing:0}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.sub{font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px}
.cost-rows{display:flex; flex-direction:column; gap:8px}
.cost-row{display:grid; grid-template-columns:1fr 120px 32px; gap:8px; align-items:center}
.cost-row input, .cost-row .bod-select{padding:9px 10px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:14px; width:100%}
.cost-row .x{border:none; background:transparent; color:var(--faint); height:34px; border-radius:8px; font-size:16px}
.cost-row .x:hover{background:var(--bad-soft); color:var(--bad)}
.add-cost{align-self:flex-start; font-size:13px; color:var(--accent); background:none; border:none; font-weight:600; padding:4px 2px}
.modal-ft{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface); flex-wrap:wrap}
.modal-ft .left{margin-right:auto; display:flex; gap:8px}
.bod-row{padding:10px 0; border-bottom:1px solid var(--border)}
.bod-row:last-child{border-bottom:none}
.bod-row-line{display:flex; align-items:center; gap:8px}
.bod-row-line input{flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:14px; min-width:0}
.wa-ic{color:var(--good); font-size:15px; flex-shrink:0}

/* Botones de envío por bodega en el pedido */
.wa-sends{padding:10px 18px 0; display:flex; flex-direction:column; gap:6px}
.wa-btn{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 14px; border-radius:10px; border:1px solid #25D366;
  background:transparent; color:var(--ink); font-size:13.5px; font-weight:600;
  cursor:pointer; text-align:left; transition:.15s;
}
.wa-btn:hover{background:rgba(37,211,102,.08)}
.wa-btn .wa-lbl{display:flex; align-items:center; gap:8px; min-width:0}
.wa-btn .wa-lbl .icn{background:#25D366; color:#fff; width:24px; height:24px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0}
.wa-btn .wa-lbl .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa-btn .wa-info{font-size:12px; color:var(--muted); font-weight:500; flex-shrink:0}
.wa-btn.notel .icn{background:var(--warn)}
.wa-btn.notel{border-color:var(--warn); color:var(--warn)}

.list-row{display:flex; align-items:center; gap:8px; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-row input{flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink)}
.hint{font-size:12.5px; color:var(--faint)}
.callout{background:var(--accent-soft); color:var(--accent-ink); border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.45}
.callout.warn{background:var(--warn-soft); color:var(--warn)}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(30px) scale(.9); background:var(--ink); color:var(--ground); padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 20px 50px rgba(0,0,0,.35); opacity:0; transition:transform .45s var(--ease-spring), opacity .3s ease; z-index:60; display:flex; align-items:center; gap:8px; pointer-events:none; letter-spacing:.01em}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
.spin{width:13px; height:13px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin,.status.saving .led{animation:none} .toast{transition:none} }

/* Widget de meta mensual */
.rank-header,.rank-row{display:grid; grid-template-columns:36px 1fr 90px; gap:6px; align-items:center; padding:8px 10px}
.rank-admin .rank-header,.rank-admin .rank-row{grid-template-columns:36px 1fr 80px 90px}
.rank-header{border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:2px}
.rank-row{border-radius:10px; transition:background .15s}
.rank-row:nth-child(even){background:var(--surface-2)}
.rank-first{background:linear-gradient(135deg, rgba(255,215,0,.08), rgba(255,215,0,.02))!important; border:1px solid rgba(255,215,0,.2)}
.rank-pos{font-size:20px; text-align:center}
.rank-name{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank-sales{font-weight:700; font-size:15px; text-align:right; color:var(--accent)}
.rank-total{font-weight:600; font-size:13px; text-align:right; color:var(--muted)}
.rank-premio{margin-top:18px; padding-top:14px; border-top:1px solid var(--border)}
.rank-premio label{display:block; font-weight:600; font-size:13px; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.rank-premio input{padding:9px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:15px}
.rank-premio-banner{background:linear-gradient(135deg, rgba(255,215,0,.12), rgba(255,180,0,.06)); border:1px solid rgba(255,215,0,.25); border-radius:10px; padding:10px 14px; font-size:14px; text-align:center; margin-bottom:10px}
.meta-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px 16px; box-shadow:var(--shadow); margin-bottom:16px;
  display:flex; flex-direction:column; gap:8px;
}
.meta-hd{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.meta-hd .ttl{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:6px}
.meta-hd .pct{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-.02em}
.meta-hd .pct.done{color:var(--good)}
.meta-hd .pct.warn{color:var(--warn)}
.meta-bar{height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden; position:relative}
.meta-bar .fill{
  height:100%; border-radius:999px; transition:width .35s ease;
  background:linear-gradient(90deg, var(--accent), var(--good));
}
.meta-bar .fill.done{background:var(--good)}
.meta-bar .fill.warn{background:linear-gradient(90deg, var(--warn), var(--bad))}
.meta-ft{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.meta-ft b{color:var(--ink); font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:700}
.meta-ft .edit{color:var(--accent); font-weight:600; cursor:pointer; background:none; border:none; font-size:12.5px}
.meta-ft .edit:hover{text-decoration:underline}

/* Selector de sección */
.sect-wrap{max-width:1080px; margin:0 auto; padding:32px 24px}
.sect-hero{text-align:center; padding:32px 20px 40px}
.sect-hero h1{font-family:var(--font-display); font-size:clamp(28px,4.6vw,44px); font-weight:700; letter-spacing:-.02em; margin:0 0 8px; text-wrap:balance}
.sect-hero p{color:var(--muted); font-size:15px; margin:0}
.sect-totales{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:0 auto 24px; max-width:600px}
.sect-totales .st-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden}
.sect-totales .st-card::before{content:""; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--accent)}
.sect-totales .st-k{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:4px}
.sect-totales .st-v{font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:800; font-size:28px; color:var(--ink); line-height:1.1}
.sect-totales .st-sub{color:var(--muted); font-size:12.5px; margin-top:2px}
@media (max-width:640px){ .sect-totales{grid-template-columns:1fr 1fr; gap:8px} .sect-totales .st-v{font-size:22px} .sect-totales .st-card{padding:12px 14px} }
.sect-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:18px}
@media (max-width:820px){ .sect-grid{grid-template-columns:1fr; max-width:420px; margin-left:auto; margin-right:auto} }
.sect-card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:26px 22px; text-align:center; cursor:pointer;
  transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .25s ease;
  display:flex; flex-direction:column; align-items:center; gap:10px; position:relative; overflow:hidden;
  min-height:240px; justify-content:flex-end; box-shadow:var(--shadow);
  color:var(--ink); font-family:inherit;
}
.sect-card:hover:not(.disabled){transform:translateY(-5px) scale(1.015); border-color:var(--accent); box-shadow:0 18px 44px rgba(0,0,0,.20)}
.sect-card .ico{font-size:44px; line-height:1; margin-bottom:4px; position:relative; z-index:2}
.sect-card h3{font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-.01em; margin:0; color:var(--ink); position:relative; z-index:2}
.sect-card p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.45; max-width:220px; position:relative; z-index:2}
.sect-card .badge{position:relative; z-index:2}

/* Tarjetas con imagen de fondo */
.sect-card.has-bg{
  color:#fff; background-color:transparent;
  min-height:280px; padding:20px;
  background-size:cover; background-position:center;
}
.sect-card.has-bg::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(15,10,15,.15) 0%, rgba(15,10,15,.55) 55%, rgba(15,10,15,.85) 100%);
  z-index:1; transition:background .25s ease;
}
.sect-card.has-bg:hover:not(.disabled)::after{
  background:linear-gradient(180deg, rgba(15,10,15,.05) 0%, rgba(15,10,15,.45) 55%, rgba(15,10,15,.80) 100%);
}
.sect-card.has-bg h3{color:#fff; font-size:24px; letter-spacing:-.015em; text-shadow:0 2px 8px rgba(0,0,0,.4)}
.sect-card.has-bg p{color:rgba(255,255,255,.85); text-shadow:0 1px 4px rgba(0,0,0,.5)}
.sect-card.has-bg .ico{display:none}
.sect-card.has-bg .badge{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.sect-card.sect-maquillaje{
  background-image:url('https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=900&q=85&auto=format&fit=crop');
}
.sect-card.sect-calzado{
  background-image:url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900&q=85&auto=format&fit=crop');
}
.sect-card.sect-perfumeria{
  background-image:url('https://images.unsplash.com/photo-1541643600914-78b084683601?w=900&q=85&auto=format&fit=crop');
}
.sect-card.has-bg.disabled{opacity:1; filter:grayscale(.5) brightness(.7)}
.sect-card.has-bg.disabled .badge{background:rgba(0,0,0,.4); color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.15)}
.sect-card .rail{position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--accent), transparent)}
.sect-card .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin-top:4px}
.sect-card.admin-preview{cursor:pointer; opacity:.85; filter:grayscale(.35) brightness(.9)}
.sect-card.admin-preview:hover{opacity:1; filter:none; transform:translateY(-3px)}
.sect-card.admin-preview .badge{background:rgba(245,158,11,.25); color:#fbbf24; border:1px solid rgba(245,158,11,.45); font-weight:800}
.sect-card.disabled{opacity:.55; cursor:not-allowed; background-color:var(--surface-2)}
.sect-card.disabled .rail{background:linear-gradient(90deg, var(--faint), transparent)}
.sect-card.disabled .badge{background:var(--surface); color:var(--muted); border:1px solid var(--border)}
.sect-card{cursor:pointer}
.sect-admin{position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:3}
.sect-admin .mini{background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:5px 9px; font-size:14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.sect-admin .mini:hover{background:rgba(0,0,0,.8)}
.sect-admin .mini.del:hover{background:var(--bad); border-color:var(--bad)}
.sect-card.sect-add{min-height:280px; border:2px dashed var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px}
.sect-card.sect-add:hover{border-color:var(--accent); background:var(--accent-soft)}
.sect-card.sect-add .sect-add-ico{font-size:56px; color:var(--accent); font-weight:300; line-height:1; margin-bottom:8px}
.sect-card.sect-add h3{color:var(--ink); font-size:18px}
.sect-card.sect-add p{color:var(--muted); font-size:13px}
.img-placeholder{display:flex; align-items:center; justify-content:center; height:120px; background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; color:var(--muted); font-size:13px}
.img-dropzone{position:relative; min-height:140px; border:2px dashed var(--border); border-radius:12px; padding:8px; background:var(--surface-2); transition:all .18s ease; overflow:hidden}
.img-dropzone.drag-over{border-color:var(--accent); background:var(--accent-soft); transform:scale(1.01)}
.img-dropzone.drag-over::after{content:"Soltar aquí"; position:absolute; inset:8px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.08); border-radius:8px; font-weight:800; color:var(--accent); font-size:16px; pointer-events:none; z-index:10; letter-spacing:.03em}
.img-dropzone img{display:block; margin:0 auto; max-height:200px; object-fit:contain; border-radius:8px}
.img-dz-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 12px; min-height:120px}
.img-dz-empty .dz-ico{font-size:38px; opacity:.5; margin-bottom:6px}
.img-dz-empty .dz-hd{font-weight:700; color:var(--ink); font-size:14px}
.img-dz-empty .dz-sb{color:var(--muted); font-size:12px; margin-top:2px}
.pthumb{display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; flex-shrink:0}
.pthumb.has{background:#fff}
.pthumb img{width:100%; height:100%; object-fit:cover; display:block}
.pthumb .ph{font-size:20px; opacity:.45}
.prow.has-thumb{grid-template-columns:44px 1fr 90px 90px 44px 44px 40px; gap:10px; align-items:center}
.prow-t.has-thumb{grid-template-columns:44px 1fr 100px 100px 44px !important; gap:10px; align-items:center}
@media (max-width:640px){
  .prow.has-thumb{grid-template-columns:40px 1fr 70px 70px 40px 40px 34px; gap:8px}
  .prow-t.has-thumb{grid-template-columns:40px 1fr 80px 80px 40px !important; gap:8px}
  .pthumb{width:40px; height:40px}
}
.pimg-wrap{margin:8px 0 12px; text-align:center}
.pimg-big{max-width:100%; max-height:280px; border-radius:10px; border:1px solid var(--border); background:#fff; object-fit:contain}
.pimg-dl{display:block; margin:0 auto 12px; padding:8px 16px; font-size:13px}

/* ---- Vista tipo tienda (tarjetas) ---- */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; padding:14px}
.pcard{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:transform .28s var(--ease-out), box-shadow .28s var(--ease-out), border-color .2s ease; display:flex; flex-direction:column; position:relative}
.pcard:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 16px 40px rgba(0,0,0,.14)}
.pcard-img{position:relative; width:100%; aspect-ratio:1/1; background:linear-gradient(135deg, var(--surface-2) 0%, var(--surface) 100%); overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center}
.pcard-img img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .45s var(--ease-out), filter .3s ease}
.pcard:hover .pcard-img img{transform:scale(1.06)}
.pcard-img .pcard-ph{font-size:56px; opacity:.35}
.pcard-tools{position:absolute; top:8px; left:8px; display:flex; gap:6px; z-index:2}
.pcard-dl{background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:5px 10px; font-size:14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); font-weight:700}
.pcard-dl:hover{background:var(--accent); border-color:var(--accent)}
.pcard-more{position:absolute; top:8px; right:8px; z-index:2}
.pcard-more .mm{background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:5px 10px; font-size:16px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); line-height:1}
.pcard-more .mm:hover{background:rgba(0,0,0,.8)}
.pcard-more .menu{position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 20px rgba(0,0,0,.15); padding:4px; min-width:150px; display:none; z-index:5}
.pcard-more.open .menu{display:block}
.pcard-more .menu button{display:block; width:100%; text-align:left; background:none; border:none; padding:8px 12px; border-radius:6px; font-size:13.5px; color:var(--ink); cursor:pointer; font-family:inherit}
.pcard-more .menu button:hover{background:var(--surface-2)}
.pcard-more .menu button.del{color:var(--bad)}
.pcard-body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; flex:1}
.pcard-name{font-weight:700; line-height:1.3; font-size:15px; color:var(--ink); cursor:pointer; word-wrap:break-word; overflow-wrap:break-word; hyphens:auto}
.pcard-name small{display:block; font-weight:500; font-size:11px; color:var(--faint); margin-top:2px; letter-spacing:.03em}
.pcard-prices{display:flex; flex-direction:column; gap:4px; padding:8px 10px; background:var(--surface-2); border-radius:10px; font-size:13px}
.pcard-prices .pl{display:flex; align-items:baseline; justify-content:space-between; gap:6px; min-width:0}
.pcard-prices .pl .lb{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.pcard-prices .pl .v{font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); text-align:right; white-space:nowrap; flex-shrink:0}
.pcard-prices .pl small{font-size:10.5px; color:var(--faint); font-weight:600; margin-left:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.pcard-prices .pl-cost{color:var(--muted)}
.pcard-prices .pl-cost .v{color:var(--muted); font-weight:600}
.pcard-prices .pl-cost.none .v{color:var(--faint)}
.pcard-prices .pl-mayo .v{color:var(--accent)}
.pcard-prices .pl-venta .v{color:var(--ink); font-size:15px}
.pcard-prices .pl-mg .v{font-weight:700}
.pcard-prices .pl-mg.mg-good .v{color:var(--good)}
.pcard-prices .pl-mg.mg-mid .v{color:var(--warn)}
.pcard-prices .pl-mg.mg-low .v{color:var(--bad)}
.pcard-add{margin-top:auto; background:var(--accent); color:var(--accent-contrast); border:none; padding:11px 14px; border-radius:10px; font-weight:700; cursor:pointer; font-family:inherit; font-size:13.5px; letter-spacing:.02em; transition:transform .3s var(--ease-spring), box-shadow .3s ease, filter .2s ease; position:relative}
.pcard-add:hover{filter:brightness(1.1); transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.18)}
.pcard-add:active{transform:translateY(0) scale(.98); transition-duration:.08s}
.pcard-add.in{background:var(--good); color:var(--good-contrast); animation:bounceIn .35s var(--ease-spring)}
.pcard-badge{position:absolute; top:8px; left:8px; z-index:2; font-size:10.5px; font-weight:800; letter-spacing:.06em; padding:5px 10px; border-radius:8px; color:#fff; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pcard-badge.combo{background:linear-gradient(135deg, #c026d3, #7c3aed)}
.pcard-badge.extra{background:linear-gradient(135deg, #f59e0b, #ea580c)}
.pcard-tools{left:auto; right:52px; top:8px}
.pcard.is-combo{border-color:rgba(192,38,211,.35)}
.pcard.is-extra{border-color:rgba(245,158,11,.35)}
.combo-list-hd{margin-top:10px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.combo-list{margin-top:6px; display:flex; flex-direction:column; gap:6px}
.combo-item{display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--surface-2); border-radius:8px; font-size:12.5px}
.combo-item.missing{color:var(--muted); font-style:italic}
.combo-item .ci-thumb{width:28px; height:28px; border-radius:6px; overflow:hidden; background:#fff; border:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center}
.combo-item .ci-thumb img{width:100%; height:100%; object-fit:cover}
.combo-item .ci-thumb .ph{font-size:14px; opacity:.4}
.combo-item .ci-name{flex:1; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.combo-item .ci-qty{font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent); font-size:12px}
.tipo-picker{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
.tipo-opt{position:relative; padding:12px 10px; border:2px solid var(--border); border-radius:10px; cursor:pointer; text-align:center; transition:all .15s ease; background:var(--surface)}
.tipo-opt input{position:absolute; opacity:0; pointer-events:none}
.tipo-opt span{display:block; font-weight:700; font-size:13px; color:var(--ink)}
.tipo-opt small{display:block; font-size:11px; color:var(--muted); margin-top:2px; line-height:1.3}
.tipo-opt:hover{border-color:var(--accent)}
.tipo-opt.on{border-color:var(--accent); background:var(--accent-soft)}
@media (max-width:520px){.tipo-picker{grid-template-columns:1fr}}
.comp-row select{flex:1}

/* ---- Inventario / stock ---- */
.pcard-stock{position:absolute; bottom:8px; right:8px; z-index:2; font-size:11px; font-weight:800; letter-spacing:.04em; padding:4px 9px; border-radius:8px; color:#fff; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pcard-stock.stock-ok{background:rgba(22,163,74,.85)}
.pcard-stock.stock-low{background:rgba(234,88,12,.85)}
.pcard-stock.stock-out{background:rgba(220,38,38,.9); font-size:12px}
.sold-out-overlay{position:absolute; inset:0; background:rgba(0,0,0,.55); color:#fff; font-weight:900; font-size:22px; letter-spacing:.15em; display:flex; align-items:center; justify-content:center; z-index:3; text-shadow:0 2px 6px rgba(0,0,0,.6); pointer-events:none}
.pcard.is-out .pcard-img img{filter:grayscale(.7) brightness(.85)}
.pcard-stock-btn{background:var(--surface-2); color:var(--muted); border:1px solid var(--border); border-radius:10px; padding:7px 10px; font-weight:700; cursor:pointer; font-family:inherit; font-size:12.5px; transition:all .12s ease}
.pcard-stock-btn:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.pcard-add.sold-out{background:var(--surface-2); color:var(--muted); border:1px solid var(--border); cursor:not-allowed; font-weight:800; letter-spacing:.08em}
.stock-hd{display:flex; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:14px}
.stock-thumb{width:56px; height:56px; border-radius:10px; object-fit:cover; background:#fff; border:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center}
.stock-thumb.ph{font-size:26px; opacity:.4}
.stock-name{font-weight:700; font-size:15px; color:var(--ink); line-height:1.2}
.stock-marca{color:var(--muted); font-size:12px; margin-top:2px; text-transform:uppercase; letter-spacing:.05em; font-weight:600}
.stock-current{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:14px 16px; background:var(--surface-2); border-radius:12px; border:1px solid var(--border)}
.stock-current .lb{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.stock-current .v{font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:800; font-size:26px; color:var(--ink)}
.stock-current .v.out{color:var(--bad); font-size:18px; letter-spacing:.1em}
.stock-preview{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:12px 16px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; margin-top:14px}
.stock-preview .lb{color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.stock-preview .v{font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:800; font-size:22px}

/* ---- Modo selección ---- */
.pcard.sel-mode{cursor:pointer}
.pcard.sel-mode .pcard-img{cursor:pointer}
.pcard.selected{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), 0 6px 16px rgba(0,0,0,.08)}
.pcard.selected .pcard-img::before{content:""; position:absolute; inset:0; background:rgba(0,0,0,.10); z-index:1; pointer-events:none}
.pcard-check{position:absolute; top:8px; left:8px; z-index:5; width:30px; height:30px; cursor:pointer; user-select:none}
.pcard-check input{position:absolute; opacity:0; pointer-events:none}
.pcard-check span{display:block; width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.9); border:2px solid rgba(0,0,0,.35); transition:all .15s ease; position:relative; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.pcard-check input:checked + span{background:var(--accent); border-color:var(--accent)}
.pcard-check input:checked + span::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--accent-contrast); font-weight:900; font-size:18px}
.pcard.sel-mode .pcard-badge{left:46px}
.sel-bar{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:900; display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:10px 14px; box-shadow:0 12px 40px rgba(0,0,0,.20); max-width:calc(100% - 32px); flex-wrap:wrap}
.sel-bar .sel-count{font-weight:700; font-size:14px; color:var(--ink); padding:0 6px}
.sel-bar .sel-count b{font-family:var(--font); font-variant-numeric:tabular-nums; color:var(--accent); font-size:18px; margin-right:2px}
.btn.danger{background:var(--bad); color:#fff; border:none}
.btn.danger:hover{filter:brightness(1.1)}
.btn.danger:disabled{background:var(--surface-2); color:var(--muted); cursor:not-allowed; filter:none}
.btn.ghost.on{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent)}

/* ---- Modal eliminar marca ---- */
.del-marca-opt{display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; border:2px solid var(--border); border-radius:12px; background:var(--surface); cursor:pointer; text-align:left; margin-bottom:10px; transition:all .15s ease; font-family:inherit}
.del-marca-opt:hover{border-color:var(--accent); background:var(--accent-soft)}
.del-marca-opt.danger:hover{border-color:var(--bad); background:rgba(220,38,38,.08)}
.del-marca-opt .opt-ico{font-size:28px; flex-shrink:0}
.del-marca-opt .opt-title{font-weight:700; font-size:14.5px; color:var(--ink); line-height:1.2}
.del-marca-opt .opt-desc{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.4}
.del-marca-opt.danger .opt-title{color:var(--bad)}
.mv-row{position:relative}
.mv-row.sel{background:var(--accent-soft); border-color:var(--accent)}
.mv-check{display:flex; align-items:center; justify-content:center; width:26px; height:26px; cursor:pointer; user-select:none; flex-shrink:0}
.mv-check input{position:absolute; opacity:0; pointer-events:none}
.mv-check span{display:block; width:22px; height:22px; border-radius:6px; background:var(--surface); border:2px solid var(--border); position:relative; transition:all .12s ease}
.mv-check input:checked + span{background:var(--accent); border-color:var(--accent)}
.mv-check input:checked + span::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--accent-contrast); font-weight:900; font-size:15px; line-height:1}
.mv-bulk-bar{margin-top:14px; padding-top:14px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface); z-index:2}
.pcard .pexp{padding:0 14px 14px; max-height:0; overflow:hidden; transition:max-height .28s ease; opacity:0}
.pcard.expanded .pexp{max-height:1000px; opacity:1; padding-top:6px; border-top:1px solid var(--border); margin-top:0}
.pcard .pexp table{width:100%; font-size:12.5px; border-collapse:collapse; margin-top:8px}
.pcard .pexp table th{text-align:left; color:var(--muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--border)}
.pcard .pexp table th.r, .pcard .pexp table td.r{text-align:right}
.pcard .pexp table td{padding:5px 6px; border-bottom:1px solid var(--border)}
.pcard .pexp table td.best{color:var(--good); font-weight:700}
.pcard .pexp .note{margin-top:8px; padding:8px 10px; background:var(--surface-2); border-radius:8px; font-size:12.5px; color:var(--muted)}

/* ---- Variaciones ---- */
.var-gallery{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.var-thumb{position:relative; width:70px; text-align:center; cursor:pointer}
.var-thumb img{width:64px; height:64px; object-fit:cover; border-radius:10px; border:2px solid var(--border); transition:border-color .15s}
.var-thumb:hover img{border-color:var(--accent)}
.var-thumb .var-ph{width:64px; height:64px; border-radius:10px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:22px}
.var-thumb .var-nm{font-size:11px; font-weight:600; color:var(--muted); margin-top:3px; line-height:1.2; word-break:break-word; max-width:70px}
.var-thumb .var-price{font-size:11px; font-weight:800; color:var(--accent); font-family:var(--font); font-variant-numeric:tabular-nums; margin-top:1px}
.var-thumb .var-dl{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:5px; padding:2px 5px; font-size:10px; cursor:pointer; line-height:1; opacity:0; transition:opacity .15s}
.var-thumb:hover .var-dl{opacity:1}
.var-badge{display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); padding:2px 7px; border-radius:6px; margin-top:4px}
.pcard-badges{display:flex; gap:5px; flex-wrap:wrap; margin-top:2px}
.var-row{display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border)}
.var-row:last-child{border-bottom:none}
.var-row .var-mini-img{width:56px; height:56px; border-radius:8px; border:2px dashed var(--border); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--surface-2); transition:border-color .15s, background .15s, transform .15s; position:relative}
.var-row .var-mini-img:hover{border-color:var(--accent)}
.var-row .var-mini-img.drag-over{border-color:var(--accent); border-style:solid; background:var(--accent-soft); transform:scale(1.06)}
.var-row .var-mini-img.drag-over *{pointer-events:none}
.var-row .var-mini-img img{width:100%; height:100%; object-fit:cover}
.var-row .var-mini-img .ph{font-size:20px; opacity:.4}
.var-row .var-fields{flex:1; display:flex; flex-direction:column; gap:4px}
.var-row .var-fields input{padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:13px; width:100%}
.var-row .var-prices{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:2px}
.var-row .var-prices input{padding:6px 8px; font-size:12px; font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:600}
@media (max-width:640px){ .var-row .var-prices{grid-template-columns:1fr 1fr; gap:4px} }
/* Ocultar precios cuando la variación es solo visual (color, talla, tono) */
[data-role="var-rows"].no-prices .var-prices{display:none}
.var-row .var-rm{background:none; border:none; color:var(--bad); cursor:pointer; font-size:16px; padding:4px 8px; border-radius:6px; flex-shrink:0}
.var-row .var-rm:hover{background:var(--bad-soft)}
.tipo-var-picker{display:flex; gap:6px; flex-wrap:wrap}
.tipo-var-chip{padding:6px 12px; border-radius:20px; border:2px solid var(--border); background:var(--surface); cursor:pointer; font-size:13px; font-weight:600; transition:all .12s; font-family:inherit; color:var(--ink)}
.tipo-var-chip:hover{border-color:var(--accent)}
.tipo-var-chip.on{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent)}

/* ---- Videos ---- */
.vid-list{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.vid-item{display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px}
.vid-item .vid-ico{font-size:24px; flex-shrink:0}
.vid-item .vid-name{flex:1; font-size:13px; font-weight:600; color:var(--ink); word-break:break-word}
.vid-item .vid-size{font-size:11px; color:var(--faint); font-family:var(--font); font-variant-numeric:tabular-nums}
.vid-item .vid-dl{background:var(--accent); color:var(--accent-contrast); border:none; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit}
.vid-item .vid-dl:hover{filter:brightness(1.08)}
.vid-item .vid-rm{background:none; border:none; color:var(--bad); cursor:pointer; font-size:15px; padding:4px 6px; border-radius:6px}
.vid-item .vid-rm:hover{background:var(--bad-soft)}
.vid-row-edit{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border)}
.vid-row-edit:last-child{border-bottom:none}
.vid-row-edit .vid-info{flex:1; display:flex; flex-direction:column; gap:2px}
.vid-row-edit .vid-info .vid-fname{font-size:13px; font-weight:600; color:var(--ink)}
.vid-row-edit .vid-info .vid-fsize{font-size:11px; color:var(--faint)}
.vid-preview{width:100%; max-height:180px; border-radius:10px; border:1px solid var(--border); background:#000; margin-top:6px}
.vid-dropzone{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:20px 12px; border:2px dashed var(--border); border-radius:12px; background:var(--surface-2); cursor:pointer; transition:all .18s ease; text-align:center; margin-top:6px}
.vid-dropzone:hover{border-color:var(--accent); background:var(--accent-soft)}
.codelink{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:10px; background:var(--surface-2); font-size:12.5px; color:var(--muted)}
.codelink b{color:var(--ink); word-break:break-all}
.codelink .btn{padding:6px 10px; font-size:12px; flex-shrink:0}
.gal-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.gal-th{position:relative; width:68px; height:68px; border-radius:10px; overflow:hidden; background:var(--surface-2)}
.gal-th img{width:100%; height:100%; object-fit:cover; display:block}
.gal-th button{position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:1; cursor:pointer}
.vid-dropzone.drag-over{border-color:var(--accent); border-style:solid; background:var(--accent-soft); transform:scale(1.01)}
.vid-dropzone .vid-dz-ico{font-size:32px; opacity:.55}
.vid-dropzone .vid-dz-hd{font-weight:700; color:var(--ink); font-size:14px}
.vid-dropzone .vid-dz-sb{color:var(--muted); font-size:12px}

/* Variation picker modal */
.var-picker-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; margin-top:8px}
.vp-card{background:var(--surface); border:2px solid var(--border); border-radius:12px; padding:8px; cursor:pointer; font-family:inherit; transition:transform .3s var(--ease-out), border-color .2s ease, background .2s ease, box-shadow .3s ease; display:flex; flex-direction:column; align-items:center; gap:6px}
.vp-card:hover{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-3px) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,.12)}
.vp-card:active{transform:translateY(-1px) scale(1); transition-duration:.08s}
.vp-card.selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft), 0 8px 20px rgba(0,0,0,.14)}
.vp-card.selected::after{content:"✓"; position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.2); z-index:2}
.vp-card{position:relative}
.vp-section + .vp-section{margin-top:16px}
.vp-section-hd{font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px}
.vp-card .vp-img{width:100%; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--surface-2); display:flex; align-items:center; justify-content:center}
.vp-card .vp-img img{width:100%; height:100%; object-fit:cover}
.vp-card .vp-img .vp-ph{font-size:32px; opacity:.4}
.vp-card .vp-nm{font-size:13px; font-weight:700; color:var(--ink); text-align:center; word-break:break-word; line-height:1.25}
.vp-card .vp-price{font-family:var(--font); font-variant-numeric:tabular-nums; font-size:13px; font-weight:800; color:var(--accent); text-align:center}
.vp-card .vp-mayo{font-size:10.5px; font-weight:600; color:var(--muted); text-align:center; margin-top:-3px}
.line .var-tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent-ink)}
.line .var-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:3px}

@media (max-width:640px){
  .pgrid{grid-template-columns:repeat(2, 1fr); gap:10px; padding:10px}
  .pcard-body{padding:10px 10px 12px; gap:7px}
  .pcard-name{font-size:12.5px; line-height:1.25}
  .pcard-prices{font-size:11.5px; padding:6px 8px; gap:3px}
  .pcard-prices .pl{gap:4px}
  .pcard-prices .pl .lb{font-size:9.5px; letter-spacing:.02em}
  .pcard-prices .pl .v{font-size:11.5px}
  .pcard-prices .pl-venta .v{font-size:13px}
  .pcard-prices .pl small{display:none}
  .pcard-add{padding:8px 8px; font-size:12px}
  .pcard-stock-btn{padding:6px 8px; font-size:11.5px}
}
.sect-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.sect-topbar .link{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:4px 8px; border-radius:6px; font-family:inherit}
.sect-topbar .link:hover{color:var(--ink); background:var(--surface-2)}

/* Enlace "cambiar sección" en el brand */
.change-sect{background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; padding:2px 8px; border-radius:6px; margin-left:6px; font-family:inherit; letter-spacing:.03em}
.change-sect:hover{color:var(--accent); background:var(--accent-soft)}

/* Tutorial / Onboarding */
.tut-overlay{
  position:fixed; inset:0; z-index:90; pointer-events:auto;
  background:rgba(10,15,12,.72);
  animation:fadeIn .2s ease both;
}
/* El halo crea el "spotlight" — su box-shadow gigante oscurece TODO menos el hueco */
.tut-halo{
  position:fixed; border-radius:14px; pointer-events:none;
  z-index:92;
  box-shadow:
    0 0 0 3px var(--accent),
    0 0 32px 4px rgba(0,0,0,.35),
    0 0 0 9999px rgba(10,15,12,.72);
  transition:top .35s cubic-bezier(.4,0,.2,1), left .35s cubic-bezier(.4,0,.2,1),
             width .35s cubic-bezier(.4,0,.2,1), height .35s cubic-bezier(.4,0,.2,1);
  animation:haloPulse 1.8s ease-in-out infinite;
}
@keyframes haloPulse{
  0%,100%{box-shadow:0 0 0 3px var(--accent), 0 0 32px 4px rgba(0,0,0,.35), 0 0 0 9999px rgba(10,15,12,.72)}
  50%{box-shadow:0 0 0 3px var(--accent), 0 0 48px 8px rgba(0,0,0,.55), 0 0 0 9999px rgba(10,15,12,.72)}
}
.tut-card{
  position:fixed; z-index:100; pointer-events:auto;
  background:var(--surface); border:1px solid var(--accent); border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.25);
  padding:16px 18px; max-width:340px; width:calc(100vw - 32px);
  animation:fadeUp .28s ease both;
}
.tut-card .step{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center}
.tut-card .step .skip{background:none; border:none; color:var(--faint); font-size:12px; cursor:pointer; padding:2px 6px; text-transform:none; letter-spacing:0}
.tut-card .step .skip:hover{color:var(--ink)}
.tut-card h3{margin:0 0 6px; font-size:16px; font-weight:700; color:var(--ink); line-height:1.3}
.tut-card p{margin:0 0 14px; font-size:13.5px; color:var(--muted); line-height:1.5}
.tut-card .nav{display:flex; gap:8px; justify-content:space-between; align-items:center}
.tut-card .nav .dots{display:flex; gap:4px}
.tut-card .nav .dot{width:6px; height:6px; border-radius:50%; background:var(--border-strong); transition:.2s}
.tut-card .nav .dot.on{background:var(--accent); width:16px; border-radius:3px}
.tut-card .nav .btns{display:flex; gap:6px}
.tut-card .nav .btns button{padding:7px 13px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit}
.tut-card .nav .btns button:hover{border-color:var(--border-strong)}
.tut-card .nav .btns .next{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast)}
.tut-card .nav .btns .next:hover{filter:brightness(1.06)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Banner de perfil incompleto */
.perfil-alert{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);
  border-radius:12px; padding:12px 16px; margin-bottom:14px; cursor:pointer;
  font-size:13.5px; line-height:1.35; transition:.15s;
}
.perfil-alert:hover{filter:brightness(1.02)}

/* Vista trabajador — oculta datos de negocio */
body.role-trabajador .pg-hdr .avg,
body.role-trabajador .pexp{display:none !important}
.prow-t{grid-template-columns: 1fr 100px 100px 44px !important; gap:10px}
.pv-t{
  text-align:right; font-family:var(--font); font-variant-numeric:tabular-nums;
  font-weight:700; font-size:13.5px; line-height:1.1;
}
.pv-t .lb{
  display:block; font-size:10px; color:var(--faint); font-weight:600; text-transform:uppercase;
  letter-spacing:.03em; margin-bottom:2px; font-family:var(--font-display);
}
.pv-t.vv{color:var(--accent)}
@media (max-width:640px){
  .prow-t{grid-template-columns:1fr 78px 78px 40px !important; gap:6px; padding:9px 10px}
  .pv-t{font-size:12.5px}
}

/* Password con ojo mostrar/ocultar */
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px !important}
.pwd-eye{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:transparent; border:none; cursor:pointer; padding:6px 8px;
  border-radius:6px; font-size:16px; opacity:.65; transition:opacity .15s, background .15s;
  color:var(--ink); line-height:1;
}
.pwd-eye:hover{opacity:1; background:var(--surface-2)}
.pwd-eye.on{opacity:1; color:var(--accent)}

/* Login y panel de usuarios */
.bl-logo{display:inline-flex;align-items:baseline;font:800 26px/1 "Sora",var(--font);letter-spacing:-.04em;color:var(--brand-ink,var(--ink));white-space:nowrap}
.bl-logo i{display:inline-block;width:.15em;border-radius:.03em;margin:0 .035em 0 .045em;background:var(--brand)}
.bl-logo i:nth-of-type(1){height:.52em}.bl-logo i:nth-of-type(2){height:.74em}
.bl-head{display:flex;justify-content:center;margin:0 0 22px}
.bl-head .bl-logo{font-size:40px}
.bl-mini{display:flex;margin:0 0 6px}.bl-mini .bl-logo{font-size:17px;opacity:.9}
.bl-foot{display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--faint)}
.login-wrap{max-width:400px; margin:8vh auto 0; padding:0 18px}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); padding:28px 26px; animation:scaleIn .5s var(--ease-out)}
.login-card h1{font-family:var(--font-display); font-size:24px; margin:0 0 4px; letter-spacing:-.02em}
.login-card .lead{color:var(--muted); margin:0 0 20px; font-size:14px}
.who-chip{display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:600}
.who-chip .avat{width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800}
.who-chip.admin .avat{background:var(--warn)}
.who-chip .role{color:var(--faint); font-weight:500}
.user-row{display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface-2)}
.user-row .nm{font-weight:700}
.user-row .rl{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
.user-row .rl.a{color:var(--warn)}
.user-row .acts{display:flex; gap:4px}
.av{display:inline-flex; align-items:center; justify-content:center; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--accent); color:#fff; font-weight:800; vertical-align:middle; object-fit:cover}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.user-row .nmrow{display:flex; align-items:center; gap:10px}
.av-edit{display:flex; align-items:center; gap:16px; margin-bottom:18px}
.av-edit .btns{display:flex; flex-direction:column; gap:8px}
.user-row .acts button{background:transparent; border:none; color:var(--muted); padding:6px 8px; border-radius:6px; font-size:12.5px; cursor:pointer}
.user-row .acts button:hover{background:var(--border); color:var(--ink)}
.user-row .acts button.del:hover{background:var(--bad-soft); color:var(--bad)}
.tabsrow{display:flex; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-bottom:12px}
.tabsrow button{flex:1; padding:8px 12px; background:transparent; border:none; color:var(--muted); font-weight:600; border-radius:8px; font-size:13px; cursor:pointer}
.tabsrow button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* Pantalla de conexión inicial */
.setup{max-width:560px; margin:6vh auto 0; padding:0 18px}
.setup .card2{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); padding:28px}
.setup h1{font-family:var(--font-display); font-size:26px; margin:0 0 4px; letter-spacing:-.02em}
.setup .lead{color:var(--muted); margin:0 0 20px}
.setup .steps{font-size:13.5px; color:var(--muted); margin:16px 0 0; padding-left:18px; line-height:1.6}

/* Lista compacta agrupada por marca */
.plist{display:flex; flex-direction:column; gap:14px}
.pgroup{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.pg-hdr{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  cursor:pointer; user-select:none; background:var(--surface-2);
  border-bottom:1px solid var(--border); transition:.15s;
}
.pg-hdr:hover{background:var(--border)}
.pg-hdr .chev{color:var(--muted); font-size:11px; transition:transform .2s; flex-shrink:0; width:14px; text-align:center}
.pgroup.collapsed .pg-hdr{border-bottom-color:transparent}
.pgroup.collapsed .pg-hdr .chev{transform:rotate(-90deg)}
.pgroup.collapsed .pg-body,
.pgroup.collapsed .pgrid{display:none}
.pg-hdr .name{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:-.01em; flex:1; min-width:0; text-transform:uppercase}
.pg-hdr .count{color:var(--muted); font-size:12px; font-weight:600; background:var(--surface); border:1px solid var(--border); padding:2px 8px; border-radius:999px; flex-shrink:0}
.pg-hdr .avg{color:var(--muted); font-size:12px; font-weight:600; flex-shrink:0}
.brand-tag-hidden{
  color:var(--warn); font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; padding:2px 8px; border-radius:6px;
  background:var(--warn-soft); border:1px solid var(--warn); flex-shrink:0;
}
.pg-admin{display:flex; gap:6px; margin-left:8px; flex-shrink:0}
.pg-admin .mini{background:var(--surface-2); color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:13px; cursor:pointer; transition:all .12s ease; line-height:1}
.pg-admin .mini:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.pg-admin .mini.del:hover{background:var(--bad); color:#fff; border-color:var(--bad)}
.brand-add-btn{width:100%; justify-content:center; margin-bottom:12px; border:2px dashed var(--border); background:transparent; padding:14px; font-weight:700; color:var(--muted); border-radius:12px; font-size:14px}
.brand-add-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
@media (max-width:640px){ .pg-admin .mini{padding:4px 7px; font-size:12px} }
.pgroup.hidden-brand{opacity:.7}
.pgroup.hidden-brand .pg-hdr{background:repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 8px, transparent 8px, transparent 16px)}
.brand-footer-note{
  margin-top:6px; padding:14px 18px; text-align:center;
  background:var(--surface); border:1px dashed var(--border-strong); border-radius:14px;
  color:var(--muted); font-size:13.5px; line-height:1.5;
}
.brand-footer-note b{color:var(--ink)}

/* Modal Marcas visibles */
.mv-list{display:flex; flex-direction:column; gap:6px; max-height:400px; overflow:auto; margin:6px 0}
.mv-row{
  display:flex; align-items:center; gap:12px; padding:10px 14px;
  border:1px solid var(--border); border-radius:10px; background:var(--surface-2);
  transition:.15s;
}
.mv-row:hover{border-color:var(--border-strong)}
.mv-row.off{opacity:.6}
.mv-row .name{flex:1; font-weight:600}
.mv-row .info{color:var(--muted); font-size:12px}
.mv-row .toggle{
  position:relative; width:40px; height:22px; border-radius:999px;
  background:var(--border-strong); border:none; cursor:pointer; padding:0; flex-shrink:0;
  transition:background .2s ease;
}
.mv-row .toggle::after{
  content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;
  border-radius:50%; background:#fff; transition:left .2s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.mv-row.on .toggle{background:var(--good)}
.mv-row.on .toggle::after{left:20px}

.prow{
  display:grid; grid-template-columns: 1fr 90px 90px 44px 44px 40px;
  align-items:center; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--border); font-size:14px;
  cursor:pointer; transition:background .12s;
}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--surface-2)}
.prow .pn{font-weight:600; line-height:1.25; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .pn small{display:block; font-weight:500; font-size:11.5px; color:var(--faint); margin-top:1px; letter-spacing:.02em}
.prow .pv{text-align:right; font-family:var(--font); font-variant-numeric:tabular-nums; font-weight:700}
.prow .pc{text-align:right; font-family:var(--font); font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600}
.prow .pc .bod{display:block; font-size:11px; color:var(--faint); font-weight:500; text-transform:uppercase; letter-spacing:.03em; margin-top:1px}
.prow .pc.none{color:var(--faint); font-style:italic; font-family:inherit; font-weight:500}
.prow .pm{text-align:right; font-weight:700; font-family:var(--font); font-variant-numeric:tabular-nums; font-size:13.5px}
.prow .pm.good{color:var(--good)} .prow .pm.warn{color:var(--warn)} .prow .pm.bad{color:var(--bad)}
.prow .padd{
  border:1px solid var(--accent); background:transparent; color:var(--accent);
  height:30px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; transition:.12s;
}
.prow .padd:hover{background:var(--accent); color:var(--accent-contrast)}
.prow .padd.in{background:var(--accent); color:var(--accent-contrast)}
.prow .pact{position:relative}
.prow .pact .mm{border:none; background:transparent; color:var(--faint); width:30px; height:30px; border-radius:8px; font-size:14px; cursor:pointer}
.prow .pact .mm:hover{background:var(--border); color:var(--ink)}
.prow .pact .menu{position:absolute; right:0; top:36px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); z-index:10; min-width:130px; padding:4px; display:none}
.prow .pact.open .menu{display:block}
.prow .pact .menu button{display:block; width:100%; text-align:left; padding:8px 10px; background:transparent; border:none; color:var(--ink); font-size:13px; border-radius:6px; cursor:pointer}
.prow .pact .menu button:hover{background:var(--surface-2)}
.prow .pact .menu button.del{color:var(--bad)}
.prow .pact .menu button.del:hover{background:var(--bad-soft)}

.pexp{padding:0 14px 12px; background:var(--surface-2); border-bottom:1px solid var(--border); display:none}
.prow.expanded + .pexp{display:block; animation:expandIn .18s ease}
@keyframes expandIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.pexp table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px}
.pexp th{text-align:left; text-transform:uppercase; letter-spacing:.03em; color:var(--faint); font-size:10.5px; font-weight:600; padding:4px 8px; border-bottom:1px solid var(--border)}
.pexp th.r, .pexp td.r{text-align:right}
.pexp td{padding:5px 8px; border-bottom:1px solid var(--border)}
.pexp td.best{color:var(--accent); font-weight:700}
.pexp .note{color:var(--muted); font-size:12px; margin-top:8px; padding:6px 8px; border-radius:6px; background:var(--surface); border:1px solid var(--border)}

@media (max-width:640px){
  .prow{grid-template-columns: 1fr 76px 44px 40px; gap:6px; padding:9px 10px; font-size:13.5px}
  .prow .pc, .prow .pact{display:none}
  .pg-hdr{padding:11px 12px}
  .pg-hdr .avg{display:none}
  .pexp{padding:0 10px 10px}
}

/* Carrito flotante */
/* Sidebar menu */
.sidebar-scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s ease;pointer-events:none}
.sidebar-scrim.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,82vw);z-index:101;background:var(--surface);box-shadow:6px 0 30px rgba(0,0,0,.3);transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sidebar-scrim.open .sidebar{transform:translateX(0)}
.sidebar-hd{padding:20px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sidebar-hd h2{font-size:17px;margin:0;font-weight:700}
.sidebar-hd .close-sb{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px}
.sidebar-hd .close-sb:hover{background:var(--surface-2)}
.sidebar-group{padding:10px 14px 6px}
.sidebar-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:6px 6px 4px;margin:0}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s}
.sidebar-item:hover,.sidebar-item:active{background:var(--surface-2)}
.sidebar-item .sb-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-item .sb-badge{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.sidebar-item.danger{color:var(--bad)}
.sidebar-sep{height:1px;background:var(--border);margin:4px 14px}
.hamburger{background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer;padding:6px 10px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.hamburger:hover{background:var(--surface-2)}
.fab-cart{
  position:fixed; right:22px; bottom:22px; z-index:40;
  background:var(--accent); color:var(--accent-contrast); border:none; border-radius:999px;
  padding:14px 18px 14px 16px; font-size:15px; font-weight:700;
  box-shadow:0 12px 32px rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.15);
  display:inline-flex; align-items:center; gap:10px;
  cursor:pointer; transition:transform .3s var(--ease-spring), box-shadow .3s ease;
}
.fab-cart::before{
  content:""; position:absolute; inset:-3px; border-radius:999px;
  background:linear-gradient(135deg, var(--accent) 0%, transparent 70%);
  opacity:0; transition:opacity .3s ease; z-index:-1; filter:blur(12px);
}
.fab-cart:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 20px 40px rgba(0,0,0,.32), 0 6px 12px rgba(0,0,0,.18)}
.fab-cart:hover::before{opacity:.55}
.fab-cart:active{transform:translateY(-1px) scale(1)}
.fab-cart .badge{
  background:var(--accent-contrast); color:var(--accent); border-radius:999px; min-width:22px; height:22px;
  padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:800;
  animation:softPulse 2.4s ease-in-out infinite;
}
.fab-cart .totmini{opacity:.9; font-weight:600; font-size:13px; padding-left:6px; border-left:1px solid rgba(255,255,255,.35); margin-left:2px}

/* Panel de pedido (deslizante) */
.side-scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  z-index:55; opacity:0; animation:fadeIn .32s var(--ease-out) forwards;
}
.side-panel{
  position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); z-index:56;
  background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; transform:translateX(100%); animation:slideIn .42s var(--ease-out) forwards;
}
@keyframes slideIn{to{transform:translateX(0)}}
.side-hd{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:16px 18px; border-bottom:1px solid var(--border);
}
.side-hd h2{margin:0; font-family:var(--font-display); font-size:19px; font-weight:700}
.side-hd .n{color:var(--muted); font-size:13px; font-weight:600}
.side-cli{padding:14px 18px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.side-cli input{padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:14px; width:100%}
.side-bd{flex:1; overflow:auto; padding:14px 18px 8px}
.line{
  display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:11px 0;
  border-bottom:1px solid var(--border);
}
.line:last-child{border-bottom:none}
.line .nm{font-weight:600; font-size:14px; line-height:1.3}
.line .bd-row{display:flex; align-items:center; gap:8px; grid-column:1/-1; margin-top:4px; flex-wrap:wrap}
.line .bd-row select{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:12.5px}
.line .bd-row .info{font-size:12.5px; color:var(--muted)}
.line .qty{display:inline-flex; align-items:center; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px}
.line .qty button{border:none; background:transparent; color:var(--ink); width:26px; height:26px; border-radius:6px; font-size:15px; font-weight:700}
.line .qty button:hover{background:var(--border)}
.line .qty span{min-width:26px; text-align:center; font-weight:700; font-family:var(--font); font-variant-numeric:tabular-nums}
.line .sub{font-weight:700; font-family:var(--font); font-variant-numeric:tabular-nums; font-size:14px; text-align:right}
.line .rmv{border:none; background:transparent; color:var(--faint); padding:2px 6px; border-radius:6px; font-size:13px}
.line .rmv:hover{color:var(--bad); background:var(--bad-soft)}
.side-empty{padding:44px 20px; text-align:center; color:var(--muted)}
.side-empty .em{font-size:36px; margin-bottom:8px}
.side-tot{padding:14px 18px; border-top:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; gap:6px}
.side-tot .r{display:flex; justify-content:space-between; font-size:13.5px}
.side-tot .r b{font-family:var(--font); font-variant-numeric:tabular-nums}
.side-tot .gain{font-size:16px; font-weight:700; padding-top:6px; border-top:1px dashed var(--border-strong)}
.side-tot .gain .val{font-family:var(--font-display)}
.side-ft{padding:14px 18px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
.side-ft .btn{flex:1; justify-content:center; min-width:120px}
.mini-add{
  border:1px solid var(--accent); background:transparent; color:var(--accent);
  padding:6px 10px; border-radius:8px; font-size:12px; font-weight:700;
  display:inline-flex; align-items:center; gap:4px; transition:.15s;
}
.mini-add:hover{background:var(--accent); color:var(--accent-contrast)}
.mini-add.in{background:var(--accent); color:var(--accent-contrast)}
.mini-add.in::before{content:"✓ "}

/* Chips de estado (etapas del pedido/venta) */
.estado-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px}
.est-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:4px 9px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--muted); cursor:default; transition:.15s;
  text-transform:uppercase; letter-spacing:.02em;
}
.est-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex-shrink:0}
.est-chip.done{background:var(--good-soft); color:var(--good); border-color:var(--good)}
.est-chip.done .dot{background:var(--good)}
.est-chip.pending{background:var(--surface); color:var(--faint)}
.est-chip.action{background:var(--warn-soft); color:var(--warn); border-color:var(--warn); cursor:pointer}
.est-chip.action:hover{filter:brightness(1.05)}
.est-chip.action .dot{background:var(--warn); animation:pulse 1.4s ease-in-out infinite}
.est-arrow{color:var(--faint); font-size:12px; padding:0 1px}

/* Estado en detalle: timeline compacto con fechas */
.est-timeline{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px}
.est-timeline .row{display:flex; align-items:center; gap:10px; padding:5px 0}
.est-timeline .row.done .icon{background:var(--good); color:var(--good-contrast)}
.est-timeline .row.pending .icon{background:var(--surface); color:var(--faint); border:1px dashed var(--border-strong)}
.est-timeline .icon{width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0}
.est-timeline .label{flex:1; color:var(--muted)}
.est-timeline .row.done .label{color:var(--ink); font-weight:600}
.est-timeline .when{color:var(--faint); font-size:12px}
.est-timeline .act{margin-left:auto}
.est-timeline .act button{background:var(--warn); color:#fff; border:none; padding:5px 10px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer}
.est-timeline .act button:hover{filter:brightness(1.08)}

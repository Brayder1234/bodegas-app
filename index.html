<body>
<div id="app"></div>
<div id="modal-host"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-import" accept="application/json,.json" style="display:none">

<script>
(function(){
  "use strict";

  var CFG_KEY='bm-supabase', THEME_KEY='bm-theme', CACHE_KEY='bm-cache', ROW_ID='main', SESSION_KEY='bm-session', SECTION_KEY='bm-section';
  // Configuración fija de VELORA — así los trabajadores no tienen que pegar nada al entrar
  var DEFAULT_CFG={
    url:'https://ubiingxrbjpiqlgqrewe.supabase.co',
    key:'sb_publishable_GO5vsVIFg2OEko1YuoUVSg__OKzxm4h'
  };
  var state={moneda:'COP', bodegas:[], bodegaTels:{}, productos:[], pedido:{items:[],cliente:{nombre:'',tel:''}}, pedidos:[], usuarios:[], carritos:{}, notifEmail:{enabled:true, accessKey:'', destinatario:'', extras:[]}, metaMensual:600000, secciones:[], marcas:[]};
  var session=null; // {usuarioId, usuarioNombre, role}
  var cfg=null;              // {url,key}
  var GROUPS_KEY='bm-collapsed';
  var ui={q:'', sort:'marca', expanded:{}, collapsed:{}, selectMode:false, selected:{}};
  try{ var _c=JSON.parse(localStorage.getItem(GROUPS_KEY)); if(_c && typeof _c==='object') ui.collapsed=_c; }catch(e){}
  var conn='off';            // off | connecting | ok | saving | err
  var lastServerStamp=null;  // updated_at conocido del servidor
  var dirty=false, saveTimer=null, pollTimer=null;
  var bootstrapping=false;   // esperando el primer pull del servidor

  /* tema */
  try{ var t=localStorage.getItem(THEME_KEY); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
  // Sección activa (se elige después del login)
  var activeSection=null;
  try{ activeSection=localStorage.getItem(SECTION_KEY) || null; }catch(e){}
  function setActiveSection(s){
    activeSection=s;
    try{ if(s) localStorage.setItem(SECTION_KEY, s); else localStorage.removeItem(SECTION_KEY); }catch(e){}
  }

  /* ---------- utils ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function fmt(n){ if(n==null||isNaN(n)) return '—';
    if(state.moneda==='USD') return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
    return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
  function pct(n){ return (n>=0?'':'−')+Math.abs(Math.round(n))+'%'; }
  function validCostos(p){ return (p.costos||[]).filter(function(c){ return c.bodega && typeof c.costo==='number' && c.costo>0; }); }
  function best(p){ var v=validCostos(p); if(!v.length) return null; return v.reduce(function(a,b){ return b.costo<a.costo?b:a; }); }
  function comboCostoTotal(p){
    if(!p || p.tipo!=='combo' || !Array.isArray(p.componentes)) return null;
    var total=0, any=false;
    for(var i=0;i<p.componentes.length;i++){
      var c=p.componentes[i];
      var prod=(state.productos||[]).find(function(x){return x.id===c.productoId;});
      if(!prod) continue;
      var b=best(prod);
      if(!b) continue;
      var q=parseFloat(c.cantidad)||1;
      total += b.costo * q; any=true;
    }
    return any ? total : null;
  }
  function bestCostoDe(p){
    if(p && p.tipo==='combo'){ var t=comboCostoTotal(p); return t!=null ? {costo:t, bodega:'combo'} : null; }
    return best(p);
  }
  function marginPct(precio,costo){ if(!precio||precio<=0) return null; return (precio-costo)/precio*100; }
  function mgClass(m){ if(m==null) return ''; if(m>=40) return 'good'; if(m>=20) return 'warn'; return 'bad'; }
  function normUrl(u){ u=(u||'').trim().replace(/\/+$/,''); return u; }
  function autoUrl(){ try{ var o=location.origin; return /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(o)?o:''; }catch(e){ return ''; } }

  /* ---------- config ---------- */
  function loadCfg(){
    try{ var c=JSON.parse(localStorage.getItem(CFG_KEY)); if(c&&c.url&&c.key) return c; }catch(e){}
    // Sin config guardada → usar la default y guardarla automáticamente
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(DEFAULT_CFG)); }catch(e){}
    return DEFAULT_CFG;
  }
  function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }
  function cacheState(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }
  function loadCache(){ try{ var s=JSON.parse(localStorage.getItem(CACHE_KEY)); if(s&&s.productos) return s; }catch(e){} return null; }

  /* ---------- Supabase REST ---------- */
  function authFor(key){ var h={apikey:key}; if(/^eyJ/.test(key)) h.Authorization='Bearer '+key; return h; }
  function headers(){ return Object.assign({'Content-Type':'application/json'}, authFor(cfg.key)); }
  async function sbGet(){
    var r=await fetch(cfg.url+'/rest/v1/bodegas_data?id=eq.'+ROW_ID+'&select=data,updated_at',{headers:headers()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var rows=await r.json();
    return rows&&rows[0]?rows[0]:null;
  }
  async function sbSave(){
    var body={data:state, updated_at:new Date().toISOString()};
    var r=await fetch(cfg.url+'/rest/v1/bodegas_data?id=eq.'+ROW_ID,{method:'PATCH',headers:Object.assign({Prefer:'return=representation'},headers()),body:JSON.stringify(body)});
    if(r.status===404 || r.status===406){ throw new Error('no-row'); }
    if(!r.ok) throw new Error('HTTP '+r.status);
    var rows=await r.json();
    var row=rows&&rows[0];
    if(row) lastServerStamp=row.updated_at;
    if(!row){ // fila no existía: crearla
      var r2=await fetch(cfg.url+'/rest/v1/bodegas_data',{method:'POST',headers:Object.assign({Prefer:'resolution=merge-duplicates,return=representation'},headers()),body:JSON.stringify([{id:ROW_ID,data:state,updated_at:body.updated_at}])});
      if(!r2.ok) throw new Error('HTTP '+r2.status);
      var rr=await r2.json(); if(rr&&rr[0]) lastServerStamp=rr[0].updated_at;
    }
  }

  async function pullFromServer(applyIfNewer){
    try{
      var row=await sbGet();
      if(!row){ await sbSave(); return true; } // fila vacía -> siembra
      if(applyIfNewer && row.updated_at===lastServerStamp && !dirty) return false; // sin cambios
      if(!dirty){
        state=sanitize(row.data);
        lastServerStamp=row.updated_at;
        cacheState();
        return true;
      }
      return false;
    }catch(e){ throw e; }
  }
  function sanitize(d){
    d=d||{};
    var pedido=(d.pedido&&typeof d.pedido==='object')?d.pedido:{items:[],cliente:{nombre:'',tel:'',direccion:'',ciudad:'',notas:''}};
    if(!Array.isArray(pedido.items)) pedido.items=[];
    if(!pedido.cliente||typeof pedido.cliente!=='object') pedido.cliente={nombre:'',tel:'',direccion:'',ciudad:'',notas:''};
    if(pedido.cliente.direccion==null) pedido.cliente.direccion='';
    if(pedido.cliente.ciudad==null) pedido.cliente.ciudad='';
    if(pedido.cliente.notas==null) pedido.cliente.notas='';
    var ne=d.notifEmail && typeof d.notifEmail==='object' ? d.notifEmail : {};
    return {
      moneda:d.moneda||'COP',
      bodegas:Array.isArray(d.bodegas)?d.bodegas:[],
      bodegaTels:(d.bodegaTels&&typeof d.bodegaTels==='object')?d.bodegaTels:{},
      bodegasPorSeccion:(function(){
        var b = (d.bodegasPorSeccion && typeof d.bodegasPorSeccion==='object') ? d.bodegasPorSeccion : null;
        if(b) return b;
        // Migración: todas las bodegas existentes se asignan a maquillaje (la sección histórica)
        return {maquillaje: Array.isArray(d.bodegas)?d.bodegas.slice():[]};
      })(),
      productos:(Array.isArray(d.productos)?d.productos:[]).map(function(p){
        p.tipo = (p.tipo==='combo'||p.tipo==='extra') ? p.tipo : 'normal';
        p.componentes = Array.isArray(p.componentes) ? p.componentes : [];
        if(p.stock === undefined) p.stock = null;
        else if(p.stock !== null){
          var n = parseInt(p.stock, 10);
          p.stock = isNaN(n) ? null : Math.max(0, n);
        }
        if(!p.seccion) p.seccion = 'maquillaje';
        if(!Array.isArray(p.variaciones)) p.variaciones = [];
        if(!p.tipoVariacion) p.tipoVariacion = '';
        if(!Array.isArray(p.videos)) p.videos = [];
        if(!Array.isArray(p.variacionesColor)) p.variacionesColor = [];
        if(!p.tipoVariacionColor) p.tipoVariacionColor = '';
        // Migración: si tipoVariacion es visual (Color/Talla/Tono/Colores/Tallas/Tonos), mover a variacionesColor

  /* ---------- usuarios / auth ---------- */
  function b64(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s){ var raw=atob(s), b=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) b[i]=raw.charCodeAt(i); return b.buffer; }
  function randSalt(){ var a=new Uint8Array(16); (window.crypto||window.msCrypto).getRandomValues(a); return b64(a.buffer); }
  async function hashPwd(password, saltB64){
    var enc=new TextEncoder();
    var key=await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:unb64(saltB64), iterations:100000, hash:'SHA-256'}, key, 256);
    return b64(bits);
  }
  async function verifyPwd(password, saltB64, hashB64){
    var h=await hashPwd(password, saltB64);
    return h===hashB64;
  }

    if(!state.carritos[session.usuarioId].cliente) state.carritos[session.usuarioId].cliente={nombre:'',tel:''};

  // Helpers de precios de producto (con fallback si el mayorista aún no está fijado)
  function variacionDe(p, vid){
    if(!p || !vid || !Array.isArray(p.variaciones)) return null;
    return p.variaciones.find(function(v){ return v.id===vid; }) || null;
  }
  function mayoristaOf(p, vari){
    if(vari){
      var vm=parseFloat(vari.precioMayorista);
      if(!isNaN(vm) && vm>0) return vm;
      var vv=parseFloat(vari.precioVenta);
      if(!isNaN(vv) && vv>0) return vv;
    }
    var m=parseFloat(p&&p.precioMayorista);
    return (!isNaN(m)&&m>0)?m:(p&&p.precioVenta ? +p.precioVenta : 0);
  }
  function ventaOf(p, vari){
    if(vari){
      var v=parseFloat(vari.precioVenta);
      if(!isNaN(v) && v>0) return v;
    }
    return p && p.precioVenta ? +p.precioVenta : 0;
  }
  function costoVariacion(vari){
    if(!vari) return null;
    var c=parseFloat(vari.costo);
    return (!isNaN(c) && c>=0) ? c : null;
  }
  // Precio real de venta en una línea del carrito: usa el editado por el trabajador, si no el de la variación, si no el del producto
  function itemVenta(it, p){
    var v=parseFloat(it && it.precioVendido);
    if(!isNaN(v) && v>0) return v;
    var vari = variacionDe(p, it && it.variacionId);
    return ventaOf(p, vari);
  }
  function itemMayorista(it, p){
    var vari = variacionDe(p, it && it.variacionId);
    return mayoristaOf(p, vari);
  }

  function normTel(raw){

    if(!d) return '';
    // Si empieza con 57 o tiene 12-15 dígitos, dejarlo. Si tiene 10 dígitos (celular Colombia), prefijar 57.
    if(d.length===10) d='57'+d;
    return d;
  }

  /* ---------- estados del pedido/venta ---------- */
  function ensureEstado(o){
    if(!o.estado || typeof o.estado!=='object'){
      o.estado={ realizado:{at:o.fecha||new Date().toISOString(), by:o.usuarioNombre||''}, envio:null, venta:null };
    }
    if(!o.estado.realizado) o.estado.realizado={at:o.fecha||new Date().toISOString(), by:o.usuarioNombre||''};
    if(o.estado.envio===undefined) o.estado.envio=null;
    if(o.estado.venta===undefined) o.estado.venta=null;
    return o.estado;
  }
  function estadoStage(o){
    // Devuelve 0..2: 0=solo realizado, 1=envio, 2=venta (todo hecho)
    ensureEstado(o);
    if(o.estado.venta) return 2;
    if(o.estado.envio) return 1;
    return 0;
  }
  function toggleEtapa(o, etapa){
    ensureEstado(o);
    var now=new Date().toISOString();
    var by=session ? session.usuarioNombre : '';
    if(etapa==='envio'){
      if(o.estado.envio){
        // Solo se puede desmarcar si venta no está confirmada
        if(o.estado.venta){ showToast('Primero desmarca "Venta realizada"',false); return; }
        o.estado.envio=null;
      } else {
        o.estado.envio={at:now, by:by};
      }
    } else if(etapa==='venta'){
      if(o.estado.venta){
        o.estado.venta=null;
      } else {
        // Confirmar venta requiere envío confirmado
        if(!o.estado.envio) o.estado.envio={at:now, by:by};
        o.estado.venta={at:now, by:by};
      }
    }
    scheduleSave();
  }

  /* ---------- ganancia real del admin ---------- */
  // Cuánto gana el DUEÑO (admin) por un pedido:
  // SIEMPRE = mayorista - costo bodega (la ganancia real de la empresa),
  // sin importar quién hizo la venta (admin o trabajador).
  function gananciaAdminDe(o){
    if(o.gananciaEmpresa!=null) return o.gananciaEmpresa;
    return (o.mayoristaTotal||0) - (o.costoTotal||0);
  }
  function gananciaAdminAll(list){ return list.reduce(function(a,o){return a+gananciaAdminDe(o);},0); }
  // Solo cuentan las ventas con pago confirmado
  function gananciaAdminConfirmada(list){
    return list.reduce(function(a,o){ ensureEstado(o); return a + (o.estado.venta ? gananciaAdminDe(o) : 0); },0);
  }
  function gananciaAdminPendiente(list){
    return list.reduce(function(a,o){ ensureEstado(o); return a + (o.estado.venta ? 0 : gananciaAdminDe(o)); },0);
  }

  function summary(){

    prods.forEach(function(p){ var b=best(p); if(b){ var m=marginPct(p.precioVenta,b.costo); if(m!=null){ margins.push(m); if(m<20) low++; } } });
    var avg=margins.length?margins.reduce(function(a,b){return a+b;},0)/margins.length:null;
    return {nprod:prods.length, nbod:bodegasDeSeccion().length, avg:avg, low:low};
  }

  function cartTotals(){
    var items=(currentCart().items||[]); var totC=0,totM=0,totV=0,units=0;
    items.forEach(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}); if(!p) return;
      var vari = variacionDe(p, it.variacionId);
      var vc = costoVariacion(vari);
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p);
      var cst = (vc!=null) ? vc : (b?b.costo:0);
      totC+= (cst||0)*it.cantidad;
      totM+= itemMayorista(it,p)*it.cantidad;
      totV+= itemVenta(it,p)*it.cantidad;
      units+=it.cantidad;
    });
    return {
      costo:totC, mayorista:totM, venta:totV,
      // ganancia depende del rol: trabajador gana venta-mayorista; admin visualiza empresa (mayorista-costo bodega) + total (venta-costo)
      gananciaTrabajador: totV-totM,
      gananciaEmpresa: totM-totC,
      gananciaTotal: totV-totC,
      ganancia: isAdmin()? (totV-totC) : (totV-totM),
      unidades:units, lineas:items.length
    };
  }

      var pedMes=pedsSec.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
      var gTot=gananciaAdminConfirmada(pedsSec);
      var gPend=gananciaAdminPendiente(pedsSec);
      var nTrab=trabajadoresSoloDe(activeSection||'maquillaje').length;
      function bigStat(k,v,cls){
        return '<div class="stat '+(cls||'')+'"><div class="rail" style="background:var(--good)"></div>'+
          '<div class="k">'+esc(k)+'</div>'+
          '<div class="v num" style="color:var(--good); font-size:22px">'+esc(v)+'</div></div>';
      }
      statsHTML='<div class="stats">'+
        stat('Productos',s.nprod)+
        stat('Ventas ('+pedMes.length+' mes)', pedsSec.length)+
        stat('Trabajadores', nTrab)+
        bigStat('Mi ganancia total', fmt(gTot))+
      '</div>'+
      '<div class="hint" style="margin:-8px 2px 16px; display:flex; gap:14px; flex-wrap:wrap">'+
        '<span>🏬 '+s.nbod+' bodegas</span>'+
        (s.avg!=null?'<span>margen prom. '+pct(s.avg)+'</span>':'')+
        (s.low>0?'<span style="color:var(--bad)">⚠ '+s.low+' con margen bajo</span>':'<span style="color:var(--good)">✓ sin productos con margen bajo</span>')+
        (gPend>0?'<span style="color:var(--warn)">⏳ Pendiente de pago: <b>'+fmt(gPend)+'</b></span>':'')+
      '</div>';
    }else{
      // trabajador: productos, pedidos este mes, ganancia este mes (solo de esta sección)
      var mine=pedidosDeSeccion().filter(function(o){return o.usuarioId===session.usuarioId;});
      var mes=new Date().toISOString().slice(0,7);
      var mineMes=mine.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
      function gTrabDe(o){ if(o.gananciaTrabajador!=null) return o.gananciaTrabajador; return (o.ventaTotal||0)-(o.mayoristaTotal||0); }
      // Solo suma la ganancia cuando el admin confirma el pago (estado.venta)
      var pagadosMes=mineMes.filter(function(o){ ensureEstado(o); return !!o.estado.venta; });
      var pendMes=mineMes.filter(function(o){ ensureEstado(o); return !o.estado.venta; });
      var ganMes=pagadosMes.reduce(function(a,o){return a+gTrabDe(o);},0);
      var ganPend=pendMes.reduce(function(a,o){return a+gTrabDe(o);},0);
      statsHTML='<div class="stats">'+stat('Productos',s.nprod)+stat('Pedidos (este mes)',mineMes.length)+stat('Ganancia (este mes)',fmt(ganMes))+'</div>';
      if(ganPend>0){
        statsHTML += '<div class="hint" style="margin:-8px 2px 16px; display:flex; gap:14px; flex-wrap:wrap">'+
          '<span style="color:var(--warn)">⏳ Por confirmar pago: <b>'+fmt(ganPend)+'</b> ('+pendMes.length+' pedido'+(pendMes.length===1?'':'s')+')</span>'+
        '</div>';
      }
    }
    return '<div class="top">'+
      '<div class="brand"><h1>'+esc((secActiva.marca||secActiva.nombre||'').toUpperCase())+ (secActiva.sublabel?' <span style="font-weight:400;color:var(--muted);letter-spacing:0">'+esc(secActiva.sublabel)+'</span>':'') +'</h1><p>'+esc(lead)+' <button class="change-sect" data-act="change-section" title="Cambiar de sección">Cambiar</button></p></div>'+
      '<div class="top-tools">'+whoLine+connHTML()+
        (admin?'<button class="icon-btn" data-act="toggle-moneda" title="Cambiar moneda">'+(state.moneda==='USD'?'US$':'COP')+'</button>':'')+
        '<button class="icon-btn" data-act="toggle-theme" title="Tema claro/oscuro" aria-label="Cambiar tema">◐</button>'+
      '</div></div>'+ statsHTML;
  }
  function stat(k,v){ return '<div class="stat"><div class="rail"></div><div class="k">'+esc(k)+'</div><div class="v num">'+esc(v)+'</div></div>'; }
  function opt(v,label){ return '<option value="'+v+'"'+(ui.sort===v?' selected':'')+'>'+esc(label)+'</option>'; }

  function productosDeSeccion(){
    var sec = activeSection || 'maquillaje';
    return (state.productos||[]).filter(function(p){ return (p.seccion||'maquillaje') === sec; });
  }
  function pedidosDeSeccion(){
    var sec = activeSection || 'maquillaje';
    return (state.pedidos||[]).filter(function(o){ return (o.seccion||'maquillaje') === sec; });
  }
  function trabajadoresDeSeccion(){
    var sec = activeSection || 'maquillaje';
    return (state.usuarios||[]).filter(function(u){
      if(u.role==='admin') return true; // admin ve todo pero no cuenta como trabajador de sección
      var arr = Array.isArray(u.secciones) ? u.secciones : ['maquillaje'];
      return arr.indexOf(sec) >= 0;
    });
  }
  function trabajadoresSoloDe(sec){
    return (state.usuarios||[]).filter(function(u){
      if(u.role==='admin') return false;
      var arr = Array.isArray(u.secciones) ? u.secciones : ['maquillaje'];
      return arr.indexOf(sec) >= 0;
    });
  }
  function bodegasDeSeccion(){
    var sec = activeSection || 'maquillaje';
    if(!state.bodegasPorSeccion) state.bodegasPorSeccion = {};
    if(!Array.isArray(state.bodegasPorSeccion[sec])) state.bodegasPorSeccion[sec] = [];
    return state.bodegasPorSeccion[sec];
  }
  function ensureBodegaEnSeccion(bod){
    var sec = activeSection || 'maquillaje';
    if(!bod) return;
    if(!state.bodegasPorSeccion) state.bodegasPorSeccion = {};
    if(!Array.isArray(state.bodegasPorSeccion[sec])) state.bodegasPorSeccion[sec] = [];
    if(state.bodegasPorSeccion[sec].indexOf(bod)<0) state.bodegasPorSeccion[sec].push(bod);
    // Espejo en state.bodegas global por compat (unión de todas)
    if(Array.isArray(state.bodegas) && state.bodegas.indexOf(bod)<0) state.bodegas.push(bod);
  }
  function filtered(){
    var q=ui.q.trim().toLowerCase();
    var base = productosDeSeccion();
    var list=base.filter(function(p){ if(!q) return true;
      var hay=(p.nombre||'')+' '+(p.sku||'')+' '+(p.marca||'')+' '+(p.costos||[]).map(function(c){return c.bodega;}).join(' ');
      return hay.toLowerCase().indexOf(q)>=0; });
    if(ui.sort==='marca'){
      // conserva el orden natural del array (por marca en el que se agregaron)
      return list;
    }
    list.sort(function(a,b){
      if(ui.sort==='nombre') return (a.nombre||'').localeCompare(b.nombre||'','es');
      if(ui.sort==='precio') return (b.precioVenta||0)-(a.precioVenta||0);
      if(ui.sort==='costo'){ var ca=best(a),cb=best(b); return (ca?ca.costo:Infinity)-(cb?cb.costo:Infinity); }
      if(ui.sort==='margen'){ var ma=best(a)?marginPct(a.precioVenta,best(a).costo):-Infinity; var mb=best(b)?marginPct(b.precioVenta,best(b).costo):-Infinity; return (mb==null?-Infinity:mb)-(ma==null?-Infinity:ma); }
      return 0; });
    return list;
  }
  function productsHTML(){
    var admin = isAdmin();
    var list=filtered();
    var secProds = productosDeSeccion();
    var newBrandBtn = admin ? '<button class="btn ghost brand-add-btn" data-act="brand-new" style="max-width:520px;margin:12px auto 0;display:flex">＋ Nueva marca</button>' : '';
    if(!secProds.length){
      return '<div class="empty"><div class="em-ic">📦</div><h3>Todavía no hay productos en esta sección</h3><p>Agrega tu primer producto o crea las marcas primero para organizarlo mejor.</p>'+
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px">'+
          (admin?'<button class="btn primary" data-act="new">＋ Agregar producto</button>':'')+
          (admin?'<button class="btn ghost" data-act="brand-new">＋ Nueva marca</button>':'')+
        '</div>'+
      '</div>';
    }
    if(!list.length){
      return '<div class="empty"><div class="em-ic">🔍</div><h3>Sin resultados</h3><p>Ningún producto coincide con "'+esc(ui.q)+'".</p></div>'+ newBrandBtn;
    }
    // Agrupar por marca: primero el orden de state.marcas, luego "SIN MARCA" y las que no estén registradas
    var groups=[]; var byName={};
    var marcasReg = marcasDeSeccion().slice();
    var admin0 = isAdmin();
    marcasReg.forEach(function(m){ var g={marca:m, items:[]}; byName[marcaUpper(m)]=g; groups.push(g); });
    list.forEach(function(p){
      var mRaw=(p.marca||'').trim();
      var key = mRaw ? marcaUpper(mRaw) : '';
      if(mRaw && byName[key]){ byName[key].items.push(p); return; }
      if(mRaw){
        if(!byName[key]){ byName[key]={marca:mRaw, items:[]}; groups.push(byName[key]); }
        byName[key].items.push(p);
      }else{
        if(!byName['__sin__']){ byName['__sin__']={marca:'SIN MARCA', items:[]}; groups.push(byName['__sin__']); }
        byName['__sin__'].items.push(p);
      }
    });
    // Para trabajador: ocultar marcas vacías. Para admin: mostrarlas para que las pueda editar/asignar.
    if(!admin0) groups = groups.filter(function(g){ return g.items.length>0; });
    // Ocultar "SIN MARCA" si está vacía siempre
    groups = groups.filter(function(g){ return g.marca!=='SIN MARCA' || g.items.length>0; });
    // Filtrar marcas ocultas SOLO para trabajadores
    var admin=isAdmin();
    var ocultas = (state.marcasOcultas||[]).map(function(x){return String(x).toUpperCase();});
    var totalGroups = groups.length;
    var hiddenCount = 0;
    if(!admin){
      var visibles=[];
      groups.forEach(function(g){
        if(ocultas.indexOf(String(g.marca).toUpperCase())>=0) hiddenCount++;
        else visibles.push(g);
      });
      groups=visibles;
    }
    // Auto-expandir cuando se busca; si no, respetar preferencia guardada
    var searching=!!ui.q.trim();
    var listHTML=groups.map(function(g){
      var isHidden = admin && ocultas.indexOf(String(g.marca).toUpperCase())>=0;
      var collapsed = !searching && ui.collapsed[g.marca];
      var margenes=g.items.map(function(p){var b=best(p); return b?marginPct(p.precioVenta,b.costo):null;}).filter(function(x){return x!=null;});
      var avg=margenes.length?Math.round(margenes.reduce(function(a,b){return a+b;},0)/margenes.length):null;
      var isVirtual = g.marca==='SIN MARCA';
      var adminBtns = (admin && !isVirtual) ? (
        '<div class="pg-admin">'+
          '<button class="mini" data-act="brand-toggle" data-marca="'+esc(g.marca)+'" title="'+(isHidden?'Mostrar':'Ocultar')+' a trabajadores">'+(isHidden?'👁️‍🗨️':'👁️')+'</button>'+
          '<button class="mini" data-act="brand-rename" data-marca="'+esc(g.marca)+'" title="Renombrar">✎</button>'+
          '<button class="mini del" data-act="brand-del" data-marca="'+esc(g.marca)+'" title="Eliminar marca">🗑</button>'+
        '</div>'
      ) : '';
      return '<div class="pgroup'+(collapsed?' collapsed':'')+(isHidden?' hidden-brand':'')+'" data-marca="'+esc(g.marca)+'">'+
        '<div class="pg-hdr" data-act="tg-group">'+
          '<span class="chev">▼</span>'+
          '<span class="name">'+esc(g.marca)+'</span>'+
          (isHidden?'<span class="brand-tag-hidden">🚫 oculta</span>':'')+
          '<span class="count">'+g.items.length+'</span>'+
          (avg!=null?'<span class="avg">margen prom. '+pct(avg)+'</span>':'')+
          adminBtns+
        '</div>'+
        '<div class="pgrid">'+g.items.map(rowHTML).join('')+'</div>'+
      '</div>';
    }).join('');
    var addBrandBtn = admin ? '<button class="btn ghost brand-add-btn" data-act="brand-new">＋ Nueva marca</button>' : '';
    // Mensaje al final para trabajadores si hay marcas ocultas
    var footerNote='';
    if(!admin && hiddenCount>0){
      footerNote='<div class="brand-footer-note">✨ Estamos organizando el inventario. Pronto se irán habilitando <b>'+hiddenCount+' marca'+(hiddenCount===1?'':'s')+' más</b>.</div>';
    }
    return '<div class="plist">'+addBrandBtn+listHTML+footerNote+'</div>';
  }

    }else{
      body='<table><thead><tr><th>Bodega</th><th class="r">Costo</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>'+
        costos.map(function(c){
          var isBest=b&&c.bodega===b.bodega&&c.costo===b.costo;

            '<td class="r num mg '+mgClass(m)+'">'+(m==null?'—':pct(m))+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    if(p.notas) body+='<div class="note">📝 '+esc(p.notas)+'</div>';

    var vars = Array.isArray(p.variaciones) ? p.variaciones : [];
    if(vars.length){

      body += '<div class="sub" style="margin-top:10px">🎨 '+(p.tipoVariacionColor||'Opciones')+' · '+varsC.length+' opción'+(varsC.length===1?'':'es')+'</div>';
      body += '<div class="var-gallery">' + varsC.map(function(v){

          : '<div class="var-ph">🎨</div>';
        var dlb = v.imagen ? '<button class="var-dl" data-act="dl-varc" data-pid="'+esc(p.id)+'" data-vid="'+esc(v.id)+'" title="Descargar">⬇</button>' : '';

  async function tryConnect(){
    var url=normUrl(document.getElementById('s-url').value);
    var key=(document.getElementById('s-key').value||'').trim();
    var msg=document.getElementById('s-msg');
    if(!/^https:\/\/.+\.supabase\.co$/.test(url)){ msg.innerHTML='<div class="callout warn">La URL debe verse como <b>https://xxxxx.supabase.co</b> (sin barra al final).</div>'; return; }
    if(!key||key.length<20){ msg.innerHTML='<div class="callout warn">La clave anon parece incompleta. Cópiala completa.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Probando conexión…</div>';
    var testCfg={url:url,key:key};
    try{
      var r=await fetch(url+'/rest/v1/bodegas_data?id=eq.'+ROW_ID+'&select=data,updated_at',{headers:authFor(key)});
      if(r.status===401||r.status===403){ msg.innerHTML='<div class="callout warn">La clave no tiene acceso. Revisa que copiaste la clave <b>anon/public</b> y que corriste el SQL.</div>'; return; }
      if(r.status===404){ msg.innerHTML='<div class="callout warn">No encuentro la tabla <b>bodegas_data</b>. ¿Corriste el texto SQL del Paso 2?</div>'; return; }
      if(!r.ok){ msg.innerHTML='<div class="callout warn">Error '+r.status+'. Revisa la URL y la clave.</div>'; return; }
      var rows=await r.json();
      cfg=testCfg; saveCfg(cfg);
      if(rows&&rows[0]){ state=sanitize(rows[0].data); lastServerStamp=rows[0].updated_at; }
      else { state=sanitize({}); await sbSave(); }
      // ¿hay respaldo local con datos y el servidor está vacío? ofrecer subirlo
      var cache=loadCache();
      if(cache && cache.productos && cache.productos.length && (!state.productos || !state.productos.length)){
        if(confirm('Encontré '+cache.productos.length+' producto(s) guardados en este dispositivo y la base en la nube está vacía. ¿Subirlos a la nube?')){
          state=sanitize(cache); dirty=true; await commit();
        }
      }
      cacheState(); setConn('ok'); render(); startPolling();
      showToast('¡Conectado! Sincronización activa', false);
    }catch(e){ msg.innerHTML='<div class="callout warn">No pude conectar. Revisa tu internet y que la URL sea correcta.</div>'; }
  }

  /* ---------- helpers de imagen ---------- */
  function fileToCompressedDataURL(file, maxDim, quality){
    maxDim = maxDim || 800; quality = quality || 0.78;
    return new Promise(function(resolve, reject){
      if(!file){ reject(new Error('sin archivo')); return; }
      if(!/^image\//.test(file.type)){ reject(new Error('no es imagen')); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('error leyendo')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('imagen inválida')); };
        img.onload = function(){
          var w=img.width, h=img.height;
          if(w>maxDim || h>maxDim){
            if(w>h){ h = Math.round(h*maxDim/w); w=maxDim; }
            else { w = Math.round(w*maxDim/h); h=maxDim; }
          }
          var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          try{ resolve(cv.toDataURL('image/jpeg', quality)); }
          catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function downloadDataURL(dataURL, filename){
    try{
      var a=document.createElement('a');
      a.href=dataURL; a.download=filename||'imagen.jpg';

      setTimeout(function(){ document.body.removeChild(a); }, 100);
    }catch(e){ showToast('No se pudo descargar', false); }
  }

        '<button class="del-marca-opt" data-role="opt-only">'+

        '</button>'+
        '<button class="del-marca-opt danger" data-role="opt-both">'+
          '<div class="opt-ico">💥</div>'+
          '<div><div class="opt-title">Eliminar marca <u>y sus productos</u></div>'+
          '<div class="opt-desc">Borra la marca <b>y los '+count+' producto'+(count===1?'':'s')+'</b>. No se puede deshacer.</div></div>'+

    '</div></div>';
    var upperM = marcaUpper(m);
    var secKey = activeSection || 'maquillaje';
    function refreshGlobalMarcas(){
      var unionM = {};
      Object.keys(state.marcasPorSeccion||{}).forEach(function(k){ (state.marcasPorSeccion[k]||[]).forEach(function(x){ unionM[marcaUpper(x)]=x; }); });
      state.marcas = Object.keys(unionM).map(function(k){return unionM[k];});
      // Ocultas: mantener solo las que existen globalmente
      state.marcasOcultas=(state.marcasOcultas||[]).filter(function(x){return !!unionM[marcaUpper(x)];});
    }
    host.querySelector('[data-role="opt-only"]').addEventListener('click', function(){
      // Solo eliminar en esta sección
      if(state.marcasPorSeccion && state.marcasPorSeccion[secKey]){
        state.marcasPorSeccion[secKey] = state.marcasPorSeccion[secKey].filter(function(x){return marcaUpper(x)!==upperM;});
      }
      productosDeSeccion().forEach(function(p){ if(marcaUpper(p.marca)===upperM) p.marca=''; });
      refreshGlobalMarcas();
      closeModal(); scheduleSave(); render();
      showToast('Marca "'+m+'" eliminada de esta sección. Los productos quedaron sin marca.', false);
    });
    host.querySelector('[data-role="opt-both"]').addEventListener('click', function(){
      if(count>0 && !confirm('¿Confirmas que quieres borrar la marca "'+m+'" Y los '+count+' producto(s) asignados a ella en esta sección?')) return;
      var idsBorrados = productosDeSeccion().filter(function(p){ return marcaUpper(p.marca)===upperM; }).map(function(p){return p.id;});
      state.productos = state.productos.filter(function(p){ return idsBorrados.indexOf(p.id)<0; });
      state.productos.forEach(function(p){
        if(p.tipo==='combo' && Array.isArray(p.componentes)){
          p.componentes = p.componentes.filter(function(c){ return idsBorrados.indexOf(c.productoId)<0; });
        }
      });
      if(state.marcasPorSeccion && state.marcasPorSeccion[secKey]){
        state.marcasPorSeccion[secKey] = state.marcasPorSeccion[secKey].filter(function(x){return marcaUpper(x)!==upperM;});
      }
      refreshGlobalMarcas();
      closeModal(); scheduleSave(); render();
      showToast('Marca y '+count+' producto(s) eliminados de esta sección', false);
    });
  }

        '</div>'+

    '</div></div>';

    function currentMode(){ var r=modal.querySelector('input[name="stk-mode"]:checked'); return r?r.value:'add'; }
    function refreshPreview(){
      var q=parseInt(qtyEl.value,10); if(isNaN(q)||q<0) q=0;
      var mode=currentMode();
      var result;
      if(mode==='add') result = actual + q;
      else if(mode==='sub') result = Math.max(0, actual - q);
      else result = q;
      var color = result===0 ? 'var(--bad)' : (result<=5 ? 'var(--warn)' : 'var(--good)');
      previewEl.innerHTML = '<span class="lb">Nuevo stock</span><span class="v num" style="color:'+color+'">'+(result===0?'AGOTADO':result)+'</span>';
    }
    modal.querySelectorAll('input[name="stk-mode"]').forEach(function(r){

        modal.querySelectorAll('.tipo-opt').forEach(function(el){
          var inp=el.querySelector('input');
          el.classList.toggle('on', inp && inp.checked);
        });
        refreshPreview();
      });
    });
    qtyEl.addEventListener('input', refreshPreview);
    refreshPreview();
    setTimeout(function(){ qtyEl.focus(); qtyEl.select(); }, 30);
    host.querySelector('[data-role="stk-save"]').addEventListener('click', function(){
      var q=parseInt(qtyEl.value,10); if(isNaN(q)||q<0){ showToast('Cantidad inválida', false); return; }
      var mode=currentMode();
      var result;
      if(mode==='add') result = actual + q;
      else if(mode==='sub') result = Math.max(0, actual - q);
      else result = q;
      p.stock = result;
      closeModal(); refreshProds(); scheduleSave();
      showToast('Inventario actualizado: '+(result===0?'AGOTADO':result), false);
    });
  }

    previewEl.addEventListener('drop', function(e){

      var pv=parseFloat(g('precioVenta')); p.precioVenta=isNaN(pv)?0:pv;
      var pm=parseFloat(g('precioMayorista')); p.precioMayorista=isNaN(pm)?0:pm;
      var stRaw=(g('stock')||'').trim();
      if(stRaw===''){ p.stock=null; }
      else { var st=parseInt(stRaw,10); p.stock=isNaN(st)?null:Math.max(0,st); }
      var tipoSel = modal.querySelector('input[name="tipo"]:checked');
      p.tipo = tipoSel ? tipoSel.value : 'normal';
      var costos=[];
      if(p.tipo==='normal'){
        rowsEl.querySelectorAll('.cost-row').forEach(function(r){ var bEl=r.querySelector('[data-role="bod"]'); var bod=bEl?(bEl.value==='__new__'?'':bEl.value.trim()):''; var costo=parseFloat(r.querySelector('[data-role="costo"]').value); if(bod){ costos.push({bodega:bod,costo:isNaN(costo)?0:costo}); ensureBodegaEnSeccion(bod); } });
      }
      p.costos=costos;
      var comps=[];
      if(p.tipo==='combo'){
        crowsEl.querySelectorAll('.comp-row').forEach(function(r){
          var pid=(r.querySelector('[data-role="cprod"]').value||'').trim();
          var q=parseFloat(r.querySelector('[data-role="ccant"]').value); if(isNaN(q)||q<1) q=1;
          if(pid) comps.push({productoId:pid, cantidad:Math.round(q)});
        });
      }
      p.componentes=comps;
      // Recoger variaciones con precio
      varRowsPrecio.querySelectorAll('.var-row').forEach(function(r, idx){
        var nameInp = r.querySelector('[data-role="vname"]');
        var pvInp = r.querySelector('[data-role="vpv"]');
        var pmInp = r.querySelector('[data-role="vpm"]');
        var coInp = r.querySelector('[data-role="vco"]');
        if(!p.variaciones[idx]) return;
        if(nameInp) p.variaciones[idx].nombre = nameInp.value.trim();
        if(pvInp){ var pvV = parseFloat(pvInp.value); p.variaciones[idx].precioVenta = (!isNaN(pvV)&&pvV>0) ? pvV : ''; }
        if(pmInp){ var pmV = parseFloat(pmInp.value); p.variaciones[idx].precioMayorista = (!isNaN(pmV)&&pmV>0) ? pmV : ''; }
        if(coInp){ var coV = parseFloat(coInp.value); p.variaciones[idx].costo = (!isNaN(coV)&&coV>=0) ? coV : ''; }
      });
      p.variaciones = p.variaciones.filter(function(v){ return v.nombre || v.precioVenta || v.precioMayorista; });
      if(!p.variaciones.length) p.tipoVariacion = '';

      // Recoger variaciones visuales (color/talla)
      varRowsColor.querySelectorAll('.var-row').forEach(function(r, idx){
        var nameInp = r.querySelector('[data-role="vname-color"]');
        if(!p.variacionesColor[idx]) return;
        if(nameInp) p.variacionesColor[idx].nombre = nameInp.value.trim();
      });
      p.variacionesColor = p.variacionesColor.filter(function(v){ return v.nombre || v.imagen; });
      if(!p.variacionesColor.length) p.tipoVariacionColor = '';
      if(!p.variaciones.length) p.tipoVariacion = '';
      if(!p.nombre){ modal.querySelector('[data-f="nombre"]').focus(); return; }
      if(p.tipo==='combo' && !comps.length){ showToast('El combo necesita al menos un producto', false); return; }
      if(isNew) state.productos.push(p); else { var i=state.productos.findIndex(function(x){return x.id===p.id;}); if(i>=0) state.productos[i]=p; else state.productos.push(p); }
      closeModal(); render(); scheduleSave();
    });
    setTimeout(function(){ var n=modal.querySelector('[data-f="nombre"]'); if(n) n.focus(); },30);
  }

  /* ---------- modal bodegas ---------- */
  function openBodegas(){
    var sec = activeSection || 'maquillaje';
    var secNombre = ((state.secciones||[]).find(function(x){return x.id===sec;})||{}).nombre || sec;
    function currentBods(){ return bodegasDeSeccion(); }
    function rows(){
      var bods = currentBods();
      if(!bods.length) return '<p class="hint">No hay bodegas en esta sección. Se crean solas cuando las escribes en un producto, o agrégalas abajo.</p>';
      return bods.map(function(b,i){
        var uses=productosDeSeccion().filter(function(p){ return (p.costos||[]).some(function(c){return c.bodega===b;}); }).length;
        var tel=state.bodegaTels[b]||'';
        return '<div class="bod-row" data-i="'+i+'">'+
          '<div class="bod-row-line">'+
            '<input type="text" data-role="bname" value="'+esc(b)+'" placeholder="Nombre de la bodega">'+
            '<span class="hint">'+uses+' prod.</span>'+
            '<button class="mini del" data-role="bdel" title="Eliminar">🗑</button>'+
          '</div>'+
          '<div class="bod-row-line" style="margin-top:6px">'+
            '<span class="wa-ic" title="WhatsApp">📱</span>'+
            '<input type="tel" data-role="btel" inputmode="tel" value="'+esc(tel)+'" placeholder="WhatsApp — ej: 3001234567">'+
          '</div>'+
        '</div>';
      }).join('');
    }
    host.innerHTML='<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(480px,100%)">'+
      '<div class="modal-hd"><h2>🏬 Bodegas de '+esc(secNombre)+'</h2><button class="mini" data-role="close">×</button></div>'+
      '<div class="modal-bd">'+
        '<p class="hint">Estas bodegas son únicas para la sección <b>'+esc(secNombre)+'</b>. Guarda el WhatsApp de cada una para enviar el pedido con un toque (en Colombia basta con 10 dígitos).</p>'+
        '<div data-role="blist">'+rows()+'</div>'+
        '<div class="list-row" style="border:none;padding-top:10px"><input type="text" data-role="bnew" placeholder="Agregar bodega nueva a '+esc(secNombre)+'…"><button class="btn ghost" data-role="badd">Agregar</button></div>'+
      '</div>'+
      '<div class="modal-ft"><button class="btn ghost" data-role="close">Cancelar</button><button class="btn primary" data-role="bsave">Guardar</button></div></div></div>';
    var modal=host.querySelector('.modal'), listEl=host.querySelector('[data-role="blist"]');
    function reRows(){ listEl.innerHTML=rows(); }
    host.querySelector('[data-role="badd"]').addEventListener('click',function(){
      var inp=modal.querySelector('[data-role="bnew"]'); var v=inp.value.trim();
      var bods=currentBods();
      if(v&&bods.indexOf(v)<0){ bods.push(v); ensureBodegaEnSeccion(v); reRows(); }
      inp.value=''; inp.focus();
    });
    listEl.addEventListener('click',function(e){
      if(e.target.matches('[data-role="bdel"]')){
        var bods=currentBods();
        var i=+e.target.closest('.bod-row').getAttribute('data-i'); var name=bods[i];
        var uses=productosDeSeccion().filter(function(p){ return (p.costos||[]).some(function(c){return c.bodega===name;}); }).length;
        if(uses>0){ showToast('“'+name+'” está en uso por '+uses+' producto(s)',false); return; }
        bods.splice(i,1); delete state.bodegaTels[name]; reRows();
      }
    });
    function doClose(){ closeModal(); }
    host.querySelectorAll('[data-role="close"]').forEach(function(b){ b.addEventListener('click',doClose); });
    host.querySelector('[data-role="scrim"]').addEventListener('mousedown',function(e){ if(e.target===e.currentTarget) doClose(); });
    host.querySelector('[data-role="bsave"]').addEventListener('click',function(){
      var rowsN=listEl.querySelectorAll('.bod-row');
      var bods=currentBods();
      var newList=[]; var newTels=Object.assign({}, state.bodegaTels||{});
      rowsN.forEach(function(row){
        var oldName=bods[+row.getAttribute('data-i')];
        var nv=row.querySelector('[data-role="bname"]').value.trim();
        var tel=row.querySelector('[data-role="btel"]').value.trim();
        if(!nv){ newList.push(oldName); if(tel) newTels[oldName]=tel; return; }
        if(nv!==oldName){
          // Renombrar en productos de esta sección
          productosDeSeccion().forEach(function(p){ (p.costos||[]).forEach(function(c){ if(c.bodega===oldName) c.bodega=nv; }); });
          if(oldName && newTels[oldName]!=null){ delete newTels[oldName]; }
        }
        newList.push(nv);
        if(tel) newTels[nv]=tel; else delete newTels[nv];
      });
      // Guardar dedupeado en la sección activa
      var dedup = newList.filter(function(v,i){ return v && newList.indexOf(v)===i; });
      state.bodegasPorSeccion[sec] = dedup;
      // Espejo global (unión)
      var unionSet = {};
      Object.keys(state.bodegasPorSeccion).forEach(function(k){ (state.bodegasPorSeccion[k]||[]).forEach(function(b){ unionSet[b]=1; }); });
      state.bodegas = Object.keys(unionSet);
      state.bodegaTels = newTels;
      closeModal(); render(); scheduleSave();
    });
  }

  /* ---------- exportar / respaldo ---------- */
  function download(filename, text, mime){
    var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }
  function exportCSV(){
    var rows=[['Producto','SKU','Precio venta','Bodega','Costo','Ganancia','Margen %','Mejor opción']];
    state.productos.forEach(function(p){ var b=best(p);
      (p.costos||[]).forEach(function(c){ var gan=(p.precioVenta&&c.costo)?p.precioVenta-c.costo:''; var m=marginPct(p.precioVenta,c.costo);
        rows.push([p.nombre,p.sku||'',p.precioVenta||'',c.bodega,c.costo||'',gan,m==null?'':Math.round(m),(b&&c.bodega===b.bodega&&c.costo===b.costo)?'Sí':'']); });
      if(!(p.costos||[]).length) rows.push([p.nombre,p.sku||'',p.precioVenta||'','','','','','']); });
    var csv=rows.map(function(r){ return r.map(function(cell){ var s=String(cell==null?'':cell); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(','); }).join('\r\n');
    download('bodegas-margenes.csv','﻿'+csv,'text/csv;charset=utf-8'); showToast('CSV exportado',false);
  }
  function backup(){ download('respaldo-bodegas-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(state,null,2),'application/json'); showToast('Respaldo descargado',false); }
  function doImport(){ document.getElementById('file-import').click(); }
  document.getElementById('file-import').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{ var d=JSON.parse(rd.result); d=sanitize(d);
      if(confirm('Esto reemplazará los datos actuales con los del respaldo ('+d.productos.length+' productos). ¿Continuar?')){ state=d; closeModal(); render(); if(cfg) scheduleSave(); else { cacheState(); } showToast('Respaldo restaurado',false); }
    }catch(err){ alert('El archivo no es un respaldo válido.'); } e.target.value=''; };
    rd.readAsText(f);
  });

  /* ---------- ripple effect en botones ---------- */
  document.addEventListener('pointerdown', function(e){
    var b = e.target.closest('.btn, .icon-btn, .pcard-add, .pcard-stock-btn');
    if(!b || b.disabled) return;
    var r = b.getBoundingClientRect();
    b.style.setProperty('--rx', (e.clientX - r.left) + 'px');
    b.style.setProperty('--ry', (e.clientY - r.top) + 'px');
    b.classList.remove('rippling');
    // force reflow
    void b.offsetWidth;
    b.classList.add('rippling');
    setTimeout(function(){ b.classList.remove('rippling'); }, 600);
  });

  /* ---------- eventos globales ---------- */
  document.addEventListener('click',function(e){
    var act=e.target.closest('[data-act]'); if(!act) return;
    var a=act.getAttribute('data-act');
    if(a==='new') openProduct(null);
    else if(a==='bodegas') openBodegas();
    else if(a==='menu') openMenu();
    else if(a==='export'){ closeModal(); exportCSV(); }
    else if(a==='backup'){ closeModal(); backup(); }
    else if(a==='import') doImport();
    else if(a==='config'){ closeModal(); renderSetup(cfg||{}); }
    else if(a==='disconnect'){ if(confirm('Se borrará la conexión de ESTE dispositivo (tus datos en la nube quedan intactos). ¿Continuar?')){ try{localStorage.removeItem(CFG_KEY);}catch(x){} cfg=null; stopPolling(); render(); } }
    else if(a==='toggle-moneda'){ state.moneda=state.moneda==='USD'?'COP':'USD'; render(); scheduleSave(); }
    else if(a==='toggle-theme') toggleTheme();
    else if(a==='edit'||a==='del'||a==='add-cart'){
      var pcont=e.target.closest('.prow, .card, .pcard'); if(!pcont) return;
      var id=pcont.getAttribute('data-id');

      if(a==='edit') openProduct(p);

      else { if(confirm('¿Eliminar "'+(p.nombre||'este producto')+'"?')){ state.productos=state.productos.filter(function(x){return x.id!==id;}); render(); scheduleSave(); } }
    }
    else if(a==='tg-group'){
      // No colapsar si el click nació en los botones admin de la marca
      if(e.target.closest('.pg-admin')) return;

      var marca=pg.getAttribute('data-marca');

      showToast('Marca "'+nv+'" agregada',false);
    }

      if(!isAdmin()) return;
      e.stopPropagation();
      var oldM=act.getAttribute('data-marca'); if(!oldM) return;
      var nv2=prompt('Renombrar marca "'+oldM+'" a:', oldM); if(nv2==null) return;
      nv2=String(nv2).trim(); if(!nv2){ showToast('Nombre vacío',false); return; }
      if(marcaUpper(nv2)!==marcaUpper(oldM) && findMarcaCanonica(nv2)){ showToast('Ya existe una marca con ese nombre',false); return; }
      var secMarcas = marcasDeSeccion();
      var idx=secMarcas.findIndex(function(x){return marcaUpper(x)===marcaUpper(oldM);});
      if(idx>=0) secMarcas[idx]=nv2; else secMarcas.push(nv2);
      // Renombrar solo productos de esta sección
      productosDeSeccion().forEach(function(pp){ if(marcaUpper(pp.marca)===marcaUpper(oldM)) pp.marca=nv2; });
      var oi=(state.marcasOcultas||[]).findIndex(function(x){return marcaUpper(x)===marcaUpper(oldM);});
      if(oi>=0) state.marcasOcultas[oi]=nv2;
      // Espejo global
      var idxG = (state.marcas||[]).findIndex(function(x){return marcaUpper(x)===marcaUpper(oldM);});
      if(idxG>=0) state.marcas[idxG]=nv2;
      scheduleSave(); refreshProds();
    }
    else if(a==='brand-del'){
      if(!isAdmin()) return;
      e.stopPropagation();
      var mm=act.getAttribute('data-marca'); if(!mm) return;
      // solo eliminar de la sección activa
      var msg='¿Eliminar la marca "'+mm+'" solo de esta sección? Los productos de esta sección quedarán SIN MARCA. En otras secciones no se toca.';
      if(!confirm(msg)) return;
      var upperM = marcaUpper(mm);
      var secKey = activeSection || 'maquillaje';
      if(state.marcasPorSeccion && state.marcasPorSeccion[secKey]){
        state.marcasPorSeccion[secKey] = state.marcasPorSeccion[secKey].filter(function(x){return marcaUpper(x)!==upperM;});
      }
      productosDeSeccion().forEach(function(pp){ if(marcaUpper(pp.marca)===upperM) pp.marca=''; });
      // Actualizar espejo global (unión)
      var unionM = {};
      Object.keys(state.marcasPorSeccion||{}).forEach(function(k){ (state.marcasPorSeccion[k]||[]).forEach(function(x){ unionM[marcaUpper(x)]=x; }); });
      state.marcas = Object.keys(unionM).map(function(k){return unionM[k];});
      // Ocultas: si ya no existe globalmente, quitar
      if(!unionM[upperM]) state.marcasOcultas=(state.marcasOcultas||[]).filter(function(x){return marcaUpper(x)!==upperM;});
      scheduleSave(); refreshProds();
    }
    else if(a==='brand-toggle'){

      state.marcasOcultas=ocs;

      e.stopPropagation();
      var pact=e.target.closest('.pact'); if(!pact) return;
      var wasOpen=pact.classList.contains('open');
      var openMenus2=document.querySelectorAll('.pact.open'); for(var j=0;j<openMenus2.length;j++) openMenus2[j].classList.remove('open');

    else if(a==='wa-send'){ var bod=act.getAttribute('data-bodega'); if(bod) sendWhatsApp(bod); }

      else if(a==='qminus') changeQty(pid,-1,vid,vcid);
      else if(a==='rmv') removeLine(pid,vid,vcid);
    }
    else if(a==='history'){ closeModal(); openHistory(); }
    else if(a==='users'){ closeModal(); openUsers(); }
    else if(a==='notifs'){ closeModal(); openNotifs(); }
    else if(a==='ne-test'){ testNotif(); }
    else if(a==='ne-save'){ saveNotifs(); }

  /* ---------- notificaciones por email (Web3Forms) ---------- */
  function pedidoToEmailText(order){
    var lines=[];
    lines.push('🛍️ NUEVO PEDIDO');
    lines.push('');
    lines.push('👤 Cliente: '+(order.cliente&&order.cliente.nombre||'(sin nombre)'));
    if(order.cliente&&order.cliente.tel) lines.push('📱 Tel: '+order.cliente.tel);
    if(order.cliente&&order.cliente.direccion) lines.push('📍 Dirección: '+order.cliente.direccion+(order.cliente.ciudad?', '+order.cliente.ciudad:''));
    if(order.cliente&&order.cliente.notas) lines.push('📝 Notas: '+order.cliente.notas);
    if(order.usuarioNombre) lines.push('');
    if(order.usuarioNombre) lines.push('Realizado por: '+order.usuarioNombre);
    lines.push('');
    lines.push('PRODUCTOS:');
    (order.items||[]).forEach(function(it){
      var _extras=[]; if(it.variacionNombre) _extras.push(it.variacionNombre+(it.tipoVariacion||'')); if(it.variacionColorNombre) _extras.push((it.tipoVariacionColor?it.tipoVariacionColor+': ':'')+it.variacionColorNombre);
      lines.push('  • '+it.cantidad+'x '+it.nombre+(_extras.length?' ('+_extras.join(', ')+')':'')+' — '+fmt(it.precio)+' c/u = '+fmt(it.precio*it.cantidad));
    });
    lines.push('');
    lines.push('Unidades: '+order.unidades);
    if(order.mayoristaTotal) lines.push('Mayorista total: '+fmt(order.mayoristaTotal));
    lines.push('TOTAL AL CLIENTE: '+fmt(order.ventaTotal));
    if(order.costoTotal!=null) lines.push('Costo bodegas: '+fmt(order.costoTotal));
    if(order.gananciaTotal!=null) lines.push('Ganancia total: '+fmt(order.gananciaTotal));
    lines.push('');
    lines.push('Fecha: '+new Date(order.fecha||Date.now()).toLocaleString('es-CO'));
    return lines.join('\n');
  }

  async function enviarEmailPedido(order){
    var ne=state.notifEmail||{};
    if(!ne.enabled){ return {skipped:true}; }
    var fromName=(ne.fromName||'VELORA').trim() || 'VELORA';
    // Junto todas las keys: la principal + las adicionales del array keys[]
    var allKeys=[];
    if(ne.accessKey) allKeys.push({label:'principal', key:ne.accessKey});
    (ne.keys||[]).forEach(function(k){
      if(k && k.key && String(k.key).trim()) allKeys.push({label:(k.label||'admin').trim(), key:String(k.key).trim()});
    });
    if(!allKeys.length){ return {skipped:true, reason:'no-keys'}; }
    var subject='🛍️ '+fromName+' — Nuevo pedido — '+((order.cliente&&order.cliente.nombre)||'sin cliente')+' — '+fmt(order.ventaTotal);
    var results=[];
    for(var i=0;i<allKeys.length;i++){
      var body={access_key: allKeys[i].key, subject: subject, from_name: fromName, message: pedidoToEmailText(order)};
      try{
        var r=await fetch('https://api.web3forms.com/submit', {
          method:'POST',
          headers:{'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify(body)
        });
        var j=await r.json().catch(function(){return {};});
        results.push({label:allKeys[i].label, ok:r.ok && j.success!==false, response:j});
      }catch(e){ results.push({label:allKeys[i].label, ok:false, error:String(e)}); }
    }
    var allOk=results.every(function(x){return x.ok;});
    return {ok:allOk, results:results, count:allKeys.length};
  }

  function endTutorial(marcarVisto){
    // Ejecuta onExit del paso actual
    var cur=tutState.steps[tutState.index];
    if(cur && typeof cur.onExit==='function'){ try{ cur.onExit(); }catch(e){} }
    document.querySelectorAll('.tut-overlay, .tut-card, .tut-halo').forEach(function(el){ el.remove(); });
    // Limpieza universal
    tutCleanupDemoCart();
    tutCloseCartPanel();
    tutCloseMenu();
    if(marcarVisto && session){
      var u=state.usuarios.find(function(x){return x.id===session.usuarioId;});
      if(u && !u.tutorialVisto){ u.tutorialVisto=true; scheduleSave(); }
    }
  }
  function renderTutorial(){
    // Ejecuta onExit del paso anterior (si cambió el índice)
    if(tutState.prevIndex>=0 && tutState.prevIndex!==tutState.index){
      var prev=tutState.steps[tutState.prevIndex];
      if(prev && typeof prev.onExit==='function'){ try{ prev.onExit(); }catch(e){} }
    }
    document.querySelectorAll('.tut-overlay, .tut-card, .tut-halo').forEach(function(el){ el.remove(); });
    var step=tutState.steps[tutState.index]; if(!step) return endTutorial(true);
    // Ejecuta onEnter del paso actual
    if(typeof step.onEnter==='function'){ try{ step.onEnter(); }catch(e){} }
    tutState.prevIndex=tutState.index;
    // Overlay pleno SOLO si no hay elemento a resaltar (el halo crea el spotlight cuando hay uno)
    var el = step.sel ? document.querySelector(step.sel) : null;
    if(!el && !step.sel){
      // Solo fondo oscuro cuando no hay ningún elemento a resaltar (paso final)
      var overlay=document.createElement('div'); overlay.className='tut-overlay';
      document.body.appendChild(overlay);
    }
    var card=document.createElement('div'); card.className='tut-card';
    var n=tutState.index+1, tot=tutState.steps.length;
    var isLast=(n===tot);
    var dots=''; for(var i=0;i<tot;i++){ dots += '<span class="dot'+(i===tutState.index?' on':'')+'"></span>'; }
    card.innerHTML=
      '<div class="step">Paso '+n+' de '+tot+' <button class="skip" data-tut="skip">Cerrar tutorial</button></div>'+
      '<h3>'+esc(step.title)+'</h3><p>'+esc(step.body)+'</p>'+
      '<div class="nav">'+
        '<div class="dots">'+dots+'</div>'+
        '<div class="btns">'+
          (tutState.index>0 ? '<button data-tut="prev">Atrás</button>' : '')+
          (isLast ? '<button class="next" data-tut="done">¡Entendido!</button>' : '<button class="next" data-tut="next">Siguiente</button>')+
        '</div>'+
      '</div>';
    document.body.appendChild(card);
    tutState.currentCard=card;
    if(el){
      positionTutHalo(el, card);
    } else {
      // Sin elemento a la primera: intento hasta 3 veces con delay (por si openCart/openMenu tarda)
      if(step.sel){
        var attempts=0;
        var iv=setInterval(function(){
          attempts++;
          var el2=document.querySelector(step.sel);
          if(el2){ clearInterval(iv); positionTutHalo(el2, card); return; }
          if(attempts>=8){ clearInterval(iv); centerCard(card); }
        }, 120);
      } else {
        centerCard(card);
      }
    }
  }
  function centerCard(card){
    card.style.top='50%'; card.style.left='50%'; card.style.transform='translate(-50%,-50%)';
  }
  function positionTutHalo(el, card){
    // Quitar halo anterior si existe
    document.querySelectorAll('.tut-halo').forEach(function(h){ h.remove(); });
    el.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){
      var r=el.getBoundingClientRect();
      var halo=document.createElement('div'); halo.className='tut-halo';
      halo.style.top=(r.top-6)+'px'; halo.style.left=(r.left-6)+'px';
      halo.style.width=(r.width+12)+'px'; halo.style.height=(r.height+12)+'px';
      document.body.appendChild(halo);
      // Posicionar card debajo/arriba/al lado
      var cw=card.offsetWidth||320, ch=card.offsetHeight||160;
      var vw=window.innerWidth, vh=window.innerHeight;
      var top, left;
      if(r.bottom + ch + 20 <= vh){
        top = r.bottom + 16;
        left = Math.min(Math.max(12, r.left), vw - cw - 12);
      } else if(r.top - ch - 20 >= 0){
        top = r.top - ch - 16;
        left = Math.min(Math.max(12, r.left), vw - cw - 12);
      } else {
        top = Math.max(12, (vh - ch)/2);
        left = Math.max(12, (vw - cw)/2);
      }
      card.style.top=top+'px'; card.style.left=left+'px'; card.style.transform='none';
    }, 350);
  }
  function tutNav(dir){

    else if(dir==='prev'){ tutState.index=Math.max(0,tutState.index-1); renderTutorial(); }
    else if(dir==='done'){ endTutorial(true); showToast('¡A vender! 💪',false); }
    else if(dir==='skip'){ endTutorial(true); }
  }

  /* ---------- carrito / pedido ---------- */
  function addToCart(pid, variacion, variacionColor){
    var p=state.productos.find(function(x){return x.id===pid;}); if(!p) return;
    if(typeof p.stock==='number' && p.stock===0 && !isAdmin()){
      showToast('Producto agotado', false); return;
    }
    var hasVarPrecio = Array.isArray(p.variaciones) && p.variaciones.length;
    var hasVarColor = Array.isArray(p.variacionesColor) && p.variacionesColor.length;
    // Si tiene variaciones y no se pasaron todas las necesarias, abrir el selector
    if((hasVarPrecio && !variacion) || (hasVarColor && !variacionColor)){
      openVariacionPicker(p, variacion, variacionColor); return;
    }
    var varId = variacion ? variacion.id : '';
    var varNm = variacion ? variacion.nombre : '';
    var vcId = variacionColor ? variacionColor.id : '';
    var vcNm = variacionColor ? variacionColor.nombre : '';
    var it=currentCart().items.find(function(x){
      return x.productId===pid && (x.variacionId||'')===varId && (x.variacionColorId||'')===vcId;
    });
    if(it){ it.cantidad++; }
    else {
      var b=best(p);
      var line = {productId:pid, bodega:b?b.bodega:'', cantidad:1};
      if(varId){ line.variacionId=varId; line.variacionNombre=varNm; }
      if(vcId){ line.variacionColorId=vcId; line.variacionColorNombre=vcNm; }
      currentCart().items.push(line);
    }
    var extra = [];
    if(varNm) extra.push((p.tipoVariacion||'')+varNm);
    if(vcNm) extra.push(vcNm);
    showToast('Añadido al pedido' + (extra.length?' · '+extra.join(' · '):''), false);
    render(); scheduleSave();
  }

  function openVariacionPicker(p, preVarP, preVarC){
    var varsP = Array.isArray(p.variaciones) ? p.variaciones : [];
    var varsC = Array.isArray(p.variacionesColor) ? p.variacionesColor : [];
    var hasP = varsP.length > 0;
    var hasC = varsC.length > 0;
    if(!hasP && !hasC){ return; }
    var state_pick = { varP: preVarP || null, varC: preVarC || null };

    function section(titulo, vars, kind, tipo){
      var picked = kind==='p' ? state_pick.varP : state_pick.varC;
      return '<div class="vp-section">'+
        '<div class="vp-section-hd">'+esc(titulo)+'</div>'+
        '<div class="var-picker-grid">'+
          vars.map(function(v){
            var thumb = v.imagen
              ? '<img src="'+esc(v.imagen)+'" alt="'+esc(v.nombre)+'">'
              : '<div class="vp-ph">'+(kind==='p'?'⚖️':'🎨')+'</div>';
            var priceInfo = '';
            if(kind==='p'){
              var pv = ventaOf(p, v);
              var pm = mayoristaOf(p, v);
              if(pv > 0){
                priceInfo = '<div class="vp-price">'+fmt(pv)+'</div>';
                if(isAdmin() && pm && pm !== pv) priceInfo += '<div class="vp-mayo">Mayor. '+fmt(pm)+'</div>';
              }
            }
            var isSel = picked && picked.id===v.id;
            var nombreDisplay = kind==='p' ? (v.nombre+(tipo?tipo:'')) : v.nombre;
            return '<button type="button" class="vp-card'+(isSel?' selected':'')+'" data-role="pick-'+kind+'" data-vid="'+esc(v.id)+'">'+
              '<div class="vp-img">'+thumb+'</div>'+
              '<div class="vp-nm">'+esc(nombreDisplay||'(sin nombre)')+'</div>'+
              priceInfo+
            '</button>';
          }).join('')+
        '</div>'+
      '</div>';
    }

    function render(){
      var canConfirm = (!hasP || state_pick.varP) && (!hasC || state_pick.varC);
      host.innerHTML = '<div class="scrim" data-role="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(520px,100%)">'+
        '<div class="modal-hd"><h2>🎨 Elige opciones</h2><button class="mini" data-role="close">×</button></div>'+
        '<div class="modal-bd">'+
          '<p class="hint">Selecciona las opciones para <b>'+esc(p.nombre)+'</b>:</p>'+
          (hasP ? section('💰 Cantidad ('+(p.tipoVariacion||'')+')', varsP, 'p', p.tipoVariacion||'') : '')+
          (hasC ? section('🎨 '+(p.tipoVariacionColor||'Opción'), varsC, 'c', '') : '')+
        '</div>'+
        '<div class="modal-ft">'+
          '<button class="btn ghost" data-role="close">Cancelar</button>'+
          '<button class="btn primary" data-role="confirm"'+(canConfirm?'':' disabled')+'>Agregar al pedido</button>'+
        '</div>'+
      '</div></div>';
      var modal = host.querySelector('.modal');
      modal.querySelectorAll('[data-role="pick-p"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var vid = btn.getAttribute('data-vid');
          state_pick.varP = varsP.find(function(x){return x.id===vid;}) || null;
          render();
        });
      });
      modal.querySelectorAll('[data-role="pick-c"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var vid = btn.getAttribute('data-vid');
          state_pick.varC = varsC.find(function(x){return x.id===vid;}) || null;
          render();
        });
      });
      var conf = modal.querySelector('[data-role="confirm"]');
      if(conf) conf.addEventListener('click', function(){
        if(hasP && !state_pick.varP){ showToast('Elige la cantidad', false); return; }
        if(hasC && !state_pick.varC){ showToast('Elige la opción', false); return; }
        closeModal();
        addToCart(p.id, state_pick.varP, state_pick.varC);
      });
      host.querySelectorAll('[data-role="close"]').forEach(function(b){ b.addEventListener('click', closeModal); });
      host.querySelector('[data-role="scrim"]').addEventListener('mousedown', function(e){ if(e.target===e.currentTarget) closeModal(); });
    }
    render();
  }

  function cartLineHTML(it){
    var p=state.productos.find(function(x){return x.id===it.productId;});
    if(!p) return '';
    var admin=isAdmin();
    var vari = variacionDe(p, it.variacionId);
    var mayo=itemMayorista(it,p); var venta=ventaOf(p, vari);
    var precioReal=itemVenta(it,p);

  // Agrupa los items del pedido por bodega y arma un botón "Enviar a X" por cada una
  function cartByBodega(){
    var map={};
    (currentCart().items||[]).forEach(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}); if(!p) return;
      var vari = variacionDe(p, it.variacionId);
      var vc = costoVariacion(vari);
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p);
      var bodega= b ? b.bodega : (it.bodega||'(sin bodega)');
      if(!map[bodega]) map[bodega]={bodega:bodega, items:[], subCosto:0, unidades:0};
      var costo = (vc!=null) ? vc : (b?b.costo:0);
      map[bodega].items.push({p:p, cantidad:it.cantidad, costo:costo, variacionNombre:it.variacionNombre||'', tipoVariacion: it.variacionId?(p.tipoVariacion||''):'', variacionColorNombre:it.variacionColorNombre||'', tipoVariacionColor: it.variacionColorId?(p.tipoVariacionColor||''):''});
      map[bodega].subCosto += costo*it.cantidad;
      map[bodega].unidades += it.cantidad;
    });
    return Object.keys(map).map(function(k){return map[k];});
  }

  function sendWhatsApp(bodega){
    if(!isAdmin()){ showToast('Solo los admin pueden enviar pedidos a bodegas',false); return; }
    var grupos=cartByBodega();
    var g=grupos.find(function(x){return x.bodega===bodega;});
    if(!g){ showToast('No hay productos de esa bodega',false); return; }
    var tel=state.bodegaTels[bodega]||'';
    if(!tel){
      var v=prompt('WhatsApp de la bodega "'+bodega+'" (10 dígitos si es Colombia, o completo con código de país):', '');
      if(v==null) return;
      v=v.trim(); if(!v) return;
      state.bodegaTels[bodega]=v; tel=v; scheduleSave();
      renderCart();
    }
    var num=normTel(tel);
    if(!num || num.length<10){ showToast('Número inválido — revísalo en Bodegas',false); return; }
    var lines=['Hola! Me gustaría hacer el siguiente pedido:',''];
    g.items.forEach(function(it){
      var sub=(it.costo||0)*it.cantidad;
      var extras = [];
      if(it.variacionNombre) extras.push(it.variacionNombre+(it.tipoVariacion||''));
      if(it.variacionColorNombre) extras.push((it.tipoVariacionColor?it.tipoVariacionColor+': ':'')+it.variacionColorNombre);
      var vext = extras.length ? ' ('+extras.join(', ')+')' : '';
      var linea='• '+it.cantidad+'x '+it.p.nombre+vext;
      if(it.costo>0){
        linea += ' — '+fmt(it.costo)+ (it.cantidad>1 ? ' c/u ('+fmt(sub)+')' : '');
      }
      lines.push(linea);
    });
    lines.push('');
    lines.push('Total unidades: '+g.unidades);
    if(g.subCosto>0) lines.push('*Total: '+fmt(g.subCosto)+'*');
    lines.push('');
    lines.push('¿Me confirmas disponibilidad y forma de pago? Gracias!');
    var txt=lines.join('\n');
    var url='https://wa.me/'+num+'?text='+encodeURIComponent(txt);
    window.open(url,'_blank','noopener');
  }

  function saveCart(){
    var t=cartTotals(); if(!t.lineas){ return; }

    if(session){
      var yo=state.usuarios.find(function(x){return x.id===session.usuarioId;});

        openMiPerfil();
        return;
      }
    }
    var c=currentCart().cliente;
    var nom=(c.nombre||'').trim(), tel=(c.tel||'').trim(), dir=(c.direccion||'').trim(), ciu=(c.ciudad||'').trim(), notas=(c.notas||'').trim();
    // Validación de envío
    var faltan=[];
    if(!nom) faltan.push('nombre del cliente');
    if(!tel) faltan.push('teléfono');
    if(!dir) faltan.push('dirección');
    if(!ciu) faltan.push('ciudad');
    if(faltan.length){
      showToast('Faltan datos de envío: '+faltan.join(', '), false);
      var first={'nombre del cliente':'nombre','teléfono':'tel','dirección':'direccion','ciudad':'ciudad'}[faltan[0]];
      var el=document.querySelector('[data-cli="'+first+'"]'); if(el){ el.focus(); el.style.outline='2px solid var(--bad)'; setTimeout(function(){el.style.outline='';},1500); }
      return;
    }
    var items=currentCart().items.map(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}) || {};
      var vari = variacionDe(p, it.variacionId);
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p) || {};
      var vc = costoVariacion(vari);
      var precioReal=itemVenta(it,p);
      var sug=ventaOf(p, vari);
      return {
        productId:it.productId,
        nombre:p.nombre||'(producto borrado)',
        bodega:it.bodega||(b.bodega||''),
        costo: (vc!=null) ? vc : (b.costo||0),
        mayorista:itemMayorista(it,p),
        precio:precioReal,
        precioSugerido:sug,
        cantidad:it.cantidad,
        variacionId: it.variacionId||'',
        variacionNombre: it.variacionNombre||'',
        tipoVariacion: it.variacionId ? (p.tipoVariacion||'') : '',
        variacionColorId: it.variacionColorId||'',
        variacionColorNombre: it.variacionColorNombre||'',
        tipoVariacionColor: it.variacionColorId ? (p.tipoVariacionColor||'') : ''
      };
    });
    var now=new Date().toISOString();
    var byName = session ? session.usuarioNombre : '';
    var order={
      id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      fecha:now,
      seccion: activeSection || 'maquillaje',
      cliente:{nombre:nom, tel:tel, direccion:dir, ciudad:ciu, notas:notas},
      items:items,
      costoTotal:t.costo, mayoristaTotal:t.mayorista, ventaTotal:t.venta,
      gananciaEmpresa:t.gananciaEmpresa, gananciaTrabajador:t.gananciaTrabajador, gananciaTotal:t.gananciaTotal,
      ganancia:t.gananciaTotal, // legacy
      unidades:t.unidades,
      usuarioId: session?session.usuarioId:'', usuarioNombre: byName,
      estado: { realizado:{at:now, by:byName}, envio:null, venta:null }
    };
    state.pedidos.unshift(order);
    resetCurrentCart();
    closeCart(); render(); scheduleSave();
    showToast(tPed('SG')+' guardad'+(isAdmin()?'a':'o')+' ✓',false);
    // Notificar por email (fire and forget — no bloquea al usuario)
    (function(){
      enviarEmailPedido(order).then(function(res){
        if(res && res.ok) showToast('📧 Notificación enviada',false);
        // Si falla silenciosamente: el pedido igual quedó guardado
      });
    })();
  }

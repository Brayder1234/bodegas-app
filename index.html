<script>
(function(){
  "use strict";

  var CFG_KEY='bm-supabase', THEME_KEY='bm-theme', CACHE_KEY='bm-cache', ROW_ID='main', SESSION_KEY='bm-session', SECTION_KEY='bm-section';
  // Configuración fija de VELORA — Cloudflare Workers KV
  var DEFAULT_CFG={
    url:'https://velora-data.sarmientobrayder10.workers.dev',
    key:'sesion'     // ya no hay llave pública: cada persona entra con su usuario y recibe un token firmado
  };
  // API de las tiendas web (catálogo público + bandeja de pedidos). Worker aparte: velora-tienda
  var TIENDA_URL='https://velora-tienda.sarmientobrayder10.workers.dev';
  // Dirección de la tienda web de cada sección (el vendedor comparte su enlace con ?v=CÓDIGO)
  var SITIOS={calzado:'https://korvenoficial.store'};
  var state={moneda:'COP', bodegas:[], bodegaTels:{}, productos:[], pedido:{items:[],cliente:{nombre:'',tel:''}}, pedidos:[], usuarios:[], carritos:{}, notifEmail:{enabled:true, accessKey:'', destinatario:'', extras:[]}, metaMensual:600000, secciones:[], marcas:[], premioVendedor:0};
  var session=null; // {usuarioId, usuarioNombre, role}
  var cfg=null;              // {url,key}
  var GROUPS_KEY='bm-collapsed';
  var ui={q:'', gen:'', sort:'marca', expanded:{}, collapsed:{}, selectMode:false, selected:{}};
  try{ var _c=JSON.parse(localStorage.getItem(GROUPS_KEY)); if(_c && typeof _c==='object') ui.collapsed=_c; }catch(e){}
  var conn='off';            // off | connecting | ok | saving | err
  var lastServerStamp=null;  // updated_at conocido del servidor
  var dirty=false, saveTimer=null, pollTimer=null;
  var bootstrapping=false;   // esperando el primer pull del servidor

  /* tema */
  try{ var t=localStorage.getItem(THEME_KEY); document.documentElement.setAttribute('data-theme', t||'dark'); }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
  // Sección activa (se elige después del login)
  var activeSection=null;
  try{ activeSection=localStorage.getItem(SECTION_KEY) || null; }catch(e){}
  function setActiveSection(s){
    activeSection=s;
    try{ if(s) localStorage.setItem(SECTION_KEY, s); else localStorage.removeItem(SECTION_KEY); }catch(e){}
  }

  /* ---------- utils ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // Íconos de línea al estilo SF Symbols
  var SF_PATHS={
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
    theme:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>',
    building:'<path d="M4 20.5V6.8L11.5 4v16.5M11.5 9.5h8.5v11M2.5 20.5h19"/><path d="M7.4 8.6v.01M7.4 12.2v.01M7.4 15.8v.01M15 13v.01M17.4 13v.01M15 16.6v.01M17.4 16.6v.01"/>',
    checkcircle:'<circle cx="12" cy="12" r="8.5"/><path d="m8.4 12.3 2.5 2.5 4.8-5.1"/>',
    xmark:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    bag:'<path d="M5.5 8.5h13l-1.1 11a1.5 1.5 0 0 1-1.5 1.3H8.1a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>',
    list:'<rect x="5" y="4.5" width="14" height="16.5" rx="2.5"/><path d="M9 3.5h6v2.8H9zM8.7 11h6.6M8.7 14.5h6.6M8.7 18h3.8"/>',
    trophy:'<path d="M7.8 4h8.4v5.2a4.2 4.2 0 0 1-8.4 0z"/><path d="M7.8 6H5v1.4a3.2 3.2 0 0 0 3.3 3.2M16.2 6H19v1.4a3.2 3.2 0 0 1-3.3 3.2M12 13.4v3.4M8.5 20.5h7M9.6 20.5l.6-3.7h3.6l.6 3.7"/>',
    person:'<circle cx="12" cy="8.3" r="3.6"/><path d="M4.8 20.3c.8-3.7 3.6-5.7 7.2-5.7s6.4 2 7.2 5.7"/>',
    grad:'<path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.6v4.1c1.6 1.4 3.4 2.1 5.5 2.1s3.9-.7 5.5-2.1v-4.1M21.5 9.5v5.2"/>',
    logout:'<path d="M13.5 4.5H7.3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h6.2"/><path d="M10.5 12h10M17.3 8.5 20.8 12l-3.5 3.5"/>',
    people:'<circle cx="9" cy="8.6" r="3.2"/><path d="M3 19.6c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M15.4 5.5a3.1 3.1 0 0 1 0 6.1M17.4 14.8c1.9.6 3.2 2.2 3.6 4.8"/>',
    tag:'<path d="M3.5 12.3V5a1.5 1.5 0 0 1 1.5-1.5h7.3l8.2 8.2a1.5 1.5 0 0 1 0 2.1l-7.2 7.2a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8.1" cy="8.1" r="1.4" fill="currentColor" stroke="none"/>',
    bell:'<path d="M6 16.8V11a6 6 0 0 1 12 0v5.8l1.6 1.6H4.4z"/><path d="M9.8 20.6a2.4 2.4 0 0 0 4.4 0"/>',
    target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
    docdown:'<path d="M13.5 3.5H7.5A1.5 1.5 0 0 0 6 5v14a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 18 19V8z"/><path d="M13.5 3.5V8H18M12 10.8v6.2M9.4 14.4 12 17l2.6-2.6"/>',
    drive:'<rect x="3.5" y="13" width="17" height="7" rx="2.2"/><path d="M12 3.5v7M8.8 7.4 12 10.6l3.2-3.2M7.2 16.5v.01"/>',
    folder:'<path d="M3.5 7.2a2 2 0 0 1 2-2h3.9l2.1 2.4h7a2 2 0 0 1 2 2v7.7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
    link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.1 1.1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.1-1.1"/>',
    power:'<path d="M12 3.5v8"/><path d="M7.1 6.4a7.5 7.5 0 1 0 9.8 0"/>',
    chev:'<path d="m9 5.5 6.5 6.5L9 18.5"/>',
    ellipsis:'<circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeslash:'<path d="M9.9 5.8A9.6 9.6 0 0 1 12 5.5C18 5.5 21.5 12 21.5 12a17 17 0 0 1-2.6 3.4M6.6 7.2C3.9 9 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3.5 3.5l17 17"/>',
    pencil:'<path d="M15.2 4.8a2.1 2.1 0 0 1 3 3L8.4 17.6 4.5 18.9l1.3-3.9z"/><path d="m13.6 6.4 3 3"/>',
    trash:'<path d="M4.5 6.5h15M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M6.5 6.5l.8 12.3a1.8 1.8 0 0 0 1.8 1.7h5.8a1.8 1.8 0 0 0 1.8-1.7l.8-12.3M10 10.5v6M14 10.5v6"/>',
    box:'<path d="M3.8 7.6 12 3.5l8.2 4.1v8.8L12 20.5l-8.2-4.1z"/><path d="M3.8 7.6 12 11.7l8.2-4.1M12 11.7v8.8M7.9 5.5l8.2 4.1"/>'
  };
  function sf(name){ return '<svg class="sf" viewBox="0 0 24 24" aria-hidden="true">'+(SF_PATHS[name]||'')+'</svg>'; }
  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function fmt(n){ if(n==null||isNaN(n)) return '—';
    if(state.moneda==='USD') return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
    return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
  function pct(n){ return (n>=0?'':'−')+Math.abs(Math.round(n))+'%'; }
  function validCostos(p){ return (p.costos||[]).filter(function(c){ return c.bodega && typeof c.costo==='number' && c.costo>0; }); }
  // Stock por tamaño: si alguna variación con precio tiene stock numérico, el stock del producto es la suma
  function varStockOn(p){ return !!(p && Array.isArray(p.variaciones) && p.variaciones.some(function(v){ return typeof v.stock==='number'; })); }
  function colorStockOn(p){ return !!(p && Array.isArray(p.variacionesColor) && p.variacionesColor.some(function(v){ return typeof v.stock==='number'; })); }
  function syncStock(p){
    if(varStockOn(p)) p.stock = p.variaciones.reduce(function(a,v){ return a + (typeof v.stock==='number' ? v.stock : 0); },0);
    else if(colorStockOn(p)) p.stock = p.variacionesColor.reduce(function(a,v){ return a + (typeof v.stock==='number' ? v.stock : 0); },0);
  }
  function valorMercancia(p){
    var b=best(p), base=b?b.costo:0;
    if(varStockOn(p)){
      return p.variaciones.reduce(function(a,v){ var st=(typeof v.stock==='number')?v.stock:0; var c=(typeof v.costo==='number' && v.costo>0)?v.costo:base; return a+st*c; },0);
    }
    return (typeof p.stock==='number' && p.stock>0) ? p.stock*base : 0;
  }
  function best(p){ var v=validCostos(p); if(!v.length) return null; return v.reduce(function(a,b){ return b.costo<a.costo?b:a; }); }
  function comboCostoTotal(p){
    if(!p || p.tipo!=='combo' || !Array.isArray(p.componentes)) return null;
    var total=0, any=false;
    for(var i=0;i<p.componentes.length;i++){
      var c=p.componentes[i];
      var prod=(state.productos||[]).find(function(x){return x.id===c.productoId;});
      if(!prod) continue;
      var b=best(prod);
      if(!b) continue;
      var q=parseFloat(c.cantidad)||1;
      total += b.costo * q; any=true;
    }
    return any ? total : null;
  }
  function bestCostoDe(p){
    if(p && p.tipo==='combo'){ var t=comboCostoTotal(p); return t!=null ? {costo:t, bodega:'combo'} : null; }
    return best(p);
  }
  function marginPct(precio,costo){ if(!precio||precio<=0) return null; return (precio-costo)/precio*100; }
  function mgClass(m){ if(m==null) return ''; if(m>=40) return 'good'; if(m>=20) return 'warn'; return 'bad'; }
  function normUrl(u){ u=(u||'').trim().replace(/\/+$/,''); return u; }
  /* ---------- config ---------- */
  function loadCfg(){
    if(DEFAULT_CFG.url){
      try{ localStorage.setItem(CFG_KEY, JSON.stringify(DEFAULT_CFG)); }catch(e){}
      return DEFAULT_CFG;
    }
    try{ var c=JSON.parse(localStorage.getItem(CFG_KEY)); if(c&&c.url&&c.key) return c; }catch(e){}
    return null;
  }
  function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }
  function cacheState(){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }
    catch(e){ try{ localStorage.removeItem(CACHE_KEY); }catch(x){} }  // no cabe (Safari ~5MB): no dejar una copia vieja ocupando espacio
  }
  function loadCache(){ try{ var s=JSON.parse(localStorage.getItem(CACHE_KEY)); if(s&&s.productos) return s; }catch(e){} return null; }

  /* ---------- Cloudflare Workers KV ---------- */
  var TOKEN_KEY='bm-token';
  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }
  function setToken(t){ try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
  function cfHeaders(){ var h={'Content-Type':'application/json'}; var t=getToken(); if(t) h['Authorization']='Bearer '+t; return h; }
  // la sesión venció o ya no existe: se vuelve a la pantalla de acceso
  function sesionCaducada(){
    clearSession(); stopPolling();
    try{ render(); showToast('Tu sesión terminó. Inicia sesión de nuevo.', false); }catch(e){}
    var e=new Error('401'); e.status=401; throw e;
  }
  async function sbGet(since){
    var r=await fetch(cfg.url+'/data'+(since?'?since='+encodeURIComponent(since):''),{headers:cfHeaders()});
    if(r.status===401) sesionCaducada();
    if(!r.ok) throw new Error('HTTP '+r.status);
    var row=await r.json();
    if(row&&row.unchanged) return row;
    return row&&row.data?row:null;
  }
  /* ---------- fotos y videos fuera del estado ----------
     Antes cada foto viajaba incrustada (base64) dentro de los datos: 13 MB en cada guardado.
     Ahora se sube una sola vez al almacén (/m/<hash>) y en el estado queda la dirección pública. */
  var MEDIA_BASE = TIENDA_URL + '/img/';
  var _mediaOk = (function(){ try{ return JSON.parse(localStorage.getItem('bm-media')||'{}')||{}; }catch(e){ return {}; } })();
  function _mediaPersist(){ try{ var k=Object.keys(_mediaOk); if(k.length>3000){ _mediaOk={}; k.slice(-1500).forEach(function(x){ _mediaOk[x]=1; }); } localStorage.setItem('bm-media', JSON.stringify(_mediaOk)); }catch(e){} }
  async function _sha20(text){
    var b=await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(b).subarray(0,10), function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
  }
  async function _subirMedia(dataUri){
    var h=await _sha20(dataUri);
    if(!_mediaOk[h]){
      var blob=await (await fetch(dataUri)).blob();
      var r=await fetch(cfg.url+'/m/'+h,{method:'PUT',headers:{'Authorization':'Bearer '+getToken(),'Content-Type':blob.type||'image/jpeg'},body:blob});
      if(r.status===401) sesionCaducada();
      if(!r.ok) throw new Error('foto HTTP '+r.status);
      _mediaOk[h]=1; _mediaPersist();
    }
    return MEDIA_BASE+h;
  }
  var _esMedia=function(v){ return typeof v==='string' && v.length>400 && (v.indexOf('data:image/')===0 || v.indexOf('data:video/')===0); };
  async function externalizarMedia(obj){
    var found={};
    (function scan(o){
      if(Array.isArray(o)){ for(var i=0;i<o.length;i++){ if(_esMedia(o[i])) found[o[i]]=1; else if(o[i]&&typeof o[i]==='object') scan(o[i]); } }
      else if(o&&typeof o==='object'){ for(var k in o){ var v=o[k]; if(_esMedia(v)) found[v]=1; else if(v&&typeof v==='object') scan(v); } }
    })(obj);
    var uris=Object.keys(found); if(!uris.length) return 0;
    var map={};
    for(var i=0;i<uris.length;i++) map[uris[i]]=await _subirMedia(uris[i]);
    (function put(o){
      if(Array.isArray(o)){ for(var i=0;i<o.length;i++){ if(_esMedia(o[i])) o[i]=map[o[i]]; else if(o[i]&&typeof o[i]==='object') put(o[i]); } }
      else if(o&&typeof o==='object'){ for(var k in o){ var v=o[k]; if(_esMedia(v)) o[k]=map[v]; else if(v&&typeof v==='object') put(v); } }
    })(obj);
    return uris.length;
  }
  async function sbSave(){
    await externalizarMedia(state);
    var payload={ base:lastServerStamp, state:Object.assign({}, state) };
    var r=await fetch(cfg.url+'/data',{method:'PUT',headers:cfHeaders(),body:JSON.stringify(payload)});
    if(r.status===401) sesionCaducada();
    if(!r.ok){
      var er=new Error('HTTP '+r.status); er.status=r.status;
      try{ er.detalle=(await r.json()).error; }catch(x){}
      throw er;
    }
    var res=await r.json();
    if(res.updated_at) lastServerStamp=res.updated_at;
    // otra persona guardó al mismo tiempo: el servidor unió los dos cambios y devuelve el resultado
    if(res.merged && res.data){ state=sanitize(res.data); cacheState(); return {merged:true}; }
    return {merged:false};
  }

  async function pullFromServer(applyIfNewer){
    try{
      var row=await sbGet(applyIfNewer?lastServerStamp:'');
      if(row && row.unchanged){ return false; }
      if(!row){ if(isAdmin()){ await sbSave(); return true; } return false; }
      if(applyIfNewer && row.updated_at===lastServerStamp && !dirty) return false;
      if(!dirty){
        var d=row.data||row;
        if(d._ts) delete d._ts;
        var serverState=sanitize(d);
        // No reemplazar datos locales con datos vacíos/menores del servidor
        if(state.productos.length>0 && serverState.productos.length===0){
          await sbSave();
          return true;
        }
        state=serverState;
        lastServerStamp=row.updated_at;
        cacheState();
        return true;
      }
      return false;
    }catch(e){ throw e; }
  }
  function sanitize(d){
    d=d||{};
    var pedido=(d.pedido&&typeof d.pedido==='object')?d.pedido:{items:[],cliente:{nombre:'',tel:'',direccion:'',ciudad:'',notas:''}};
    if(!Array.isArray(pedido.items)) pedido.items=[];
    if(!pedido.cliente||typeof pedido.cliente!=='object') pedido.cliente={nombre:'',tel:'',direccion:'',ciudad:'',notas:''};
    if(pedido.cliente.direccion==null) pedido.cliente.direccion='';
    if(pedido.cliente.ciudad==null) pedido.cliente.ciudad='';
    if(pedido.cliente.notas==null) pedido.cliente.notas='';
    var ne=d.notifEmail && typeof d.notifEmail==='object' ? d.notifEmail : {};
    return {
      moneda:d.moneda||'COP',
      bodegas:Array.isArray(d.bodegas)?d.bodegas:[],
      bodegaTels:(d.bodegaTels&&typeof d.bodegaTels==='object')?d.bodegaTels:{},
      bodegasPorSeccion:(function(){
        var b = (d.bodegasPorSeccion && typeof d.bodegasPorSeccion==='object') ? d.bodegasPorSeccion : null;
        if(b) return b;
        // Migración: todas las bodegas existentes se asignan a maquillaje (la sección histórica)
        return {maquillaje: Array.isArray(d.bodegas)?d.bodegas.slice():[]};
      })(),
      productos:(Array.isArray(d.productos)?d.productos:[]).map(function(p){
        p.tipo = (p.tipo==='combo'||p.tipo==='extra') ? p.tipo : 'normal';
        p.componentes = Array.isArray(p.componentes) ? p.componentes : [];
        if(p.stock === undefined) p.stock = null;
        else if(p.stock !== null){
          var n = parseInt(p.stock, 10);
          p.stock = isNaN(n) ? null : Math.max(0, n);
        }
        if(!p.seccion) p.seccion = 'maquillaje';
        if(!Array.isArray(p.variaciones)) p.variaciones = [];
        if(!p.tipoVariacion) p.tipoVariacion = '';
        if(!Array.isArray(p.videos)) p.videos = [];
        if(!Array.isArray(p.variacionesColor)) p.variacionesColor = [];
        if(!p.tipoVariacionColor) p.tipoVariacionColor = '';
        // Migración: si tipoVariacion es visual (Color/Talla/Tono/Colores/Tallas/Tonos), mover a variacionesColor
        var VISUAL = ['Color','Colores','Talla','Tallas','Tono','Tonos'];
        if(p.tipoVariacion && VISUAL.indexOf(p.tipoVariacion) >= 0 && p.variaciones.length){
          p.tipoVariacionColor = (p.tipoVariacion === 'Tono' || p.tipoVariacion === 'Tonos') ? 'Color' : (p.tipoVariacion.replace(/s$/,''));
          if(p.tipoVariacionColor !== 'Color' && p.tipoVariacionColor !== 'Talla') p.tipoVariacionColor = 'Color';
          p.variacionesColor = p.variaciones.map(function(v){ return {id:v.id, nombre:v.nombre, imagen:v.imagen||''}; });
          p.variaciones = []; p.tipoVariacion = '';
        }
        // Migración: si tipoVariacion es ml/gr/Otro (con precio), se queda en variaciones
        // Normalizar tipoVariacion a solo ml/gr/'' (Otro ya no soportado)
        if(p.tipoVariacion && p.tipoVariacion !== 'ml' && p.tipoVariacion !== 'gr'){
          // Si es "Otro" o cualquier custom, mantenerlo (usuario avanzado)
        }
        return p;
      }),
      liquidaciones:(Array.isArray(d.liquidaciones)?d.liquidaciones:[]),   // pagos de comisiones a vendedores
      pedido:pedido, // legado (compatibilidad)
      pedidos:(Array.isArray(d.pedidos)?d.pedidos:[]).map(function(o){
        if(!o.seccion) o.seccion = 'maquillaje';
        return o;
      }),
      usuarios:(Array.isArray(d.usuarios)?d.usuarios:[]).map(function(u){
        u.cedula = u.cedula || '';
        u.telefono = u.telefono || '';
        u.correo = u.correo || '';
        u.cuentaPago = u.cuentaPago || '';
        u.foto = (typeof u.foto==='string' && (u.foto.indexOf('data:image/')===0 || /^https:\/\/[^\s"'<>]+$/.test(u.foto))) ? u.foto : '';
        u.tutorialVisto = u.tutorialVisto || false;
        // Trabajadores: array de secciones (ids). Admin no se filtra por sección.
        if(!Array.isArray(u.secciones)){
          u.secciones = u.role==='admin' ? [] : ['maquillaje'];
        }
        return u;
      }),
      carritos:(d.carritos&&typeof d.carritos==='object')?d.carritos:{},
      metaMensual: (typeof d.metaMensual==='number' && d.metaMensual>0) ? d.metaMensual : 600000,
      metaPersonal: (typeof d.metaPersonal==='number' && d.metaPersonal>0) ? d.metaPersonal : 0,   // 0 = usar la meta mensual de siempre
      metasSeccion: (d.metasSeccion && typeof d.metasSeccion==='object') ? d.metasSeccion : {},       // { calzado:{equipo,personal}, maquillaje:{...} }
      marcasOcultas: Array.isArray(d.marcasOcultas) ? d.marcasOcultas : [],

  async function hashPwd(password, saltB64){

  // Recorta al centro en cuadrado y comprime (≈15-25 KB) para no llenar el almacenamiento
  function fotoPerfilDataURL(file){
    return new Promise(function(resolve, reject){
      if(!file || !/^image\//.test(file.type)){ reject(new Error('no es imagen')); return; }
      var rd=new FileReader();
      rd.onerror=function(){ reject(new Error('error leyendo')); };
      rd.onload=function(){
        var img=new Image();
        img.onerror=function(){ reject(new Error('imagen inválida')); };
        img.onload=function(){
          var side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=(img.height-side)/2, N=256;
          var cv=document.createElement('canvas'); cv.width=N; cv.height=N;
          var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,N,N);
          cx.drawImage(img,sx,sy,side,side,0,0,N,N);
          try{ resolve(cv.toDataURL('image/jpeg',0.82)); }catch(e){ reject(e); }
        };
        img.src=rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  // Helpers de precios de producto (con fallback si el mayorista aún no está fijado)
  function variacionDe(p, vid){

  function mayoristaOf(p, vari){
    if(vari){
      var vm=parseFloat(vari.precioMayorista);

      var vv=parseFloat(vari.precioVenta);
      if(!isNaN(vv) && vv>0) return vv;
    }
    var m=parseFloat(p&&p.precioMayorista);
    return (!isNaN(m)&&m>0)?m:(p&&p.precioVenta ? +p.precioVenta : 0);
  }
  function ventaOf(p, vari){
    if(vari){

  async function commit(){

      var rs=await sbSave();

        // el servidor rechazó el cambio (por seguridad): no se reintenta en bucle

  }

  /* ---------- ajuste de stock por pedido ---------- */
  // sign: -1 al crear pedido (descuenta), +1 al eliminar (repone)
  function ajustarStockPorPedido(order, sign){
    if(!order || !Array.isArray(order.items)) return;
    order.items.forEach(function(it){
      var p = state.productos.find(function(x){ return x.id === it.productId; });
      if(!p) return;
      // Solo ajustar productos que manejan stock (no null)
      if(typeof p.stock !== 'number') return;
      var cant = parseInt(it.cantidad, 10) || 0;
      if(!cant) return;
      // Si es combo, descontar el stock de cada componente
      if(p.tipo === 'combo' && Array.isArray(p.componentes) && p.componentes.length){
        p.componentes.forEach(function(c){
          var comp = state.productos.find(function(x){ return x.id === c.productoId; });
          if(!comp || typeof comp.stock !== 'number') return;
          var q = (parseInt(c.cantidad,10)||1) * cant;
          comp.stock = Math.max(0, comp.stock + (sign * q));
        });
      } else if(varStockOn(p) && it.variacionId){
        var v = p.variaciones.find(function(x){ return x.id === it.variacionId; });
        if(v){ v.stock = Math.max(0, (typeof v.stock==='number' ? v.stock : 0) + (sign * cant)); syncStock(p); }
        else p.stock = Math.max(0, p.stock + (sign * cant));
      } else if(colorStockOn(p) && it.variacionColorId){
        var vc = p.variacionesColor.find(function(x){ return x.id === it.variacionColorId; });
        if(vc){ vc.stock = Math.max(0, (typeof vc.stock==='number' ? vc.stock : 0) + (sign * cant)); syncStock(p); }
        else p.stock = Math.max(0, p.stock + (sign * cant));
      } else {
        p.stock = Math.max(0, p.stock + (sign * cant));
      }
    });
  }

  // Admin principal: siempre empresa. Quien hizo la venta (trabajador o admin de sección): su propia ganancia.
  function vistaAdminDe(o){ return isAdmin() && !(session && o.usuarioId && o.usuarioId===session.usuarioId && !isSuper()); }
  function vendedorDe(o){ return o && o.usuarioId ? (state.usuarios||[]).find(function(x){ return x.id===o.usuarioId; }) || null : null; }
  function hayGananciaVendedor(o){ var u=vendedorDe(o); return !!u && (u.role==='trabajador' || (o.origen==='web' && !!o.codigoVendedor)); }
  function gananciaAdminAll(list){ return list.reduce(function(a,o){return a+gananciaAdminDe(o);},0); }
  // Solo cuentan las ventas con pago confirmado
  function gananciaAdminConfirmada(list){
    return list.reduce(function(a,o){ ensureEstado(o); return a + (o.estado.venta && pedidoValido(o) ? gananciaAdminDe(o) : 0); },0);
  }
  function gananciaAdminPendiente(list){
    return list.reduce(function(a,o){ ensureEstado(o); return a + (o.estado.venta || !pedidoValido(o) ? 0 : gananciaAdminDe(o)); },0);
  }

  /* ---------- resumen ---------- */
  function summary(){
    var margins=[], low=0;
    var prods = productosDeSeccion();
    prods.forEach(function(p){ var b=best(p); if(b){ var m=marginPct(p.precioVenta,b.costo); if(m!=null){ margins.push(m); if(m<20) low++; } } });
    var avg=margins.length?margins.reduce(function(a,b){return a+b;},0)/margins.length:null;
    var merc=0, mercUd=0;
    prods.forEach(function(p){ if(typeof p.stock==='number' && p.stock>0){ merc+=valorMercancia(p); mercUd+=p.stock; } });
    // Trabajadores: solo cuentan los productos de marcas habilitadas (las ocultas no se ven)
    var nVisibles = prods.length;
    if(!isAdmin()){
      var ocU=(state.marcasOcultas||[]).map(function(x){return String(x).trim().toUpperCase();});
      nVisibles = prods.filter(function(p){ return ocU.indexOf(String(p.marca||'').trim().toUpperCase())<0; }).length;
    }
    return {nprod:nVisibles, nbod:bodegasDeSeccion().length, avg:avg, low:low, merc:merc, mercUd:mercUd};
  }

  /* ---------- render principal ---------- */
  var app=document.getElementById('app');

  function applyRoleClass(){
    document.body.classList.remove('role-admin','role-trabajador');
    if(session) document.body.classList.add('role-'+(myRole()||session.role));
  }
  function render(){
    applyRoleClass();
    if(!cfg){ cfg=DEFAULT_CFG; }
    if(bootstrapping){ renderBootSplash(); return; }
    if(!session){ renderLogin(); return; }
    if(state.usuarios.length && activeSection){
      var meSec=myUser();
      if(meSec && Array.isArray(meSec.secciones) && (!isAdmin() || meSec.secciones.length) && meSec.secciones.indexOf(activeSection)<0) setActiveSection(null);
    }
    if(!activeSection){
      var secs=state.secciones||[];
      if(!secs.length && !state.usuarios.length){ renderBootSplash(); return; }
      if(isScopedAdmin()){
        var permitidas=secs.filter(function(x){ return adminScope().indexOf(x.id)>=0; });
        if(permitidas.length===1){ setActiveSection(permitidas[0].id); }
        else { renderSectionPicker(); return; }
      } else if(!isAdmin() && secs.length){ renderSectionPicker(); return; }
      else if(secs.length===1){ setActiveSection(secs[0].id); }
      else if(secs.length===0){ setActiveSection('maquillaje'); }

    // valida que el usuario sigue existiendo (por si otro admin lo borró)
    // Solo validar si ya hay usuarios cargados (no durante bootstrap)
    if(state.usuarios.length && !state.usuarios.find(function(u){return u.id===session.usuarioId;})){
      clearSession(); renderLogin(); return;
    }
    var s=summary();
    var admin=isAdmin();
    app.innerHTML=
      '<div class="wrap">'+
        header(s)+
        (function(){
          if(!session) return '';
          var yo=state.usuarios.find(function(x){return x.id===session.usuarioId;});

          return '<div class="perfil-alert" data-act="mi-perfil">'+
            '<div><b>⚠ Completa tu perfil antes de poder guardar pedidos</b><div style="font-size:12.5px;margin-top:2px;opacity:.9">Faltan: '+esc(falt.join(', '))+'</div></div>'+
            '<span style="font-size:12.5px;font-weight:700">Completar ›</span>'+
          '</div>';
        })()+
        metaWidgetHTML()+
        '<div class="toolbar">'+
          '<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>'+
            '<input type="search" id="q" placeholder="Buscar producto, SKU o bodega…" value="'+esc(ui.q)+'"></div>'+
          (productosDeSeccion().some(function(p){ return generoDe(p); })?'<select class="sort" id="gen"><option value="">Mujer y hombre</option><option value="Mujer"'+(ui.gen==='Mujer'?' selected':'')+'>Solo mujer</option><option value="Hombre"'+(ui.gen==='Hombre'?' selected':'')+'>Solo hombre</option></select>':'')+
          '<select class="sort" id="sort">'+opt('marca','Agrupado por marca')+opt('nombre','Ordenar: Nombre A→Z')+ (admin?(opt('margen','Ordenar: Mejor margen')+opt('costo','Ordenar: Menor costo')):'') +opt('precio','Ordenar: Mayor precio')+'</select>'+
          (admin?'<button class="btn ghost tb-icon" data-act="bodegas" title="Bodegas" aria-label="Bodegas">'+sf('building')+'<span class="lbl">Bodegas</span></button>':'')+
          (admin?'<button class="btn ghost tb-icon'+(ui.selectMode?' on':'')+'" data-act="toggle-select" title="'+(ui.selectMode?'Salir de selección':'Seleccionar')+'" aria-label="'+(ui.selectMode?'Salir de selección':'Seleccionar')+'">'+(ui.selectMode?sf('xmark')+'<span class="lbl">Salir</span>':sf('checkcircle')+'<span class="lbl">Seleccionar</span>')+'</button>':'')+
          (admin?'<button class="btn primary tb-icon tb-new" data-act="new" title="Nuevo producto" aria-label="Nuevo producto">'+sf('plus')+'<span class="lbl">Producto</span></button>':'')+
        '</div>'+
        '<div id="prods">'+productsHTML()+'</div>'+
      '</div>'+ fabCartHTML() + selectionBarHTML();
    pingActividad();
    // la animación de entrada solo corre la primera vez (no en cada actualización de la pantalla)
    if(!document.documentElement.classList.contains('bl-anim-done')) setTimeout(function(){ document.documentElement.classList.add('bl-anim-done'); }, 1400);
  }
  function cartTotals(){
    var items=(currentCart().items||[]); var totC=0,totM=0,totV=0,units=0;
    items.forEach(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;}); if(!p) return;
      var vari = variacionDe(p, it.variacionId);
      var vc = costoVariacion(vari);
      var b=(p.costos||[]).find(function(c){return c.bodega===it.bodega;}) || best(p);
      var cst = (vc!=null) ? vc : (b?b.costo:0);
      totC+= (cst||0)*it.cantidad;
      totM+= itemMayorista(it,p)*it.cantidad;
      totV+= itemVenta(it,p)*it.cantidad;
      units+=it.cantidad;
    });
    return {
      costo:totC, mayorista:totM, venta:totV,
      // ganancia depende del rol: trabajador gana venta-mayorista; admin visualiza empresa (mayorista-costo bodega) + total (venta-costo)
      gananciaTrabajador: totV-totM,
      gananciaEmpresa: totM-totC,
      gananciaTotal: totV-totC,
      ganancia: isAdmin()? (totV-totC) : (totV-totM),
      unidades:units, lineas:items.length
    };
  }
  function fabCartHTML(){
    var t=cartTotals();
    if(!t.lineas) return '';
    return '<button class="fab-cart" data-act="open-cart" title="Ver pedido">'+
      sf('bag')+' <span class="badge">'+t.lineas+'</span> Pedido <span class="totmini">'+fmt(t.venta)+'</span></button>';
  }
  function selectedCount(){ return Object.keys(ui.selected||{}).filter(function(k){return ui.selected[k];}).length; }
  function selectionBarHTML(){
    if(!ui.selectMode || !isAdmin()) return '';
    var n = selectedCount();
    return '<div class="sel-bar">'+
      '<div class="sel-count"><b>'+n+'</b> seleccionado'+(n===1?'':'s')+'</div>'+
      '<button class="btn ghost" data-act="sel-all">Todos visibles</button>'+
      '<button class="btn ghost" data-act="sel-none">Ninguno</button>'+
      '<button class="btn danger" data-act="sel-del"'+(n===0?' disabled':'')+'>🗑 Eliminar ('+n+')</button>'+
    '</div>';
  }

  function header(s){
    var alertZero=s.low===0?' zero':'';
    var admin=isAdmin();
    var whoIni=(session && session.usuarioNombre) ? session.usuarioNombre.charAt(0).toUpperCase() : '?';
    var whoLine='<button class="who-chip'+(admin?' admin':'')+'" data-act="who" title="Cerrar sesión">'+
      (function(){ var me=session?userById(session.usuarioId):null; return (me && me.foto) ? '<span class="avat" style="padding:0;overflow:hidden;background:none"><img src="'+esc(me.foto)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></span>' : '<span class="avat">'+esc(whoIni)+'</span>'; })()+esc(session?session.usuarioNombre:'')+
      ' <span class="role">'+(admin?'admin':'trabajador')+'</span>'+
    '</button>';
    var secActiva = (state.secciones||[]).find(function(x){return x.id===activeSection;}) || {nombre:activeSection||'', emoji:''};
    var leadEmoji = secActiva.emoji || '📦';
    var lead = 'Sección · ' + (secActiva.nombre || 'Sin nombre');
    var statsHTML;
    if(admin){
      var mes=new Date().toISOString().slice(0,7);
      var pedsSec=pedidosValidosDeSeccion();
      var pedMes=pedsSec.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
      var gTot=gananciaAdminConfirmada(pedsSec);
      var gPend=gananciaAdminPendiente(pedsSec);
      var nTrab=trabajadoresSoloDe(activeSection||'maquillaje').length;
      function bigStat(k,v,cls){
        return '<div class="stat '+(cls||'')+'"><div class="rail" style="background:var(--good)"></div>'+
          '<div class="k">'+esc(k)+'</div>'+
          '<div class="v num" style="color:var(--good); font-size:22px">'+esc(v)+'</div></div>';
      }
      statsHTML='<div class="stats">'+
        stat('Productos',s.nprod)+
        stat('Ventas ('+pedMes.length+' mes)', pedsSec.length)+
        stat('Trabajadores', nTrab)+
        bigStat('Valor de mercancía (costo)', fmt(s.merc))+
        bigStat('Mi ganancia total', fmt(gTot))+
      '</div>'+
      '<div class="hint stat-notes">'+
        '<span>🏬 '+s.nbod+' bodegas</span>'+
        '<span>📦 '+s.mercUd+' unidades en inventario</span>'+
        (s.avg!=null?'<span>margen prom. '+pct(s.avg)+'</span>':'')+
        (s.low>0?'<span style="color:var(--bad)">⚠ '+s.low+' con margen bajo</span>':'<span style="color:var(--good)">✓ sin productos con margen bajo</span>')+
        (gPend>0?'<span style="color:var(--warn)">⏳ Pendiente de pago: <b>'+fmt(gPend)+'</b></span>':'')+
      '</div>';
    }else{
      // trabajador: productos, pedidos este mes, ganancia este mes (solo de esta sección)
      var mine=pedidosValidosDeSeccion().filter(function(o){return o.usuarioId===session.usuarioId;});
      var mes=new Date().toISOString().slice(0,7);
      var mineMes=mine.filter(function(o){return (o.fecha||'').slice(0,7)===mes;});
      function gTrabDe(o){ if(o.gananciaTrabajador!=null) return o.gananciaTrabajador; return (o.ventaTotal||0)-(o.mayoristaTotal||0); }
      // Solo suma la ganancia cuando el admin confirma el pago (estado.venta)
      var pagadosMes=mineMes.filter(function(o){ ensureEstado(o); return !!o.estado.venta; });
      var pendMes=mineMes.filter(function(o){ ensureEstado(o); return !o.estado.venta; });
      var ganMes=pagadosMes.reduce(function(a,o){return a+gTrabDe(o);},0);
      var ganPend=pendMes.reduce(function(a,o){return a+gTrabDe(o);},0);
      statsHTML='<div class="stats">'+stat('Productos',s.nprod)+stat('Pedidos (este mes)',mineMes.length)+stat('Ganancia (este mes)',fmt(ganMes))+'</div>';
      if(ganPend>0){
        statsHTML += '<div class="hint stat-notes">'+
          '<span style="color:var(--warn)">⏳ Por confirmar pago: <b>'+fmt(ganPend)+'</b> ('+pendMes.length+' pedido'+(pendMes.length===1?'':'s')+')</span>'+
        '</div>';
      }
    }
    var cambiarBtn = (isScopedAdmin() && adminScope().length<2) ? '' : '<button class="change-sect" data-act="change-section" title="Cambiar de sección">Cambiar</button>';
    return '<div class="top in-top">'+
      '<div class="in-bar">'+blLogo()+
        '<div class="top-tools">'+
          '<button class="hamburger" data-act="menu" title="Menú" aria-label="Menú">'+sf('menu')+'</button>'+
          actLiveHTML()+whoLine+connHTML()+
          (isSuper()?'<button class="icon-btn" data-act="toggle-moneda" title="Cambiar moneda">'+(state.moneda==='USD'?'US$':'COP')+'</button>':'')+
          '<button class="icon-btn" data-act="toggle-theme" title="Tema claro/oscuro" aria-label="Cambiar tema">'+sf('theme')+'</button>'+
        '</div></div>'+
      '<div class="brand"><div class="in-eyebrow"><span>'+esc(lead)+'</span>'+cambiarBtn+'</div>'+
        '<h1>'+esc((secActiva.marca||secActiva.nombre||'').toUpperCase())+(secActiva.sublabel?' <span class="sub">'+esc(secActiva.sublabel)+'</span>':'')+'</h1></div>'+
    '</div>'+ statsHTML;
  }
  function stat(k,v){ return '<div class="stat"><div class="rail"></div><div class="k">'+esc(k)+'</div><div class="v num">'+esc(v)+'</div></div>'; }
  /* género del producto: el que se eligió, o se deduce de las tallas (36–39 mujer, 40–44 hombre) */
  function nomVarColor(v){ return v ? ((v.genero?v.genero+' · ':'')+(v.nombre||'')) : ''; }
  function generoDe(p){
    if(p && (p.genero==='Mujer'||p.genero==='Hombre'||p.genero==='Unisex'||p.genero==='Ambos')) return p.genero;
    var n=((p&&p.variacionesColor)||[]).filter(function(v){ return /^\d{2}$/.test(String(v.nombre||'').trim()); }).map(function(v){ return parseInt(v.nombre,10); });
    if(!n.length || n.length!==(p.variacionesColor||[]).length) return '';
    return Math.max.apply(null,n)<=39?'Mujer':(Math.min.apply(null,n)>=40?'Hombre':'Unisex');
  }
  function opt(v,label){ return '<option value="'+v+'"'+(ui.sort===v?' selected':'')+'>'+esc(label)+'</option>'; }

  function productosDeSeccion(){
    var sec = activeSection || 'maquillaje';
    return (state.productos||[]).filter(function(p){ return (p.seccion||'maquillaje') === sec; });
  }
  function pedidosDeSeccion(){
    var sec = activeSection || 'maquillaje';
    return (state.pedidos||[]).filter(function(o){ return (o.seccion||'maquillaje') === sec; });
  }
  function trabajadoresDeSeccion(){
    var sec = activeSection || 'maquillaje';
    return (state.usuarios||[]).filter(function(u){
      if(u.role==='admin') return true; // admin ve todo pero no cuenta como trabajador de sección
      var arr = Array.isArray(u.secciones) ? u.secciones : ['maquillaje'];
      return arr.indexOf(sec) >= 0;
    });
  }
  function trabajadoresSoloDe(sec){
    return (state.usuarios||[]).filter(function(u){
      if(u.role==='admin') return false;
      var arr = Array.isArray(u.secciones) ? u.secciones : ['maquillaje'];
      return arr.indexOf(sec) >= 0;
    });
  }
  function bodegasDeSeccion(){
    var sec = activeSection || 'maquillaje';
    if(!state.bodegasPorSeccion) state.bodegasPorSeccion = {};
    if(!Array.isArray(state.bodegasPorSeccion[sec])) state.bodegasPorSeccion[sec] = [];
    return state.bodegasPorSeccion[sec];
  }
  function ensureBodegaEnSeccion(bod){
    var sec = activeSection || 'maquillaje';
    if(!bod) return;
    if(!state.bodegasPorSeccion) state.bodegasPorSeccion = {};
    if(!Array.isArray(state.bodegasPorSeccion[sec])) state.bodegasPorSeccion[sec] = [];
    if(state.bodegasPorSeccion[sec].indexOf(bod)<0) state.bodegasPorSeccion[sec].push(bod);
    // Espejo en state.bodegas global por compat (unión de todas)
    if(Array.isArray(state.bodegas) && state.bodegas.indexOf(bod)<0) state.bodegas.push(bod);
  }
  function filtered(){
    var q=ui.q.trim().toLowerCase();
    var base = productosDeSeccion();
    if(ui.gen) base=base.filter(function(p){ var g=generoDe(p); return g===ui.gen || g==='Unisex' || g==='Ambos'; });
    var list=base.filter(function(p){ if(!q) return true;
      var hay=(p.nombre||'')+' '+(p.sku||'')+' '+(p.marca||'')+' '+(p.costos||[]).map(function(c){return c.bodega;}).join(' ');
      return hay.toLowerCase().indexOf(q)>=0; });
    if(ui.sort==='marca'){
      // conserva el orden natural del array (por marca en el que se agregaron)
      return list;
    }
    list.sort(function(a,b){
      if(ui.sort==='nombre') return (a.nombre||'').localeCompare(b.nombre||'','es');
      if(ui.sort==='precio') return (b.precioVenta||0)-(a.precioVenta||0);
      if(ui.sort==='costo'){ var ca=best(a),cb=best(b); return (ca?ca.costo:Infinity)-(cb?cb.costo:Infinity); }
      if(ui.sort==='margen'){ var ma=best(a)?marginPct(a.precioVenta,best(a).costo):-Infinity; var mb=best(b)?marginPct(b.precioVenta,best(b).costo):-Infinity; return (mb==null?-Infinity:mb)-(ma==null?-Infinity:ma); }
      return 0; });
    return list;
  }
  function productsHTML(){
    var admin = isAdmin();
    var list=filtered();
    var secProds = productosDeSeccion();
    var newBrandBtn = admin ? '<button class="btn ghost brand-add-btn" data-act="brand-new" style="max-width:520px;margin:12px auto 0;display:flex">＋ Nueva marca</button>' : '';
    if(!secProds.length){
      return '<div class="empty"><div class="em-ic">📦</div><h3>Todavía no hay productos en esta sección</h3><p>Agrega tu primer producto o crea las marcas primero para organizarlo mejor.</p>'+
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px">'+
          (admin?'<button class="btn primary" data-act="new">'+sf('plus')+'Agregar producto</button>':'')+
          (admin?'<button class="btn ghost" data-act="brand-new">＋ Nueva marca</button>':'')+
        '</div>'+
      '</div>';
    }
    if(!list.length){
      return '<div class="empty"><div class="em-ic">🔍</div><h3>Sin resultados</h3><p>Ningún producto coincide con "'+esc(ui.q)+'".</p></div>'+ newBrandBtn;
    }
    // Agrupar por marca: primero el orden de state.marcas, luego "SIN MARCA" y las que no estén registradas
    var groups=[]; var byName={};
    var marcasReg = marcasDeSeccion().slice();
    var admin0 = isAdmin();
    marcasReg.forEach(function(m){ var g={marca:m, items:[]}; byName[marcaUpper(m)]=g; groups.push(g); });
    list.forEach(function(p){
      var mRaw=(p.marca||'').trim();
      var key = mRaw ? marcaUpper(mRaw) : '';
      if(mRaw && byName[key]){ byName[key].items.push(p); return; }
      if(mRaw){
        if(!byName[key]){ byName[key]={marca:mRaw, items:[]}; groups.push(byName[key]); }
        byName[key].items.push(p);
      }else{
        if(!byName['__sin__']){ byName['__sin__']={marca:'SIN MARCA', items:[]}; groups.push(byName['__sin__']); }
        byName['__sin__'].items.push(p);
      }
    });
    // Para trabajador: ocultar marcas vacías. Para admin: mostrarlas para que las pueda editar/asignar.
    if(!admin0) groups = groups.filter(function(g){ return g.items.length>0; });
    // Ocultar "SIN MARCA" si está vacía siempre
    groups = groups.filter(function(g){ return g.marca!=='SIN MARCA' || g.items.length>0; });
    // Filtrar marcas ocultas SOLO para trabajadores
    var admin=isAdmin();
    var ocultas = (state.marcasOcultas||[]).map(function(x){return String(x).toUpperCase();});
    var totalGroups = groups.length;
    var hiddenCount = 0;
    if(!admin){
      var visibles=[];
      groups.forEach(function(g){
        if(ocultas.indexOf(String(g.marca).toUpperCase())>=0) hiddenCount++;
        else visibles.push(g);
      });
      groups=visibles;
    }
    // Auto-expandir cuando se busca; si no, respetar preferencia guardada
    var searching=!!ui.q.trim();
    var listHTML=groups.map(function(g){
      var isHidden = admin && ocultas.indexOf(String(g.marca).toUpperCase())>=0;
      var collapsed = !searching && ui.collapsed[g.marca];
      var margenes=g.items.map(function(p){var b=best(p); return b?marginPct(p.precioVenta,b.costo):null;}).filter(function(x){return x!=null;});
      var avg=margenes.length?Math.round(margenes.reduce(function(a,b){return a+b;},0)/margenes.length):null;
      var isVirtual = g.marca==='SIN MARCA';
      var adminBtns = (admin && !isVirtual) ? (
        '<div class="pact pg-more">'+
          '<button class="pg-more-btn" data-act="row-menu" title="Opciones de la marca" aria-label="Opciones de '+esc(g.marca)+'">'+sf('ellipsis')+'</button>'+
          '<div class="menu">'+
            '<button data-act="brand-toggle" data-marca="'+esc(g.marca)+'"><span>'+(isHidden?'Mostrar a trabajadores':'Ocultar a trabajadores')+'</span>'+sf(isHidden?'eye':'eyeslash')+'</button>'+
            '<button data-act="brand-rename" data-marca="'+esc(g.marca)+'"><span>Renombrar</span>'+sf('pencil')+'</button>'+
            '<button class="del" data-act="brand-del" data-marca="'+esc(g.marca)+'"><span>Eliminar marca</span>'+sf('trash')+'</button>'+
          '</div>'+
        '</div>'
      ) : '';
      return '<div class="pgroup'+(collapsed?' collapsed':'')+(isHidden?' hidden-brand':'')+'" data-marca="'+esc(g.marca)+'">'+
        '<div class="pg-hdr" data-act="tg-group">'+

  function expandedHTML(p){
    var b=best(p);
    var costos=(p.costos||[]).slice().sort(function(x,y){return (x.costo||Infinity)-(y.costo||Infinity);});
    var body='';
    if(p.imagen){
      body += '<button class="btn ghost pimg-dl" data-act="dl-img" data-pid="'+esc(p.id)+'">⬇ Descargar imagen</button>';
    }
    if(session && SITIOS[p.seccion||activeSection] && (userById(session.usuarioId)||{}).codigo && p.tipo!=='combo'){
      body += '<button class="btn primary pimg-dl" data-act="share-prod" data-pid="'+esc(p.id)+'" style="margin-left:6px">📲 Compartir con mi enlace</button>';
    }
    if(p.tipo==='combo'){
      var comps = Array.isArray(p.componentes)?p.componentes:[];
      if(!comps.length){
        body += '<div class="note">Combo sin productos incluidos. Toca <b>✎ Editar</b> para agregar sus componentes.</div>';
      }else{
        body += '<div class="combo-list-hd">🎁 Productos incluidos</div>';
        body += '<div class="combo-list">' + comps.map(function(c){
          var prod=(state.productos||[]).find(function(x){return x.id===c.productoId;});
          if(!prod) return '<div class="combo-item missing">Producto eliminado (×'+(c.cantidad||1)+')</div>';
          var thumb = prod.imagen ? '<img src="'+esc(prod.imagen)+'" alt="">' : '<span class="ph">📦</span>';
          return '<div class="combo-item"><span class="ci-thumb">'+thumb+'</span>'+
            '<span class="ci-name">'+esc(prod.nombre||'(sin nombre)')+'</span>'+
            '<span class="ci-qty">×'+esc(c.cantidad||1)+'</span></div>';
        }).join('') + '</div>';
      }
      if(p.notas) body += '<div class="note">📝 '+esc(p.notas)+'</div>';
      return body;
    }
    if(p.tipo==='extra'){
      body += '<div class="note">📦 Extra / gasto adicional. Se vende como línea del pedido sin bodega.</div>';
      if(p.notas) body += '<div class="note">📝 '+esc(p.notas)+'</div>';
      return body;
    }
    if(!costos.length){
      body+='<div class="note">Sin bodegas cargadas. Toca <b>✎ Editar</b> para agregar la bodega y su costo.</div>';
    }else{
      body='<table><thead><tr><th>Bodega</th><th class="r">Costo</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>'+
        costos.map(function(c){
          var isBest=b&&c.bodega===b.bodega&&c.costo===b.costo;
          var m=(typeof c.costo==='number'&&c.costo>0)?marginPct(p.precioVenta,c.costo):null;
          var gan=(typeof c.costo==='number'&&c.costo>0&&p.precioVenta)?(p.precioVenta-c.costo):null;
          return '<tr><td'+(isBest?' class="best"':'')+'>'+esc(c.bodega)+(isBest?' ★':'')+'</td>'+
            '<td class="r num">'+fmt(c.costo)+'</td>'+
            '<td class="r num">'+(gan==null?'—':fmt(gan))+'</td>'+
            '<td class="r num mg '+mgClass(m)+'">'+(m==null?'—':pct(m))+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    if(p.notas) body+='<div class="note">📝 '+esc(p.notas)+'</div>';
    // Variaciones con precio (ml/gr)
    var vars = Array.isArray(p.variaciones) ? p.variaciones : [];
    if(vars.length){
      body += '<div class="sub" style="margin-top:10px">💰 Cantidad ('+(p.tipoVariacion||'')+') · '+vars.length+' opción'+(vars.length===1?'':'es')+'</div>';
      body += '<div class="var-gallery">' + vars.map(function(v){
        var pv = ventaOf(p, v);
        var pInfo = (pv>0) ? '<div class="var-price">'+fmt(pv)+'</div>' : '';
        return '<div class="var-thumb"><div class="var-ph">⚖️</div><div class="var-nm">'+esc(v.nombre||'')+(p.tipoVariacion||'')+'</div>'+pInfo+'</div>';
      }).join('') + '</div>';
    }
    // Variaciones visuales (color/talla)
    var varsC = Array.isArray(p.variacionesColor) ? p.variacionesColor : [];
    if(varsC.length){
      body += '<div class="sub" style="margin-top:10px">🎨 '+(p.tipoVariacionColor||'Opciones')+' · '+varsC.length+' opción'+(varsC.length===1?'':'es')+'</div>';
      body += '<div class="var-gallery">' + varsC.map(function(v){
        var thumb = v.imagen
          ? '<img src="'+esc(v.imagen)+'" alt="'+esc(v.nombre)+'" loading="lazy">'
          : '<div class="var-ph">🎨</div>';
        var dlb = v.imagen ? '<button class="var-dl" data-act="dl-varc" data-pid="'+esc(p.id)+'" data-vid="'+esc(v.id)+'" title="Descargar">⬇</button>' : '';
        var stT = (typeof v.stock==='number') ? '<div class="var-price" style="'+(v.stock>0?'':'color:var(--bad)')+'">'+(v.stock>0?v.stock+' disp.':'Agotado')+'</div>' : '';
        return '<div class="var-thumb">'+thumb+dlb+'<div class="var-nm">'+esc(nomVarColor(v))+'</div>'+stT+'</div>';
      }).join('') + '</div>';
    }
    // Videos
    var vids = Array.isArray(p.videos) ? p.videos : [];
    if(vids.length){
      body += '<div class="sub" style="margin-top:10px">🎬 Videos ('+vids.length+')</div>';
      body += '<div class="vid-list">' + vids.map(function(v){
        var sz = v.dataURL ? (Math.round(v.dataURL.length * 3/4 / 1024 / 1024 * 10)/10)+'MB' : '';
        return '<div class="vid-item"><span class="vid-ico">🎬</span><span class="vid-name">'+esc(v.nombre||'Video')+'</span><span class="vid-size">'+sz+'</span><button class="vid-dl" data-act="dl-video" data-pid="'+esc(p.id)+'" data-vidid="'+esc(v.id)+'">⬇ Descargar</button></div>';
      }).join('') + '</div>';
    }
    return body;
  }

      '</div>'+

  async function tryConnect(){
    var url=normUrl(document.getElementById('s-url').value);
    var key=(document.getElementById('s-key').value||'').trim();
    var msg=document.getElementById('s-msg');
    if(!/^https:\/\/.+/.test(url)){ msg.innerHTML='<div class="callout warn">La URL debe empezar con <b>https://</b></div>'; return; }
    if(!key||key.length<4){ msg.innerHTML='<div class="callout warn">La API Key parece incompleta.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Probando conexión…</div>';
    var testCfg={url:url,key:key};
    try{
      var r=await fetch(url+'/data',{headers:{'Content-Type':'application/json','X-API-Key':key}});
      if(r.status===401||r.status===403){ msg.innerHTML='<div class="callout warn">API Key incorrecta. Revisa que sea la misma que configuraste en el Worker.</div>'; return; }
      if(!r.ok){ msg.innerHTML='<div class="callout warn">Error '+r.status+'. Revisa la URL del Worker.</div>'; return; }
      var row=await r.json();
      cfg=testCfg; saveCfg(cfg);
      if(row&&row.data){
        var d=row.data; if(d._ts) delete d._ts;
        state=sanitize(d); lastServerStamp=row.updated_at;
      } else { state=sanitize({}); await sbSave(); }
      var cache=loadCache();
      if(cache && cache.productos && cache.productos.length && (!state.productos || !state.productos.length)){
        if(confirm('Encontré '+cache.productos.length+' producto(s) guardados en este dispositivo y la nube está vacía. ¿Subirlos?')){
          state=sanitize(cache); dirty=true; await commit();
        }
      }
      cacheState(); setConn('ok'); render(); startPolling();
      showToast('¡Conectado a Cloudflare! Sincronización activa', false);
    }catch(e){ msg.innerHTML='<div class="callout warn">No pude conectar. Revisa tu internet y la URL del Worker.</div>'; }
  }

  var srvHayUsuarios=null;   // ¿el servidor ya tiene usuarios? (null = aún no se sabe)
  async function authPost(path, body){
    var r=await fetch(cfg.url+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j={}; try{ j=await r.json(); }catch(e){}
    return {ok:r.ok, status:r.status, j:j};
  }
  async function consultarEstadoServidor(){
    try{ var r=await fetch(cfg.url+'/auth/status'); var j=await r.json(); srvHayUsuarios=!!j.hayUsuarios; }catch(e){}

  }
  // el servidor entregó un token: se guarda, se descargan los datos que le corresponden y se entra
  async function entrarConToken(j, bienvenida){
    setToken(j.token);
    session={usuarioId:j.user.id, usuarioNombre:j.user.nombre, role:j.user.role};
    saveSession(session);
    try{ dirty=false; lastServerStamp=null; await pullFromServer(false); }catch(e){}
    render(); startPolling();
    showToast((bienvenida||'Bienvenido, ')+j.user.nombre, false);
    autoStartTutorial();
  }
  async function tryRegister(){
    var name=(document.getElementById('rg-name').value||'').trim();
    var pwd=document.getElementById('rg-pwd').value||'';
    var pwd2=document.getElementById('rg-pwd2').value||'';
    var msg=document.getElementById('rg-msg');
    if(!name||name.length<2){ msg.innerHTML='<div class="callout warn">Escribe un nombre de usuario (mínimo 2 letras).</div>'; return; }
    if(pwd.length<4){ msg.innerHTML='<div class="callout warn">La contraseña debe tener al menos 4 caracteres.</div>'; return; }
    if(pwd!==pwd2){ msg.innerHTML='<div class="callout warn">Las contraseñas no coinciden.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Creando cuenta…</div>';
    try{
      var salt=randSalt(); var hash=await hashPwd(pwd, salt);
      var r=await authPost('/auth/register',{nombre:name, salt:salt, hash:hash});
      if(!r.ok||!r.j.token){ msg.innerHTML='<div class="callout warn">'+esc(r.j.error||'No se pudo crear la cuenta.')+'</div>'; return; }
      await entrarConToken(r.j, '¡Bienvenido, ');
    }catch(e){ msg.innerHTML='<div class="callout warn">No se pudo conectar con el servidor. Revisa tu internet.</div>'; }
  }
  async function tryLogin(){
    var name=(document.getElementById('lg-name').value||'').trim();
    var pwd=(document.getElementById('lg-pwd').value||'');
    var msg=document.getElementById('lg-msg');
    if(!name||!pwd){ msg.innerHTML='<div class="callout warn">Escribe usuario y contraseña.</div>'; return; }
    msg.innerHTML='<div class="callout"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> Verificando…</div>';
    try{
      // la contraseña nunca viaja: se calcula su huella aquí con la sal del usuario y solo se envía la huella
      var rs=await authPost('/auth/salt',{nombre:name});
      if(!rs.ok||!rs.j.salt){ msg.innerHTML='<div class="callout warn">No se pudo conectar con el servidor. Intenta de nuevo.</div>'; return; }
      var hash=await hashPwd(pwd, rs.j.salt);
      var rl=await authPost('/auth/login',{nombre:name, hash:hash});
      if(!rl.ok||!rl.j.token){ msg.innerHTML='<div class="callout warn">'+esc(rl.j.error||'Usuario o contraseña incorrectos.')+'</div>'; return; }
      await entrarConToken(rl.j, 'Bienvenido, ');
    }catch(e){ msg.innerHTML='<div class="callout warn">No se pudo conectar con el servidor. Revisa tu internet e intenta de nuevo.</div>'; }
  }

  /* ---------- panel de usuarios (admin) ---------- */
  function openUsers(){
    if(!isAdmin()){ showToast('Solo el admin puede ver esto', false); return; }
    var secKeyU = activeSection || 'maquillaje';
    var secNombreU = ((state.secciones||[]).find(function(x){return x.id===secKeyU;})||{}).nombre || secKeyU;
    // Solo trabajadores de la sección activa (más los admins)
    var scopedV = isScopedAdmin();
    var visibles = (state.usuarios||[]).filter(function(u){
      if(u.role==='admin'){
        if(!scopedV) return true;
        return u.id===session.usuarioId || (Array.isArray(u.secciones) && u.secciones.indexOf(secKeyU)>=0);
      }
      var arr = Array.isArray(u.secciones) ? u.secciones : ['maquillaje'];
      return arr.indexOf(secKeyU) >= 0;
    });
    var body='<div class="modal-bd" style="gap:10px">';
    body+='<p class="hint">Trabajadores asignados a la sección <b>'+esc(secNombreU)+'</b>.'+(scopedV?'':' Los admins principales ven todas las secciones; un admin de sección solo ve la suya.')+' Crea trabajadores nuevos abajo — quedarán asignados a esta sección.</p>';
    if(visibles.length){
      var mesKey=new Date().toISOString().slice(0,7);
      body+= visibles.slice().sort(function(a,b){
        // Solo cuentan pedidos de esta sección
        var av=pedidosDeSeccion().filter(function(o){return o.usuarioId===a.id;}).reduce(function(x,o){return x+(o.ventaTotal||0);},0);
        var bv=pedidosDeSeccion().filter(function(o){return o.usuarioId===b.id;}).reduce(function(x,o){return x+(o.ventaTotal||0);},0);
        return bv-av;
      }).map(function(u){
        var mine=pedidosDeSeccion().filter(function(o){return o.usuarioId===u.id;});
        var mineMes=mine.filter(function(o){return (o.fecha||'').slice(0,7)===mesKey;});
        var vendidoTotal=mine.reduce(function(a,o){return a+(o.ventaTotal||0);},0);
        var vendidoMes=mineMes.reduce(function(a,o){return a+(o.ventaTotal||0);},0);
        var isMe = session && session.usuarioId===u.id;
        var perfilInc = !u.cedula || !u.correo || !u.telefono || !u.cuentaPago;
        var otrasSecs = (!scopedV && u.role!=='admin' && Array.isArray(u.secciones)) ? u.secciones.filter(function(x){return x!==secKeyU;}).length : 0;
        var otrasSecsTag = otrasSecs>0 ? ' <span class="hint" style="color:var(--accent)">+'+otrasSecs+' sección(es)</span>' : '';
        otrasSecsTag += u.codigo ? ' <span class="hint" style="color:var(--accent)">🏷 '+esc(u.codigo)+'</span>' : '';
        return '<div class="user-row" data-uid="'+esc(u.id)+'">'+
          '<div><div class="nmrow">'+avatarHTML(u,40)+'<div class="nm">'+esc(u.nombre)+ (isMe?' <span class="hint">(tú)</span>':'') + otrasSecsTag + (perfilInc && u.role==='trabajador'?' <span class="hint" style="color:var(--warn)">⚠ perfil incompleto</span>':'') +'</div></div>'+
            '<div class="rl '+(u.role==='admin'?'a':'')+'">'+esc(u.role==='admin'?(Array.isArray(u.secciones)&&u.secciones.length?'admin de sección':'admin principal'):u.role)+' · '+mine.length+' pedidos en '+esc(secNombreU)+'</div>'+
            '<div style="font-size:12.5px;color:var(--muted);margin-top:2px">💰 Este mes: <b style="color:var(--good)">'+fmt(vendidoMes)+'</b> · Total: <b style="color:var(--ink)">'+fmt(vendidoTotal)+'</b></div>'+
            '<div class="u-act" data-act-uid="'+esc(u.id)+'">'+actividadHTML(u.id)+'</div></div>'+
          '<div class="acts">'+
            '<button data-act="us-view">👤 Ver datos</button>'+
            ((u.role!=='admin' && !scopedV) || (u.role==='admin' && !scopedV && !isMe)?'<button data-act="us-secs">🗂 '+(u.role==='admin'?'Alcance':'Secciones')+'</button>':'')+
            '<button data-act="us-pwd">🔑 Contraseña</button>'+
            (!scopedV ? (u.role!=='admin'
              ? '<button data-act="us-mkadmin">Admin total</button><button data-act="us-mkscoped">Admin de esta sección</button>'
              : (!isMe ? ((Array.isArray(u.secciones)&&u.secciones.length?'<button data-act="us-mkadmin">Dar acceso total</button>':'')+(state.usuarios.filter(function(x){return x.role==='admin' && !(Array.isArray(x.secciones)&&x.secciones.length);}).length>1 || (Array.isArray(u.secciones)&&u.secciones.length)?'<button data-act="us-mkuser">Quitar admin</button>':'')) : ''))
              : (u.role!=='admin' ? '<button class="del" data-act="us-rmsec">Quitar del grupo</button>' : ''))+
            (!isMe && !scopedV?'<button class="del" data-act="us-del">🗑</button>':'')+
          '</div>'+
        '</div>';
      }).join('');
    }else{
      body+='<div class="empty" style="padding:20px 10px"><p style="text-align:center;color:var(--muted)">No hay trabajadores asignados a esta sección todavía.</p></div>';
    }
    body+='<hr style="border:none;border-top:1px solid var(--border);margin:6px 0">';
    body+='<div class="sub" style="margin-top:0">Nuevo trabajador</div>';
    body+='<div class="f2"><div class="field"><label>Nombre completo *</label><input type="text" id="nu-name" placeholder="Ej: María Pérez López"></div>'+
      '<div class="field"><label>Contraseña *</label><input type="text" id="nu-pwd" placeholder="Al menos 4 caracteres"></div></div>';
    body+='<div class="f2"><div class="field"><label>Número de cédula</label><input type="text" inputmode="numeric" id="nu-cedula" placeholder="1234567890"></div>'+
      '<div class="field"><label>Teléfono</label><input type="tel" inputmode="tel" id="nu-tel" placeholder="3001234567"></div></div>';
    body+='<div class="field"><label>Correo</label><input type="email" id="nu-correo" placeholder="maria@ejemplo.com"></div>';

    body+='<div style="display:flex; gap:8px; align-items:center">'+(scopedV?'<input type="checkbox" id="nu-admin" style="display:none">':'<label style="display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)"><input type="checkbox" id="nu-admin"> Crear como admin</label>')+
      '<button class="btn primary" data-act="us-create" style="margin-left:auto">＋ Añadir trabajador</button></div>';
    body+='</div>';

      '<div class="modal-ft"><button class="btn ghost" data-role="close" style="margin-left:auto">Cerrar</button></div>'+

  async function createUser(){
    var name=(document.getElementById('nu-name').value||'').trim();
    var pwd=(document.getElementById('nu-pwd').value||'');
    var asAdmin=document.getElementById('nu-admin').checked && !isScopedAdmin();
    if(name.length<2){ showToast('Nombre muy corto',false); return; }
    if(pwd.length<4){ showToast('La contraseña debe tener 4+ caracteres',false); return; }
    if(findUser(name)){ showToast('Ya existe un usuario con ese nombre',false); return; }
    var cedula=(document.getElementById('nu-cedula').value||'').trim();
    var telefono=(document.getElementById('nu-tel').value||'').trim();
    var correo=(document.getElementById('nu-correo').value||'').trim();
    var rpn=leerPago('nu');
    if(rpn.err){ showToast(rpn.err,false); return; }
    var cuentaPago=rpn.texto||'';
    var salt=randSalt(); var hash=await hashPwd(pwd, salt);
    state.usuarios.push({
      id:uidUser(), nombre:name, salt:salt, hash:hash,
      role:asAdmin?'admin':'trabajador', createdAt:new Date().toISOString(),
      cedula:cedula, telefono:telefono, correo:correo, cuentaPago:cuentaPago, pago:rpn.pago||null,
      secciones: asAdmin ? [] : [activeSection||'maquillaje']
    });
    asegurarCodigos();
    scheduleSave(); openUsers();
    showToast('Trabajador "'+name+'" creado',false);
  }

  function marcaUpper(m){ return String(m||'').trim().toUpperCase(); }

    var sec = activeSection || 'maquillaje';

    return state.marcasPorSeccion[sec];
  }
  function findMarcaCanonica(name){
    var k=marcaUpper(name); if(!k) return '';
    var f=(marcasDeSeccion()).find(function(x){return marcaUpper(x)===k;});
    return f || '';
  }
  function ensureMarca(name){
    var n=String(name||'').trim(); if(!n) return '';
    var existing=findMarcaCanonica(n); if(existing) return existing;
    marcasDeSeccion().push(n);
    // Espejo global (unión)
    if(Array.isArray(state.marcas) && state.marcas.indexOf(n)<0) state.marcas.push(n);
    return n;
  }

  var ACT_DATA=null, ACT_AT=0, _actPend=null;
  function actividadHTML(uid){

    if(!a) return '<span class="u-act-t muted">Sin actividad registrada todavía</span>';
    var d=new Date(a.ultima), min=Math.floor((Date.now()-d.getTime())/60000), tz={timeZone:'America/Bogota'};
    var dev = a.disp==='celular' ? ' · 📱' : ' · 💻';
    if(min<5) return '<span class="u-act-t on"><i></i>Activo ahora'+dev+'</span>';
    var txt;
    if(min<60) txt='hace '+min+' min';
    else {
      var k=function(x){ return x.toLocaleDateString('en-CA',tz); }, hora=d.toLocaleTimeString('es-CO',Object.assign({hour:'numeric',minute:'2-digit'},tz));
      if(k(d)===k(new Date())) txt='hoy '+hora;
      else if(k(d)===k(new Date(Date.now()-864e5))) txt='ayer '+hora;
      else txt=d.toLocaleDateString('es-CO',Object.assign({day:'numeric',month:'short'},tz))+' · '+hora;
    }
    var viejo = min>7*24*60;
    return '<span class="u-act-t'+(viejo?' old':'')+'"><i></i>Activo '+txt+dev+'</span>';
  }

  /* ---------- método de pago del trabajador: Nequi · Bancolombia · Bre-B ---------- */
  var PAGO_MET={nequi:'Nequi', bancolombia:'Bancolombia', breb:'Bre-B'};
  var BREB_LLAVES={celular:'Celular', cedula:'Cédula', correo:'Correo', alfa:'Llave alfanumérica (@)'};
  function pagoDe(u){
    if(u && u.pago && u.pago.metodo) return Object.assign({}, u.pago);
    var t=String((u&&u.cuentaPago)||''), d=t.replace(/\D/g,''), lo=t.toLowerCase();
    if(/bancolombia/.test(lo)) return {metodo:'bancolombia', tipoCuenta:/corriente/.test(lo)?'corriente':'ahorros', numero:d};
    if(/bre-?b/.test(lo)) return {metodo:'breb', tipoLlave:'celular', llave:d||t};
    if(d.length===10 && d.charAt(0)==='3') return {metodo:'nequi', numero:d};
    return {metodo:'', anterior:t};
  }
  function pagoTexto(pg){
    if(!pg||!pg.metodo) return '';
    if(pg.metodo==='nequi') return 'Nequi · '+pg.numero;
    if(pg.metodo==='bancolombia') return 'Bancolombia · '+(pg.tipoCuenta==='corriente'?'Corriente':'Ahorros')+' · '+pg.numero;
    return 'Bre-B · '+(BREB_LLAVES[pg.tipoLlave]||'Llave')+' · '+pg.llave;
  }
  function pagoFieldsHTML(pre, u){
    var pg=pagoDe(u);

  /* ---------- códigos de vendedor (los clientes los escriben en la tienda web) ---------- */
  function normCodigo(c){ return String(c||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'').slice(0,12); }
  // Asigna un código a quien no tenga (4 letras del nombre + 2 números). Devuelve true si cambió algo.
  function asegurarCodigos(){
    var cambio=false, used={};
    (state.usuarios||[]).forEach(function(u){ var c=normCodigo(u.codigo); if(c){ if(u.codigo!==c){ u.codigo=c; cambio=true; } used[c]=1; } });
    (state.usuarios||[]).forEach(function(u){
      if(normCodigo(u.codigo)) return;
      var base=normCodigo(String(u.nombre||'').trim().split(/\s+/)[0]).slice(0,4);
      if(base.length<3) base=(base+'VEN').slice(0,3);
      var h=0; for(var i=0;i<String(u.id).length;i++) h=(h*31+String(u.id).charCodeAt(i))%90;
      var c, t=0; do{ c=base+(10+(h+t)%90); t++; }while(used[c] && t<200);
      u.codigo=c; used[c]=1; cambio=true;
    });
    return cambio;
  }
  function codigoDisponible(code, uid){ return !(state.usuarios||[]).some(function(x){ return x.id!==uid && normCodigo(x.codigo)===code; }); }

  // Convierte el pedido de la web en un pedido normal de la plataforma (mismo formato que saveCart)
  function pedidoDesdeWeb(w){
    var costo=0, venta=0, mayo=0, units=0;
    var vend = (w.vendedor && w.vendedor.id) ? state.usuarios.find(function(x){ return x.id===w.vendedor.id; }) : null;
    var items=(w.items||[]).map(function(it){
      var p=state.productos.find(function(x){return x.id===it.productId;})||{};
      var vari=variacionDe(p, it.variacionId);
      var b=best(p)||{};
      var vc=costoVariacion(vari);
      var c=(vc!=null)?vc:(b.costo||0);
      var cant=parseInt(it.cantidad,10)||1, precio=+it.precio||0;
      var may=vend ? mayoristaOf(p, vari) : precio;   // con vendedor: gana (venta - mayorista); sin vendedor: todo es de la empresa
      costo+=c*cant; venta+=precio*cant; mayo+=may*cant; units+=cant;
      return {
        productId:it.productId, nombre:it.nombre||p.nombre||'(producto borrado)', bodega:b.bodega||'',
        costo:c, mayorista:may, precio:precio, precioSugerido:precio, cantidad:cant,
        variacionId:it.variacionId||'', variacionNombre:it.variacionNombre||'', tipoVariacion: it.variacionId?(it.tipoVariacion||''):'',
        variacionColorId:it.variacionColorId||'', variacionColorNombre:it.variacionColorNombre||'', tipoVariacionColor: it.variacionColorId?(it.tipoVariacionColor||''):''
      };
    });
    var now=w.fecha||new Date().toISOString(), c=w.cliente||{};
    return {
      id:w.id, fecha:now, seccion:w.seccion||'calzado', origen:'web', numeroWeb:w.numero||'',
      cliente:{nombre:c.nombre||'', tel:c.tel||'', direccion:c.direccion||'', ciudad:c.ciudad||'', notas:c.notas||''},
      items:items,
      // pedido de la tienda: si el cliente puso el código de un vendedor, la venta es suya; si no, todo es de la empresa
      costoTotal:costo, mayoristaTotal:mayo, ventaTotal:venta,
      gananciaEmpresa:mayo-costo, gananciaTrabajador:venta-mayo, gananciaTotal:venta-costo, ganancia:venta-costo,
      codigoVendedor:(w.vendedor&&w.vendedor.codigo)||'',
      unidades:units, usuarioId:vend?vend.id:'', usuarioNombre:vend?vend.nombre:'Tienda web',
      estado:{ realizado:{at:now, by:'Tienda web'}, envio:null, venta:null }
    };
  }

  /* ---------- helpers de imagen ---------- */
  function fileToCompressedDataURL(file, maxDim, quality){
    maxDim = maxDim || 800; quality = quality || 0.78;
    return new Promise(function(resolve, reject){
      if(!file){ reject(new Error('sin archivo')); return; }
      if(!/^image\//.test(file.type)){ reject(new Error('no es imagen')); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('error leyendo')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('imagen inválida')); };
        img.onload = function(){
          var w=img.width, h=img.height;
          if(w>maxDim || h>maxDim){
            if(w>h){ h = Math.round(h*maxDim/w); w=maxDim; }
            else { w = Math.round(w*maxDim/h); h=maxDim; }
          }
          var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          try{ resolve(cv.toDataURL('image/jpeg', quality)); }
          catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function downloadDataURL(dataURL, filename){

        document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },300);
      }).catch(function(){ showToast('No se pudo descargar', false); });
      return;
    }
    try{
      var a=document.createElement('a');
      a.href=dataURL; a.download=filename||'imagen.jpg';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); }, 100);
    }catch(e){ showToast('No se pudo descargar', false); }
  }

  /* ---------- modal producto ---------- */
  var host=document.getElementById('modal-host');
  function closeModal(){ host.innerHTML=''; }
  /* ---------- secciones como páginas completas (no ventanas emergentes) ----------
     Las pantallas grandes (Pedidos, Comisiones, Trabajadores, perfil, productos…) ocupan toda la pantalla,
     con botón "Volver" y compatibles con el botón atrás del navegador. Los avisos y selectores pequeños siguen siendo ventanas. */
  (function(){
    var PAGINAS=/^\s*(Trabajadores|Mi panel|Editar datos|Marcas de|Bodegas de|Ranking|Notificaciones|Comisiones|Pagar comisión|Mis pagos|Pedidos de la sección|Mis pedidos|Nuevo producto|Editar producto|Pedido\s*$|Venta\s*$)/;
    var activa=false, ignorar=false;
    function aplicar(){
      var scrim=host.querySelector('.scrim'), h2=scrim&&scrim.querySelector('.modal-hd h2');
      var esPagina=!!(scrim && h2 && PAGINAS.test(h2.textContent));
      if(esPagina){
        if(!scrim.classList.contains('pv')){
          scrim.classList.add('pv'); scrim.removeAttribute('data-role');
          var hd=scrim.querySelector('.modal-hd'), modal=scrim.querySelector('.modal');
          var back=document.createElement('button'); back.type='button'; back.className='pv-back'; back.setAttribute('aria-label','Volver');
          back.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Volver</span>';
          back.addEventListener('click', function(){
            var t=h2.textContent;
            if(modal && modal.getAttribute('data-oid')) openHistory();          // del detalle de un pedido a la lista
            else if(/^\s*Pagar comisión/.test(t)) openComisiones();
            else closeModal();
          });
          hd.insertBefore(back, hd.firstChild);
          scrim.scrollTop=0;
        }
        if(!activa){ activa=true; document.documentElement.classList.add('pv-open'); try{ history.pushState({pv:1},''); }catch(e){} }
      } else if(activa){
        activa=false; document.documentElement.classList.remove('pv-open');
        if(history.state && history.state.pv){ ignorar=true; try{ history.back(); }catch(e){ ignorar=false; } }
      }
    }
    new MutationObserver(aplicar).observe(host,{childList:true});
    // botón atrás del navegador / gesto de volver del celular: cierra la página
    window.addEventListener('popstate', function(){
      if(ignorar){ ignorar=false; return; }
      if(activa){ activa=false; document.documentElement.classList.remove('pv-open'); host.innerHTML=''; }
    });
  })();

    // Galería de fotos para la tienda web
    var galEl=modal.querySelector('[data-role="gal-rows"]'), galFile=modal.querySelector('[data-role="galfile"]');
    function galRender(){ galEl.innerHTML=p.galeria.map(function(u,i){ return '<div class="gal-th"><img src="'+u+'" alt=""><button type="button" data-role="galrm" data-i="'+i+'" aria-label="Quitar">×</button></div>'; }).join(''); }
    galFile.addEventListener('change', async function(e){
      var files=Array.prototype.slice.call(e.target.files||[]); e.target.value='';
      for(var k=0;k<files.length;k++){
        if(p.galeria.length>=8){ showToast('Máximo 8 fotos adicionales', false); break; }
        try{ p.galeria.push(await fileToCompressedDataURL(files[k], 800, 0.72)); }catch(err){ showToast('No se pudo cargar una imagen', false); }

      galRender();
